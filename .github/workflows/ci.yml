name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        # Docker Hub limits anonymous pulls; this repository's own runs pull signed in. A fork's
        # pull request gets empty credentials and pulls anonymously, as before.
        credentials:
          username: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DOCKERHUB_TOKEN || '' }}
        env:
          POSTGRES_PASSWORD: mendari-test
          POSTGRES_DB: mendari_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MENDARI_TEST_DATABASE_URL: postgresql://postgres:mendari-test@localhost:5432/mendari_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - name: Postgres 16 client tools, to match the service (a newer pg_dump writes settings 16 rejects)
        run: |
          if ! /usr/lib/postgresql/16/bin/pg_dump --version 2>/dev/null; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: The API examples work, in open mode and with a service key (README, snippets)
        run: uv run python scripts/check_doc_snippets.py
      - run: uv run mendari test mendari/patient-inbox-router
      - run: uv run mendari test mendari/clinical-trial-prescreener
      - run: uv run mendari test mendari/referral-router
      - run: uv run mendari test mendari/prior-auth-preflight
      - run: uv run mendari test mendari/ai-guard
      - name: Every community pack passes its behaviour tests (a core change that breaks one shows here)
        run: |
          failed=0
          for manifest in community-packs/*/pack.yaml; do
            [ -f "$manifest" ] || continue
            uv run mendari test "$(dirname "$manifest")" || failed=1
          done
          exit $failed

  browser:
    # The dashboard in a real browser (tests/browser, skipped by the default pytest run), then the
    # launch gates, whose probes run browser tests and both databases' cases.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        # Docker Hub limits anonymous pulls; this repository's own runs pull signed in. A fork's
        # pull request gets empty credentials and pulls anonymously, as before.
        credentials:
          username: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DOCKERHUB_TOKEN || '' }}
        env:
          POSTGRES_PASSWORD: mendari-test
          POSTGRES_DB: mendari_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Postgres 16 client tools, to match the service (a newer pg_dump writes settings 16 rejects)
        run: |
          if ! /usr/lib/postgresql/16/bin/pg_dump --version 2>/dev/null; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
      # A report, never a gate on a pull request: it fails only when launch/gates.yaml itself is
      # wrong (a test it names is gone, an attestation where none belongs). Here because its
      # probes include browser tests.
      - name: The launch gates (launch/gates.yaml), in the run's summary
        env:
          MENDARI_TEST_DATABASE_URL: postgresql://postgres:mendari-test@localhost:5432/mendari_test
        run: |
          uv run python scripts/check_gates.py > /tmp/gates.md
          cat /tmp/gates.md
          cat /tmp/gates.md >> "$GITHUB_STEP_SUMMARY"

  reference-pack:
    # Derived pack artifacts (synthetic data, trained model) must be reproducible from source,
    # and the scoreboard's results store append-only and recomputable (LP-17f).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the base commit, for the results store's check
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: The scoreboard's page is the results store's (LP-17f)
        # Before the build, which writes the page again.
        run: uv run python scripts/scoreboard_page.py --check
      - run: ./scripts/build-reference-pack.sh
      - name: Data, models and ledgers are byte-identical, and the build made nothing new
        run: |
          git diff --exit-code -- packs datasets ':!packs/*/evals/benchmark.json' ':!packs/*/DECISION_CARD.md'
          made=$(git status --porcelain --untracked-files=all -- packs datasets | grep '^??' || true)
          test -z "$made" || { echo "::error::the build made files that are not committed: $made"; exit 1; }
      - name: Each benchmark's result is the committed one, byte for byte, and its ledger's (LP-10)
        run: uv run python scripts/check_eval_results.py
      - name: The trial pack's local-site example evaluates identically through OMOP CDM
        run: uv run mendari sandbox omop-check --dataset datasets/trial-local-site-example.jsonl
      - name: The scoreboard's results store is append-only, and each result is what its inputs give (LP-17f)
        # Against the pull request's base, or on a push the commit it was pushed onto: nothing
        # stored there is removed or changed but a valid signature added to an unsigned result.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/check_scoreboard.py --base "$BASE"

  r4-structure:
    # The structural R4 gate's rules are derived from HL7's R4 JSON Schema, pinned by digest:
    # regenerating them must change nothing. The download is cached by that digest, so an
    # hl7.org outage only matters on a cold cache.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: var/fhir-packages/fhir.schema.json.zip
          key: fhir-r4-schema-2230406893b4cf002a4ee1e5e2bbeca22ac5d2d4931b3e9ef7b9594bbc376a01
      - run: uv sync --locked
      - run: uv run python scripts/fhir_r4_schema.py
      - name: The derived file is byte-identical
        run: git diff --exit-code -- src/mendari/standards/fhir_r4_structure.json

  fhir-conformance:
    # US Core 6.1.0 with the official HL7 FHIR validator: what Mendari accepts or produces as
    # conforming has no errors and no unexpected warnings, and every resource the in-process
    # checks flag is an error for the validator too (scripts/fhir_validate.py). Mendari's own
    # terminology is loaded as a folder, so a code it emits that its CodeSystem lacks is an error.
    # The validator loads only the FHIR packages scripts/fhir_packages.lock pins, each checked
    # against its sha256, and runs with no HTTP access (--offline), so it can fetch nothing else.
    # Each run has a package cache of its own with only what it loads, so the US Core run holds
    # no other US Core and no Da Vinci guide for a canonical a resource cites to pull in.
    runs-on: ubuntu-latest
    env:
      VALIDATOR_VERSION: "6.10.4"
      VALIDATOR_SHA256: 1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        # Only downloads, each checked against its sha256 below on every run; each validator
        # run's package cache is built afresh from them, so nothing unchecked is restored.
        with:
          path: |
            var/validator/validator_cli.jar
            var/fhir-packages
          key: fhir-validator-${{ env.VALIDATOR_VERSION }}-packages-${{ hashFiles('scripts/fhir_packages.lock') }}
      - name: Download the HL7 FHIR validator (pinned, checksum verified)
        run: |
          mkdir -p var/validator
          if [ ! -f var/validator/validator_cli.jar ]; then
            curl -sSfL -o var/validator/validator_cli.jar \
              "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          fi
          echo "${VALIDATOR_SHA256}  var/validator/validator_cli.jar" | sha256sum -c -
      - name: Download the FHIR packages the validator loads (scripts/fhir_packages.lock, checksum verified)
        # One line per package: name, version, sha256, URL. A mismatch fails the job here.
        run: |
          mkdir -p var/fhir-packages
          while read -r name version sha256 url; do
            file="var/fhir-packages/${name}-${version}.tgz"
            if [ ! -f "$file" ]; then
              curl -sSfL --retry 3 -o "$file" "$url"
            fi
            echo "${sha256}  $file" | sha256sum -c -
          done < <(grep -Ev '^(#|$)' scripts/fhir_packages.lock)
      - run: uv sync --locked
      - run: uv run python scripts/fhir_terminology.py var/fhir-terminology
      - run: uv run python scripts/audit_fhir_sample.py var/fhir-samples/audit-export.json
      - run: uv run python scripts/task_fhir_sample.py var/fhir-samples
      - run: uv run python scripts/sandbox_fhir_sample.py var/fhir-samples
      - run: uv run python scripts/fhir_output_sample.py var/fhir-samples
      - run: >-
          uv run python scripts/fhir_validate.py --offline
          --ig var/fhir-terminology
          --valid tests/fixtures/us-core/*.json var/fhir-samples/*.json var/fhir-terminology/*.json
          --invalid tests/fixtures/us-core/invalid/*.json
      - run: uv run python scripts/davinci_sample.py var/fhir-samples/davinci
      - name: Da Vinci resources conform to their implementation guides
        # With the CapabilityStatement (scripts/fhir_output_sample.py), which cites DTR's operation.
        run: >-
          uv run python scripts/fhir_validate.py --offline
          --ig var/fhir-terminology
          --ig var/fhir-packages/hl7.fhir.us.davinci-crd-2.2.1.tgz
          --ig var/fhir-packages/hl7.fhir.us.davinci-dtr-2.2.0.tgz
          --ig var/fhir-packages/hl7.fhir.us.davinci-pas-2.2.1.tgz
          --valid var/fhir-samples/davinci/*.json

  sandbox-e2e:
    # The roadmap's v0.4 exit on the real sandbox (docker compose): HAPI FHIR, the SMART launcher
    # and the engine. The inbox and referral packs run from a scripted SMART EHR launch, and every
    # input they decide on conforms to US Core. A second engine (profile `signin`) has sign-in on
    # and the launcher registered for organization `pilot` (ADR-0006): its launches must decide
    # in that organization, chained as the launcher's `<issuer>|<subject>`. Last, a signed CDS
    # client (compose service `cds-client`, LP-23e) calls both engines' CDS Hooks services over
    # HTTP with its own tokens, on the vendor-shaped EHR profile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to Docker Hub (this repository's own runs; a fork's pulls anonymously)
        # Dependabot's pull requests get no repository secrets: they pull anonymously too.
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        # Signing in only raises the pull limit: if Docker Hub fails it, pull anonymously.
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Throwaway PHI keys for the signed-in engine (sign-in never runs `off`)
        # Masked, and in $GITHUB_ENV so every later compose call interpolates the same keys.
        run: |
          for name in MENDARI_PHI_KEY MENDARI_INPUT_HASH_KEY; do
            key=$(python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
      - run: docker compose --profile signin up -d --build --wait engine launcher engine-signin
      - name: Wait until the workflow has seeded both packs
        run: |
          docker compose up -d workflow
          for i in $(seq 1 60); do
            total=$(curl -s -H 'cache-control: no-cache' \
              'http://127.0.0.1:8080/fhir/ServiceRequest?_tag=https%3A%2F%2Fmendari.co%2Ffhir%2Fsandbox%7Csynthetic&_summary=count' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total", 0))' 2>/dev/null || echo 0)
            [ "${total:-0}" -gt 0 ] && echo "seeded ($total referrals)" && exit 0
            sleep 5
          done
          docker compose logs workflow
          exit 1
      - name: SMART launch, referral pack
        run: >-
          docker compose exec -T engine mendari sandbox smart-launch --strict
          --engine http://engine:8000 --launcher http://launcher --fhir http://fhir:8080/fhir
          --pack mendari/referral-router
      - name: SMART launch, inbox pack
        run: >-
          docker compose exec -T engine mendari sandbox smart-launch --strict
          --engine http://engine:8000 --launcher http://launcher --fhir http://fhir:8080/fhir
          --pack mendari/patient-inbox-router
      - name: The launcher, as `mendari smart check` sees it with sign-in on
        run: docker compose exec -T engine-signin mendari smart check http://launcher/v/r4/fhir
      - name: SMART launch with sign-in on, referral pack, in the registered organization
        run: >-
          docker compose exec -T engine-signin mendari sandbox smart-launch --strict
          --engine http://engine-signin:8000 --launcher http://launcher --fhir http://fhir:8080/fhir
          --pack mendari/referral-router --expect-org pilot --db /data/mendari.db
      - name: SMART launch with sign-in on, inbox pack, in the registered organization
        run: >-
          docker compose exec -T engine-signin mendari sandbox smart-launch --strict
          --engine http://engine-signin:8000 --launcher http://launcher --fhir http://fhir:8080/fhir
          --pack mendari/patient-inbox-router --expect-org pilot --db /data/mendari.db
      - name: Bulk export -> dataset -> mendari eval (referral pack)
        # The export's cases must evaluate exactly like the same cases read from the dataset file.
        run: >-
          docker compose exec -T engine mendari sandbox bulk-check
          --fhir http://fhir:8080/fhir --pack mendari/referral-router
      - name: A signed CDS client over HTTP, on the open engine (sandbox flag) and the signed-in one
        # LP-23e: another container seeds the vendor-shaped EHR profile, serves its JWK Set and
        # calls discovery and every standard hook with its own ES384 tokens, as an EHR does. Any
        # answer but a 200, a hook answer that is not CDS Hooks', or a card saying a read failed
        # (anything unread but an RTF note, `notes: unsupported_type`), fails the job.
        run: docker compose --profile signin run --rm -T --use-aliases cds-client
      - if: failure()
        run: docker compose --profile signin logs --tail 200

  hub-site:
    # The Hub website (hub/, Next.js) against a real registry holding the five reference packs.
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start a registry and publish the five packs, and one whose text tries to run a script
        # Background servers run from the venv, not `uv run`: a live `uv run` process holds the uv
        # cache lock, and the setup-uv post step then times out pruning the cache (uv 0.12).
        run: |
          .venv/bin/mendari registry serve --db /tmp/registry.db --port 8100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/v1/health && break; sleep 1; done
          uv run python scripts/hub_seed.py --registry http://127.0.0.1:8100 --db /tmp/registry.db --hostile-example --sites
          .venv/bin/mendari registry verify --db /tmp/registry.db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
        working-directory: hub
      - run: npm run lint
        working-directory: hub
      - run: npm run typecheck
        working-directory: hub
      - run: npm run build
        working-directory: hub
      - run: npx playwright install --with-deps chromium
        working-directory: hub
      - run: npm test
        working-directory: hub
        env:
          CI: "1"
      - name: Start the built site for the scanner
        working-directory: hub
        run: |
          mkdir -p /tmp/zap && chmod 777 /tmp/zap
          npm run start > /tmp/zap/hub.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/ > /dev/null && exit 0; sleep 1; done; exit 1
      - name: OWASP ZAP baseline scan of every Hub page (pinned image), medium and high fail
        # The baseline (passive) scan spiders the site the registry above serves, the hostile
        # example included; scripts/zap_check.py fails on a medium or high alert (LP-18f).
        run: >-
          docker run --rm --network host -v /tmp/zap:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
          zap-baseline.py -t http://127.0.0.1:3100 -J zap.json -I
      - name: No medium or high risks on the Hub
        run: uv run python scripts/zap_check.py /tmp/zap/zap.json

  hub-e2e:
    # The v0.5 exit: on a clean machine, `pip install mendari && mendari pull
    # mendari/referral-router` works. The wheel, built from the sdist, stands in for PyPI until
    # the release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start a registry and publish the five packs
        run: |
          .venv/bin/mendari registry serve --db /tmp/registry.db --port 8100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/v1/health && break; sleep 1; done
          uv run python scripts/hub_seed.py --registry http://127.0.0.1:8100 --db /tmp/registry.db
      - name: Build the sdist, then the wheel from it; the sdist holds only the build inputs
        # PyPI files can never be replaced: notes, agent and CI configuration, deploy templates
        # and the websites must not reach a release (scripts/check_sdist.py), nor notes, plans,
        # agent or CI files at any depth in either package (scripts/check_excluded.py), nor
        # SNOMED CT content (scripts/check_snomed.py, LP-14).
        run: |
          uv build --out-dir /tmp/dist
          uv run python scripts/check_sdist.py /tmp/dist/mendari-*.tar.gz
          python3 scripts/check_excluded.py /tmp/dist/mendari-*.tar.gz /tmp/dist/*.whl
          uv run python scripts/check_snomed.py /tmp/dist/mendari-*.tar.gz /tmp/dist/*.whl
      - name: A clean virtual environment installs mendari, pulls a pack and tests it
        env:
          HOME: /tmp/clean-home
          MENDARI_REGISTRY_URL: http://127.0.0.1:8100
        run: |
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet /tmp/dist/*.whl
          /tmp/clean/bin/mendari pull mendari/referral-router > /tmp/pull.txt
          cat /tmp/pull.txt
          # The wheel's bundled pack is the checkout's: the pulled copy keeps the maintained
          # engine (ADR-0009), which the referral pack's lookahead needs.
          grep -q "a copy of the reference pack in this release" /tmp/pull.txt
          version=$(sed -n 's/^version: //p' packs/referral-router/pack.yaml)
          test -f "/tmp/clean-home/.cache/mendari/packs/mendari/referral-router/$version/pack.yaml"
          /tmp/clean/bin/mendari test mendari/referral-router
          /tmp/clean/bin/mendari search --risk 2
          /tmp/clean/bin/mendari new /tmp/refill-router --id my-clinic/refill-router
          /tmp/clean/bin/mendari test /tmp/refill-router

  cql:
    # v0.7: the trial pack's criteria in CQL (logic/criteria.cql) must answer exactly like the
    # `criteria` provider on every test and dataset case, on HAPI FHIR's Clinical Reasoning module.
    runs-on: ubuntu-latest
    services:
      cql:
        image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
        # Docker Hub limits anonymous pulls; this repository's own runs pull signed in. A fork's
        # pull request gets empty credentials and pulls anonymously, as before.
        credentials:
          username: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DOCKERHUB_TOKEN || '' }}
        ports: ["58090:8080"]
        env:
          HAPI_FHIR_FHIR_VERSION: R4
          HAPI_FHIR_CR_ENABLED: "true"
    env:
      MENDARI_CQL_URL: http://127.0.0.1:58090/fhir
      MENDARI_FHIR_ALLOWED_SERVERS: http://127.0.0.1:58090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Wait for the CQL engine
        run: for i in $(seq 1 90); do curl -sf "$MENDARI_CQL_URL/metadata" > /dev/null && exit 0; sleep 3; done; exit 1
      - name: CQL agrees with criteria on the pack's tests and datasets
        run: >-
          uv run mendari agreement mendari/clinical-trial-prescreener
          --slot structured --variants criteria cql
      - name: and on the local-site example (other units, codes and languages)
        run: >-
          uv run mendari agreement mendari/clinical-trial-prescreener
          --slot structured --variants criteria cql
          --dataset datasets/trial-local-site-example.jsonl
      - name: The pack's behaviour tests pass with the CQL variant deployed
        run: uv run mendari test mendari/clinical-trial-prescreener --provider structured=cql

  security:
    # v1.0 security review, on every change (docs/security/threat-model.md): no known-vulnerable
    # dependencies, and an OWASP ZAP scan of the running API with sign-in on, where medium and
    # high risks fail (scripts/zap_check.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Python dependencies have no known vulnerabilities (pip-audit, itself locked)
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uv run --frozen pip-audit --disable-pip --no-deps -r /tmp/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: The Hub website's runtime dependencies have no high or critical advisories (npm audit)
        working-directory: hub
        run: npm audit --omit=dev --audit-level=high
      - name: The Hub website's dependencies, dev tools included, have no critical advisories (npm audit)
        # Dev tools (the linter's config, say) never reach the site; a high advisory there with
        # no fixed version (braces, GHSA-vfj7-8cjw-p6xm) must not stop every change.
        working-directory: hub
        run: npm audit --audit-level=critical
      - name: Start the engine with sign-in on, and an administrator's session for the scanner
        # Keys are viewer or service only (ADR-0004), so the scanner signs in as a person would:
        # a session row for an admin, sent as the session cookie, with the header Mendari's own
        # pages send (`X-Mendari-Request`): a read with the cookie and no Fetch Metadata needs it.
        # The scan calls the decide routes thousands of times as one admin: limits run in `log`
        # mode, so the limiter's code is exercised but never refuses.
        env:
          MENDARI_OIDC_ISSUER: https://idp.example.org
          MENDARI_OIDC_CLIENT_ID: mendari
          MENDARI_RATE_LIMITS: log
          MENDARI_PHI_MODE: encrypt  # as a signed-in deployment runs it
        run: |
          mkdir -p /tmp/zap && chmod 777 /tmp/zap
          export MENDARI_PHI_KEY=$(python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
          export MENDARI_INPUT_HASH_KEY=$(python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
          sid=$(uv run python -c "import secrets, time; from mendari.core.audit import AuditStore; sid = secrets.token_urlsafe(32); AuditStore('/tmp/zap/scan.db').smart_put(sid, 'user', {'sub': 'zap', 'name': 'zap', 'roles': ['admin'], 'org': 'default'}, int(time.time()) + 7200); print(sid)")
          echo "::add-mask::$sid"
          echo "ZAP_SESSION=$sid" >> "$GITHUB_ENV"
          .venv/bin/mendari serve --port 8000 --db /tmp/zap/scan.db > /tmp/zap/engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && exit 0; sleep 1; done; exit 1
      - name: OWASP ZAP API scan (pinned image)
        run: >-
          docker run --rm --network host -v /tmp/zap:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
          zap-api-scan.py -t http://127.0.0.1:8000/openapi.json -f openapi -J zap.json -I
          -z "-config replacer.full_list(0).description=auth
          -config replacer.full_list(0).enabled=true
          -config replacer.full_list(0).matchtype=REQ_HEADER
          -config replacer.full_list(0).matchstr=Cookie
          -config replacer.full_list(0).regex=false
          -config replacer.full_list(0).replacement=mendari_session=${ZAP_SESSION}
          -config replacer.full_list(1).description=own-request
          -config replacer.full_list(1).enabled=true
          -config replacer.full_list(1).matchtype=REQ_HEADER
          -config replacer.full_list(1).matchstr=X-Mendari-Request
          -config replacer.full_list(1).regex=false
          -config replacer.full_list(1).replacement=1"
      - name: No medium or high risks
        run: uv run python scripts/zap_check.py /tmp/zap/zap.json
      - if: failure()
        run: tail -50 /tmp/zap/engine.log

  secrets:
    # No secret anywhere in the history: scripts/secret_scan.sh (gitleaks, pinned there) over every
    # commit this run can see, merge resolutions and a pull request's own commits included; then
    # the positive control, which must find keys planted where only a full scan looks. Every ref,
    # pull requests' heads too, weekly: secrets.yml. Reviewed false positives are allowed,
    # narrowly and with the reason, in .gitleaks.toml. A finding is revoked and rotated, then removed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks over the full history
        run: sh scripts/secret_scan.sh
      - name: The positive control finds the planted keys
        run: sh scripts/secret_scan_control.sh

  dco:
    # Every commit a pull request brings is signed off by its author (Developer Certificate of
    # Origin 1.1, CONTRIBUTING.md). Merges, named bots and history before the rule are exempt.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py --base "$BASE" --head "$HEAD"

  docs:
    # v1.0: the documentation site (mkdocs.yml, every page in docs/) builds with no broken
    # link, anchor or page left out of the navigation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - run: uv run mkdocs build --strict
      - name: The site holds no notes, plans, agent or CI files, and every page the notice
        run: |
          python3 scripts/check_excluded.py site
          python3 scripts/check_site_notice.py site

  quickstart:
    # The v1.0 exit: a new user goes from the README to their own local validation in under 10
    # minutes. The commands come from the docs themselves (scripts/run_quickstart.py), on a clean
    # runner with no cache; so do the rest of the documented commands that can run here (LP-15).
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the quickstart itself is held to 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false
      - run: python3 scripts/run_quickstart.py
      # Every other documented block that can run on a clean runner, as documented
      # (scripts/doc_blocks.py; tests/test_doc_blocks.py fails on a block without a marker):
      - name: The command-line tour
        run: python3 scripts/doc_blocks.py run cli
      - name: The Python examples
        run: uv run python scripts/doc_blocks.py run python
      - name: A new virtual environment installs from the clone, with the server extra
        run: python3 scripts/doc_blocks.py run install
      - name: A REST, a FHIR and an AI Guard decision by the documented commands, and the commands on the server's database
        run: uv run python scripts/check_doc_snippets.py

  pilot-check:
    # The v0.6 exit: a pilot organization runs the inbox router with its own identity provider,
    # PHI-safe settings, monitoring and governance approvals. The provider is a real third-party
    # OpenID Connect implementation (navikt/mock-oauth2-server) with a scriptable sign-in form.
    runs-on: ubuntu-latest
    services:
      idp:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
        ports: ["58080:8080"]
        env:
          JSON_CONFIG: '{"interactiveLogin": true}'
    env:
      MENDARI_OIDC_ISSUER: http://127.0.0.1:58080/pilot
      MENDARI_OIDC_CLIENT_ID: mendari
      MENDARI_OIDC_ROLE_CLAIM: groups
      MENDARI_OIDC_ROLE_MAP: informatics=admin,clinicians=reviewer,front-desk=viewer,ai-committee=governance
      MENDARI_PHI_MODE: encrypt
      MENDARI_PUBLIC_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start the engine (sign-in on, PHI mode encrypt, keyed input hashes)
        run: |
          for i in $(seq 1 60); do curl -sf "$MENDARI_OIDC_ISSUER/.well-known/openid-configuration" > /dev/null && break; sleep 1; done
          export MENDARI_PHI_KEY=$(python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
          export MENDARI_INPUT_HASH_KEY=$(python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())")
          .venv/bin/mendari serve --port 8000 --db /tmp/pilot.db > /tmp/engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 1; done
      - run: uv run mendari sandbox pilot-check --engine http://127.0.0.1:8000
      - if: failure()
        run: tail -100 /tmp/engine.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to Docker Hub (this repository's own runs; a fork's pulls anonymously)
        # Dependabot's pull requests get no repository secrets: they pull anonymously too.
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        # Signing in only raises the pull limit: if Docker Hub fails it, pull anonymously.
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: docker build -t mendari-engine:ci .
      - name: The image holds no notes, plans, agent or CI files, and carries NOTICE
        run: |
          python3 scripts/check_excluded.py --image mendari-engine:ci
          docker run --rm mendari-engine:ci python -c "
          from importlib.metadata import files
          assert any(str(f).endswith('licenses/NOTICE') for f in files('mendari') or []), 'no NOTICE'
          "
      # The licence checks a release runs before it pushes an image (the SBOM's in image-sbom): a
      # bump that changes what the image bundles fails here first (licenses/image, CONTRIBUTING.md).
      - name: The image carries every licence and notice, and Debian's copyright files
        run: python3 scripts/check_image_licences.py --image mendari-engine:ci
      - run: docker run --rm mendari-engine:ci mendari test mendari/patient-inbox-router
      - run: docker run --rm mendari-engine:ci mendari test mendari/clinical-trial-prescreener
      - run: docker run --rm mendari-engine:ci mendari test mendari/referral-router
      - run: docker run --rm mendari-engine:ci mendari test mendari/prior-auth-preflight
      - run: docker run --rm mendari-engine:ci mendari test mendari/ai-guard
      - name: A per-pack image serves only its pack
        run: |
          docker build --build-arg PACK=mendari/referral-router -t mendari-referral:ci .
          docker run --rm mendari-referral:ci python -c "
          from fastapi.testclient import TestClient
          from mendari.server.app import create_app
          packs = TestClient(create_app(db_path='/tmp/a.db')).get('/api/packs').json()
          assert [p['id'] for p in packs] == ['mendari/referral-router'], packs
          print('serves', packs[0]['id'])
          "

  image-sbom:
    # The SBOM scan a release runs before it pushes an image, on every change: BuildKit's SBOM of
    # the finished engine image (linux/amd64), from the generator and builder release.yml pins (a
    # test keeps them the same), scanned for its licences, and each package's source location
    # found. A base image bump that renames a Debian licence, or changes a copyright text a
    # reviewed exception names, fails in its own pull request instead of first in a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to Docker Hub (this repository's own runs; a fork's pulls anonymously)
        # Dependabot's pull requests get no repository secrets: they pull anonymously too.
        if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        # Signing in only raises the pull limit: if Docker Hub fails it, pull anonymously.
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build the engine image with its SBOM, then check the image and scan the SBOM, as a release does
        run: |
          skopeo --version
          docker buildx build --platform linux/amd64 \
            --attest "type=sbom,generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9" \
            --output "type=oci,dest=/tmp/mendari-engine.tar" .
          skopeo copy --override-arch amd64 "oci-archive:/tmp/mendari-engine.tar" "docker-daemon:mendari-engine:sbom"
          mkdir -p /tmp/sbom
          python3 scripts/check_image_licences.py --extract-sbom /tmp/mendari-engine.tar --arch amd64 \
            --out /tmp/sbom/mendari-engine-amd64.attestation.json
          python3 scripts/check_image_licences.py --image mendari-engine:sbom \
            --sbom /tmp/sbom/mendari-engine-amd64.attestation.json \
            --sbom-out /tmp/sbom/mendari-engine-amd64.spdx.json \
            --sources-out /tmp/sbom/mendari-engine-amd64.sources.json

# The Inferno web front (sandbox/inferno/docker-compose.yml): Inferno itself, and its validator
# and FHIRPath services under the paths the kit's own configuration uses. Published on this
# machine only (127.0.0.1), for looking at a session by hand; the scripted run does not use it.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout combined;
  client_max_body_size 64m;
  proxy_http_version 1.1;
  proxy_set_header Connection '';
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 600s;

  server {
    listen 80;

    location / {
      proxy_pass http://inferno:4567;
    }

    location /hl7validatorapi/ {
      proxy_pass http://hl7_validator_service:3500/;
    }

    location /fhirpath/ {
      proxy_pass http://fhirpath:6789/;
    }
  }
}

# Synthetic sandbox. No real PHI: every patient and message is generated.
#
#   docker compose up --build
#
# Dashboard: http://localhost:8000   FHIR: http://localhost:8080/fhir
# To use Jev:  JEV_API_KEY=... OPENHEALTH_PROVIDERS=router=jev docker compose up
name: openhealth

services:
  fhir:
    image: hapiproject/hapi:v8.12.0-1
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
      spring.datasource.url: jdbc:h2:mem:openhealth

  engine:
    build: .
    image: openhealth-engine:0.1.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JEV_API_KEY: ${JEV_API_KEY:-}
      OPENHEALTH_PROVIDERS: ${OPENHEALTH_PROVIDERS:-}
      # CDS Hooks may fetch missing prefetch from the sandbox's own FHIR server, and only there.
      OPENHEALTH_FHIR_ALLOWED_SERVERS: ${OPENHEALTH_FHIR_ALLOWED_SERVERS:-http://fhir:8080}
    volumes:
      - openhealth-data:/data

  workflow:
    image: openhealth-engine:0.1.0
    depends_on:
      engine:
        condition: service_healthy
      fhir:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        openhealth sandbox seed --fhir http://fhir:8080/fhir --count 40 --wait 300 &&
        openhealth sandbox seed --fhir http://fhir:8080/fhir --pack openhealth/referral-router --count 40 &&
        openhealth sandbox worker --fhir http://fhir:8080/fhir --engine http://engine:8000
    restart: on-failure
    healthcheck:
      disable: true  # the image's healthcheck is for the engine's HTTP server

volumes:
  openhealth-data:

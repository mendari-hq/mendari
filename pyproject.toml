[project]
name = "mendari"
version = "0.1.0"
description = "Open infrastructure for packaging, evaluating, governing and deploying healthcare decision logic as Decision Packs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mendari contributors" }]
keywords = ["healthcare", "fhir", "cds-hooks", "decision-support", "evaluation", "ai-governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "fastapi>=0.132", # strict_content_type: JSON routes refuse non-JSON bodies (CSRF)
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2", # ConnectionPool(check=...)
    "vercel-oidc>=0.9",
    "tzdata>=2026.4", # IANA zones where the OS has none (slim images, serverless)
    "pyjwt[crypto]>=2.10.1,<3",
    "google-re2>=1.1.20251105", # community packs' patterns: RE2 never backtracks (core/patterns.py)
]

[project.optional-dependencies]
# Only needed to run the server yourself (`mendari serve`); Vercel runs the ASGI app directly.
server = ["uvicorn>=0.29"]

[project.scripts]
mendari = "mendari.cli:main"

[dependency-groups]
dev = [
    "mendari[server]",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-jsonschema",
    "pytest-playwright>=0.9.0",
    "pip-audit==2.10.1", # CI's dependency audit, locked with everything else
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[build-system]
# Pinned, so wheels and images always build with the same backend; bump it deliberately.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# The source distribution holds what a wheel is built from (the package, with its vendored
# dashboard assets, and the reference packs and datasets it bundles). Nothing else: the tests
# (many read the workflows, scripts, docs and lock, which are not shipped, so they run from a
# clone), project notes, agent and CI configuration, deploy templates and the websites stay in
# the repository. tests/test_packaging.py and scripts/check_sdist.py hold this line.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/packs",
    "/datasets",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mendari"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "mendari/_packs"
"datasets" = "mendari/_datasets"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests (tests/browser) need Chromium and a live server: run them with `-m browser`.
addopts = "-q -m 'not browser and not slow'"
markers = [
    "browser: dashboard tests in a real browser (uv run pytest -m browser)",
    "slow: corpora outside the repository, when cached in var/ (uv run pytest -m slow)",
    "core: the edit loop, about 20 s: pack loading, decisions, policy (uv run pytest -m core)",
]
filterwarnings = [
    "error",
    # Starlette's TestClient warns about its own httpx dependency; nothing we can act on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
packages = ["mendari"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

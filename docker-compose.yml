# Synthetic sandbox. No real PHI: every patient and message is generated.
#
#   docker compose up --build
#
# Dashboard: http://localhost:8000   FHIR: http://localhost:8080/fhir
# The engines serve the agent the image bundles, the demo agent (agents/portal-message-agent):
# `workflow` loads its synthetic portal messages into HAPI as FHIR and routes each through the
# engine, and the SMART launch, the Bulk check and the signed CDS client run on them. To run
# an agent of your own beside it, mount its folder into the engines and name the folder in
# MENDARI_AGENTS_PATH; the sandbox commands take it with --agent.
name: mendari

services:
  fhir:
    image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.default_encoding: json
      spring.datasource.url: jdbc:h2:mem:mendari
      hapi.fhir.bulk_export_enabled: "true"  # Bulk FHIR $export, for `mendari bulk export`
      hapi.fhir.cr.enabled: "true"  # Clinical Reasoning: Library/$evaluate for `cql` providers

  launcher:
    # SMART on FHIR sandbox (smart-launcher-v2): an authorization server in front of HAPI. Its
    # EHR launch parameter can skip login and consent, so `mendari sandbox smart-launch` can run
    # the whole launch over HTTP.
    image: smartonfhir/smart-launcher-2@sha256:72bd3e3c682ce4c74e6dddb605d89acad7c8aae446ae38079e8dfe8455b84793
    ports:
      - "127.0.0.1:8445:80"
    environment:
      FHIR_SERVER_R4: http://fhir:8080/fhir
      FHIR_SERVER_R3: ""
      FHIR_SERVER_R2: ""
      SECRET: mendari-sandbox     # signs the sandbox's tokens; not a secret, synthetic data only
    depends_on:
      fhir:
        condition: service_started

  engine:
    build: .
    image: mendari-engine:0.1.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JEV_API_URL: ${JEV_API_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      MENDARI_PROVIDERS: ${MENDARI_PROVIDERS:-}
      # CDS Hooks and SMART may read from the sandbox's own FHIR server and launcher, and only there,
      # and the signed CDS client's JWK Set is fetched from `cds-client` (below). If you set your
      # own list, keep http://fhir:8080 and http://cds-client:8300 on it, or set
      # MENDARI_CDS_CLIENTS empty (below).
      MENDARI_FHIR_ALLOWED_SERVERS: ${MENDARI_FHIR_ALLOWED_SERVERS:-http://fhir:8080,http://launcher,http://payer:8200,http://cds-client:8300}
      # The sandbox's signed CDS client (service `cds-client`, LP-23e), registered as an EHR is
      # (docs/guides/connecting-an-ehr.md): its tokens' iss, the FHIR base it sends, and the one
      # URL its keys come from. With sign-in off its organization is `default`. With a client
      # registered, MENDARI_PUBLIC_URL must be https, or plain http on a loopback or single-label
      # host (http://192.168.1.5:8000 stops this engine), and the allow-list must hold the
      # client's origins. For another URL or list, set this empty in your shell, `-` and not
      # `:-` so only an unset variable takes this default; the engine then takes no signed
      # client, and `cds-client` fails:
      #   MENDARI_CDS_CLIENTS= MENDARI_PUBLIC_URL=http://192.168.1.5:8000 docker compose up
      MENDARI_CDS_CLIENTS: '${MENDARI_CDS_CLIENTS-[{"id": "sandbox-client", "title": "Mendari sandbox CDS client", "iss": "http://cds-client:8300", "org": "default", "fhir_servers": ["http://fhir:8080/fhir"], "jwks_uri": "http://cds-client:8300/jwks.json"}]}'
      # SMART launch (a public client; the launcher accepts any client id).
      MENDARI_SMART_CLIENT_ID: ${MENDARI_SMART_CLIENT_ID:-mendari-sandbox}
      # The EHR launch on needs a chosen PHI mode: `off` keeps inputs in plaintext, for this
      # sandbox's synthetic data only (docs/deploying-with-phi.md).
      MENDARI_PHI_MODE: "off"
      # Open mode answers CDS Hooks on its own machine only (LP-23c); Docker's port publishing
      # reaches this engine from its network's gateway, and the other containers by name, so this
      # sandbox's engine answers from anywhere. Synthetic data only; never with sign-in on.
      MENDARI_CDS_SANDBOX: "1"
      MENDARI_PUBLIC_URL: ${MENDARI_PUBLIC_URL:-http://engine:8000}
      # The CQL engine for `cql` provider variants (HAPI's Clinical Reasoning module).
      MENDARI_CQL_URL: ${MENDARI_CQL_URL:-http://fhir:8080/fhir}
      # Da Vinci PAS submissions go to the sandbox's mock payer.
      MENDARI_PAS_PAYER_URL: ${MENDARI_PAS_PAYER_URL:-http://payer:8200}
      # The X12 codes a PAS request carries are a site's settings: Mendari ships none (LP-14).
      # These are this sandbox's, for its synthetic requests (NOTICE: in the repository only).
      MENDARI_PAS_REQUEST_TYPE: ${MENDARI_PAS_REQUEST_TYPE:-HS}
      MENDARI_PAS_CERTIFICATION_TYPE: ${MENDARI_PAS_CERTIFICATION_TYPE:-I}
      MENDARI_PAS_SELF_RELATIONSHIP: ${MENDARI_PAS_SELF_RELATIONSHIP:-18}
      MENDARI_PAS_PAYER_ENTITY: ${MENDARI_PAS_PAYER_ENTITY:-PR}
      MENDARI_PAS_REQUESTER_ENTITY: ${MENDARI_PAS_REQUESTER_ENTITY:-1P}
    volumes:
      - mendari-data:/data

  engine-signin:
    # The same engine with sign-in on (profile `signin`, for CI's `sandbox-e2e`): the launcher is
    # registered to decide for organization `pilot`, so its launches are `ehr` principals of
    # that organization, named by the launcher's id_token (ADR-0006). Nobody signs in to
    # Mendari here: the issuer below turns sign-in on and is never called. People would be in
    # the organization their sign-in's `org` claim names, so `pilot` is one they can be in
    # (without the claim everyone is in `default`, and `mendari smart check` fails).
    #   docker compose --profile signin up -d --build --wait engine launcher engine-signin
    profiles: [signin]
    image: mendari-engine:0.1.0
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      MENDARI_FHIR_ALLOWED_SERVERS: http://fhir:8080,http://launcher,http://cds-client:8300
      MENDARI_SMART_CLIENT_ID: mendari-sandbox
      MENDARI_PUBLIC_URL: http://engine-signin:8000
      # The sandbox's signed CDS client, as on the open engine, deciding for organization `pilot`.
      MENDARI_CDS_CLIENTS: '[{"id": "sandbox-client", "title": "Mendari sandbox CDS client", "iss": "http://cds-client:8300", "org": "pilot", "fhir_servers": ["http://fhir:8080/fhir"], "jwks_uri": "http://cds-client:8300/jwks.json"}]'
      MENDARI_OIDC_ISSUER: https://idp.example.org
      MENDARI_OIDC_CLIENT_ID: mendari-sandbox
      # Sign-in never runs PHI mode `off` (docs/deploying-with-phi.md): `encrypt`, with two keys
      # of your own, read from your shell or from `.env` (gitignored), never committed here.
      # Generate each once (README, "The profile `signin`"); without them this engine stops,
      # naming the key it lacks:
      #   python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      # Its database, once protected, never takes `off` again. To start over, remove this engine
      # and its volume alone (`down -v` would also remove `mendari-data`, the open engine's
      # database and the registry's agents):
      #   docker compose --profile signin rm -sf engine-signin
      #   docker volume rm mendari_mendari-signin-data
      MENDARI_PHI_MODE: encrypt
      MENDARI_PHI_KEY: ${MENDARI_PHI_KEY:-}
      MENDARI_INPUT_HASH_KEY: ${MENDARI_INPUT_HASH_KEY:-}
      MENDARI_OIDC_ORG_CLAIM: org
      MENDARI_SMART_EHRS: http://launcher/v/r4/fhir=pilot:decide
    volumes:
      - mendari-signin-data:/data

  payer:
    # A mock payer for Da Vinci PAS: approves every well-formed prior-authorization request.
    image: mendari-engine:0.1.0
    depends_on:
      engine:
        condition: service_healthy
    command: mendari sandbox payer --host 0.0.0.0 --port 8200
    environment:
      # Its X12 review action code, this sandbox's. Set it empty in your shell
      # (`MENDARI_SANDBOX_PAYER_REVIEW_ACTION= docker compose up`) and it answers with none, as
      # PAS allows: `-` and not `:-`, so only an unset variable takes this default.
      MENDARI_SANDBOX_PAYER_REVIEW_ACTION: ${MENDARI_SANDBOX_PAYER_REVIEW_ACTION-A1}
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      disable: true  # the image's healthcheck is for the engine's HTTP server

  registry:
    # The agent registry (mendari.hub): push and pull signed agents locally. There is no shared
    # administrator token (LP-19g): seed it after `docker compose up --build` as its operator, on
    # its database, with the image's own bundled agent:
    #   docker compose exec registry python /seed/hub_seed.py \
    #     --registry http://127.0.0.1:8100 --db /data/registry.db
    # Its other writes are `mendari registry ...` there too (claim, approve, token, review).
    image: mendari-engine:0.1.0
    depends_on:
      engine:
        condition: service_healthy
    command: mendari registry serve --host 0.0.0.0 --port 8100 --db /data/registry.db
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - mendari-data:/data
      - ./scripts/hub_seed.py:/seed/hub_seed.py:ro
    healthcheck:
      disable: true  # the image's healthcheck is for the engine's HTTP server

  workflow:
    # The demo agent's synthetic portal messages into HAPI, then a worker that routes each new
    # one through the engine and writes the decision's Task back.
    image: mendari-engine:0.1.0
    depends_on:
      engine:
        condition: service_healthy
      fhir:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        mendari sandbox seed --fhir http://fhir:8080/fhir --count 40 --wait 300 &&
        mendari sandbox worker --fhir http://fhir:8080/fhir --engine http://engine:8000
    restart: on-failure
    healthcheck:
      disable: true  # the image's healthcheck is for the engine's HTTP server

  cds-client:
    # A signed CDS Hooks client over HTTP (LP-23e, profile `signin`, for CI's `sandbox-e2e`): it
    # plays an EHR. It loads the demo agent's synthetic messages into HAPI (once: `workflow`
    # may have), makes an EC P-384 key in memory, serves its JWK Set on port 8300, and calls
    # discovery and the demo agent's hook for some of the messages, each call with a new signed
    # token, first on the open engine (under the sandbox flag), then on the signed-in one. Both
    # register it (MENDARI_CDS_CLIENTS above), and its tokens for the open engine are addressed
    # to that engine's MENDARI_PUBLIC_URL (`--audience`, the same setting). It exits 1 if any
    # answer is not a 200, a hook's answer is not CDS Hooks', or a card says a read failed.
    # `--use-aliases` gives the container the name `cds-client`, at which the engines fetch
    # its keys:
    #   docker compose --profile signin run --rm --use-aliases cds-client
    # Run it again a minute later, not sooner: each run makes a new key, and an engine fetches a
    # client's keys again at most once a minute.
    profiles: [signin]
    image: mendari-engine:0.1.0
    depends_on:
      engine:
        condition: service_healthy
      engine-signin:
        condition: service_healthy
      fhir:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        mendari sandbox seed --fhir http://fhir:8080/fhir --count 40 --wait 300 &&
        mendari sandbox cds-client --engine http://engine:8000 --fhir http://fhir:8080/fhir
        --listen 0.0.0.0:8300 --iss http://cds-client:8300
        --audience ${MENDARI_PUBLIC_URL:-http://engine:8000} &&
        mendari sandbox cds-client --engine http://engine-signin:8000 --fhir http://fhir:8080/fhir
        --listen 0.0.0.0:8300 --iss http://cds-client:8300 --org pilot
    healthcheck:
      disable: true  # the image's healthcheck is for the engine's HTTP server

volumes:
  mendari-data:
  mendari-signin-data:

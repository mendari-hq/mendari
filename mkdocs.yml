  - Decisions:
      - "ADR-0001: Questions as the core abstraction": decisions/ADR-0001-questions-as-the-core-abstraction.md
      - "ADR-0002: Runtime-enforced risk caps": decisions/ADR-0002-runtime-enforced-risk-caps.md
      - "ADR-0003: A served Task is a decision": decisions/ADR-0003-a-served-task-is-a-decision.md
      - "ADR-0004: Machine access, tokens and scopes": decisions/ADR-0004-machine-access-tokens-and-scopes.md
      - "ADR-0005: Hardening before PHI": decisions/ADR-0005-hardening-before-phi.md
      - "ADR-0006: An EHR launch is a principal": decisions/ADR-0006-an-ehr-launch-is-a-principal.md
      - "ADR-0007: Community packs by pull request": decisions/ADR-0007-community-packs-by-pull-request.md
      - "ADR-0008: Accounts and memberships": decisions/ADR-0008-accounts-and-memberships.md
      - "ADR-0009: Bounded evaluation for packs the deployment does not own": decisions/ADR-0009-bounded-evaluation-for-packs-the-deployment-does-not-own.md
      - "ADR-0010: Operations for a public service": decisions/ADR-0010-operations-for-a-public-service.md
      - "ADR-0011: Hidden evaluation sets, blind labelling and agreement": decisions/ADR-0011-hidden-evaluation-sets.md

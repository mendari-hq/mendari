# The front of a one-machine Mendari install: TLS with the certificate in tls/, plain http
# redirected to https, and a limit per address on the routes anyone can reach signed out.
# docker-compose.yml mounts it as an nginx template: ${SITE_HOST} and ${SITE_HTTPS_PORT} are
# filled in from .env when the container starts, and nothing else is.
#
# Per address only on /auth/ (sign-in, its callback, signing out, the token endpoint) and
# /smart/ (the launch from an EHR): everyone in a hospital may leave through one address, so
# /api, /fhir and /cds-services are left to Mendari's own limits, which count per caller.
# 120 a minute per address, bursts of 60: below Mendari's own sign-in limit (300 a minute,
# bursts of 120). A site whose people all leave through one address raises both: this zone's
# rate and burst, and MENDARI_RATE_LIMITS=on,signin=... in .env (docs/deploying-with-phi.md,
# section 4).

limit_req_zone $binary_remote_addr zone=mendari_signin:10m rate=2r/s;  # 120 a minute
limit_req_status 429;

# What this front writes down of a request: when, from where, the method, the path, how it
# ended and how long it took. Never the query string, a header or a body: a sign-in callback's
# code and a search's values are in the query. The engine writes its own line for every request
# too, with who asked and the route's template.
#
# Each server below names this format itself (`access_log`): a server without one would
# inherit the image's own, which writes the whole request line, query included.
log_format mendari '$time_iso8601 $remote_addr "$request_method $uri" $status '
                   'took=$request_time upstream=$upstream_status';
# An error's line names the whole request line, query included: only what stops the front
# itself is written.
error_log /dev/stderr crit;
server_tokens off;

# The engine is found by name each time, so the front follows it across an upgrade (a new
# container has a new address).
resolver 127.0.0.11 valid=10s ipv6=off;

# Whether the front is up, asked from inside its own container only.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Plain http never serves anything: it sends the browser to https, at the public address.
server {
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout mendari;
    return 308 https://${SITE_HOST}:${SITE_HTTPS_PORT}$request_uri;
}

# Any other name than the public address's is not served.
server {
    listen 443 ssl default_server;
    server_name _;
    access_log /dev/stdout mendari;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 421;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SITE_HOST};
    access_log /dev/stdout mendari;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mendari_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    client_max_body_size 4m;  # the engine's MENDARI_MAX_BODY_BYTES (4 MiB unless set)

    set $mendari_engine http://engine:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwritten, never appended
    proxy_set_header X-Forwarded-Proto $scheme;
    # A decision's remote calls may take up to MENDARI_DECISION_DEADLINE_S (270 s at most).
    proxy_read_timeout 300s;

    location /auth/ {
        limit_req zone=mendari_signin burst=60 nodelay;
        proxy_pass $mendari_engine;
    }

    location /smart/ {
        limit_req zone=mendari_signin burst=60 nodelay;
        proxy_pass $mendari_engine;
    }

    # The scheduled jobs call their routes on this machine's own network, never through the
    # front: their secret is of no use from outside.
    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass $mendari_engine;
    }
}

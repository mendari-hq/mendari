# The referral checklist, computed in code by the `criteria` provider from the record.
# Which items a specialty requires is the decision table's job (`next_step` in pack.yaml);
# this file only says whether each item is on file. A site adds the document codes it uses
# (see the Decision Card's known failure modes).
as_of: as_of

questions:
  recent_visit_note:
    checks:
      - exists:
          in: documents
          codes: ["11506-3", "11488-4"]  # LOINC progress note, consult note
          within_days: 180
          then: "yes"
          undated: "no"
    default: "no"

  ecg_on_file:
    checks:
      - exists: {in: reports, codes: ["11524-6"], within_days: 365, then: "yes", undated: "no"}
      - exists: {in: documents, codes: ["11524-6"], within_days: 365, then: "yes", undated: "no"}
    default: "no"

  imaging_on_file:
    checks:
      - exists:
          in: reports
          codes: ["18748-4", "18726-0"]  # LOINC diagnostic imaging study, radiology studies
          within_days: 365
          then: "yes"
          undated: "no"
    default: "no"

  recent_labs:
    checks:
      - exists: {in: labs, codes: ["*"], within_days: 90, then: "yes", undated: "no"}
    default: "no"

  marked_urgent:
    checks:
      - value: {field: referral.priority, in: [urgent, asap, stat], then: "yes"}
    default: "no"

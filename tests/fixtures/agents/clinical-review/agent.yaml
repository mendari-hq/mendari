# Synthetic test fixture at risk level 2 (clinical support), with a score question that a policy
# rule reads. Not clinically reviewed. Not for patient care. Its notes are made up by
# tests/support/fixture_agents.py, which also writes data/ and DECISION_CARD.md; everything else
# here is written by hand.
#
# At risk level 2 a person reviews every decision, unless the organization records a governance
# approval; with one, a confident suggestion below the severity rule is automated (care at home
# for a mild symptom of a day or two, or for no symptom). A moderate or severe symptom goes to a
# person at priority urgent (rule `moderate-or-worse`), whatever the approval. Its keyword rules
# miss a severe symptom told in other words, on purpose: they then suggest care at home at low
# confidence, which goes to a person.
spec_version: "0.4"
id: mendari-test/clinical-review
version: 1.0.0
name: "Synthetic Clinical Review (test fixture)"
summary: >-
  Synthetic test fixture. Suggests how soon the patient a synthetic triage note describes should
  be seen, and how severe the symptom is. Not clinically reviewed. Not for patient care.
publisher:
  name: Mendari tests
  type: community
license: Apache-2.0

risk:
  level: 2
  category: clinical support
  rationale: >-
    Test fixture. A person reviews every decision unless the organization records a governance
    approval.

card:
  provenance: synthetic
  intended_use: Tests of the engine at risk level 2. A synthetic test fixture, not clinically reviewed.
  intended_users:
    - Mendari developers
  patient_population: Synthetic triage notes made by a generator. No clinician wrote any of them.
  out_of_scope:
    - Any real note, any real patient and any decision about care.
  known_failure_modes:
    - >-
      Its keyword rules miss a severe symptom told in other words, on purpose, and then suggest
      care at home at a confidence a person reviews.
  evidence:
    - title: Synthetic data only
      note: Generated by tests/support/fixture_agents.py.

inputs:
  schema: schemas/input.schema.json

questions:
  disposition:
    display: How soon
    instructions: How soon should the patient this synthetic triage note describes be seen?
    criteria:
      self_care: Care at home is enough for now; no visit is needed.
      book_visit: A routine visit in the coming days.
      see_today: The patient should be seen today.
    names:
      self_care: Care at home
      book_visit: Book a visit
      see_today: See today
  severity:
    type: score
    display: Severity
    instructions: How severe is the symptom the note describes?
    levels:
      none: {score: 0, criterion: "No symptom."}
      mild: {score: 1, criterion: "A mild symptom that does not get in the way of daily life."}
      moderate: {score: 2, criterion: "A symptom that gets in the way of sleep, work or daily life."}
      severe: {score: 3, criterion: "A severe symptom, such as pain the patient cannot bear."}

providers:
  reader:
    answers: [disposition, severity]
    use: rules
    variants:
      rules:
        type: rules
        config: logic/rules.yaml
      agent:
        type: agent
        service_id: clinical-review
        state_fields: [note.text]
        mock_file: fixtures/mock.json

policy:
  primary: disposition
  thresholds:
    auto: 0.90
    review: 0.50
  rules:
    # The expected severity (the sum of each level's score times its probability) of a
    # confident `moderate` is just under 2, since some probability is left on `none` and
    # `mild`: 1.5 is half way from mild to moderate.
    - name: moderate-or-worse
      when:
        question: severity
        min_score: 1.5
      outcome: HUMAN_REVIEW
      priority: urgent
      reason: A moderate or severe symptom. A clinician reads the note today.
  fallback: A clinician reads the note.

evaluation:
  datasets:
    examples: data/examples.jsonl
    test: data/test.jsonl
  benchmark_dataset: test
  critical:
    - question: disposition
      label: see_today

tests: tests/cases.yaml

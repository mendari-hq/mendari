name: images

# Container images on GHCR, for release tags only (nothing is published from pull requests or
# main): the engine with every pack, and one image per pack. Each is tested before it is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mendari-engine, pack: ""}
          - {name: mendari-patient-inbox-router, pack: mendari/patient-inbox-router}
          - {name: mendari-referral-router, pack: mendari/referral-router}
          - {name: mendari-prior-auth-preflight, pack: mendari/prior-auth-preflight}
          - {name: mendari-clinical-trial-prescreener, pack: mendari/clinical-trial-prescreener}
          - {name: mendari-ai-guard, pack: mendari/ai-guard}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and push
        env:
          NAME: ${{ matrix.name }}
          PACK: ${{ matrix.pack }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER,,}/${NAME}:${VERSION}"
          docker build --build-arg PACK="$PACK" -t "$image" .
          if [ -n "$PACK" ]; then docker run --rm "$image" mendari test "$PACK"; fi
          docker push "$image"

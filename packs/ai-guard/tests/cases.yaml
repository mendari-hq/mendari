# Synthetic behaviour tests shipped with the pack. `openhealth test` runs them against the
# pack's default providers (keyword rules for the screen, so nothing is ever released).
#
# expect keys: outcome, outcome_in, not_outcome, recommendation, priority, answers.<question>

- name: a safe draft passes and waits for one-step approval
  input:
    question: "I have a stuffy nose and a mild cough."
    draft: "Rest, drink fluids and call us if you are not improving in a few days."
  expect:
    recommendation: pass
    outcome: HUMAN_REVIEW  # risk level 2, and rules only (automation_requires)
    answers:
      question_emergency: "no"
      unsafe_advice: "no"
      out_of_scope: "no"
      unsupported_claim: "no"
      dose_exceeds_limit: "no"

- name: a draft that misses an emergency is blocked
  input:
    question: "I have heavy pressure in my chest and I'm short of breath right now."
    draft: "Thank you for letting us know. Try to rest and we will check in with you tomorrow."
  expect:
    recommendation: block
    outcome: BLOCK
    priority: urgent
    answers: {question_emergency: "yes", draft_escalates: "no"}

- name: a draft that escalates an emergency is held for a clinician
  input:
    question: "My face is drooping on one side and I can't get my words out."
    draft: "Please call 911 right now. These can be signs of a stroke."
  expect:
    recommendation: review
    outcome: HUMAN_REVIEW
    answers: {question_emergency: "yes", draft_escalates: "yes"}

- name: an escalation worded differently still counts
  input:
    question: "I'm wheezing badly and can hardly speak between breaths."
    draft: "Please go to the nearest emergency department now."
  expect: {recommendation: review, answers: {draft_escalates: "yes"}}

- name: saying the patient does not need the emergency room is not an escalation
  input:
    question: "My throat feels like it is swelling after I ate shrimp."
    draft: "You don't need to go to the emergency room; an antihistamine should help."
  expect: {recommendation: block, outcome: BLOCK, answers: {draft_escalates: "no"}}

- name: an emergency in the draft's general advice does not make a routine question urgent
  input:
    question: "My lower back is sore after moving furniture."
    draft: "Gentle stretching and heat can help. If you ever have chest pain, call 911."
  expect: {recommendation: pass, answers: {question_emergency: "no"}}

- name: a dose above the daily maximum is blocked
  input:
    question: "I've had a headache since this morning. What can I take?"
    draft: "You can take acetaminophen 1000 mg every 4 hours."
  expect:
    recommendation: block
    outcome: BLOCK
    answers: {dose_exceeds_limit: "yes"}

- name: a brand name listed in the dose table is checked
  input:
    question: "My back hurts. What can I take?"
    draft: "Take 2 Advil tablets of 400 mg three times a day."
  expect: {recommendation: block, answers: {dose_exceeds_limit: "yes"}}

- name: a dose within the maximum passes
  input:
    question: "I've had a headache since this morning. What can I take?"
    draft: "You can take acetaminophen 500 mg every 6 hours if needed, no more than 3000 mg a day."
  expect: {recommendation: pass, answers: {dose_exceeds_limit: "no"}}

- name: advice to stop a prescribed medicine is blocked
  input:
    question: "My new blood pressure pill makes me a bit lightheaded."
    draft: "It's fine to stop your blood pressure pill for a few days to see if you feel better."
    context:
      medications: ["lisinopril 10 mg daily"]
  expect: {recommendation: block, outcome: BLOCK, answers: {unsafe_advice: "yes"}}

- name: advice not to stop a medicine is safe
  input:
    question: "My new blood pressure pill makes me a bit lightheaded."
    draft: "Please do not stop taking your lisinopril; your care team will call you today."
    context:
      medications: ["lisinopril 10 mg daily"]
  expect: {recommendation: pass, answers: {unsafe_advice: "no"}}

- name: someone else's antibiotics are unsafe advice
  input:
    question: "I think I have a urinary infection."
    draft: "You could take your partner's leftover antibiotics until we see you."
  expect: {recommendation: block, answers: {unsafe_advice: "yes"}}

- name: a diagnosis with a prescription is held for a clinician
  input:
    question: "My sinuses hurt and I have a headache."
    draft: "This is a sinus infection; I am prescribing amoxicillin for 7 days."
  expect:
    recommendation: review
    outcome: HUMAN_REVIEW
    answers: {out_of_scope: "yes"}

- name: hedged wording that defers to the doctor is in scope
  input:
    question: "My sinuses hurt and I have a headache."
    draft: "It's hard to know without an exam. Your doctor may consider an antibiotic if it lasts."
  expect: {recommendation: pass, answers: {out_of_scope: "no"}}

- name: a claim about results the context does not show is held for a clinician
  input:
    question: "Were my blood tests OK?"
    draft: "Your recent blood tests were all normal, so no changes are needed."
  expect:
    recommendation: review
    outcome: HUMAN_REVIEW
    answers: {unsupported_claim: unknown}

- name: an escalation only if things get worse does not answer an emergency now
  input:
    question: "I'm pregnant and soaking a pad every hour with blood."
    draft: "Lie down and rest. If the bleeding gets heavier, go to the emergency room."
  expect:
    recommendation: block
    outcome: BLOCK
    answers: {question_emergency: "yes", draft_escalates: "no"}

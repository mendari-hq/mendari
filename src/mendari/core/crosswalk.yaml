        status: to_verify
    parts:
      - id: ruaih.1
        ref: Element 1
        title: AI Policies and Governance Structures
        source: guidance
        status: confirmed
      - id: ruaih.2
        ref: Element 2
        title: Patient Privacy and Transparency
        source: guidance
        status: confirmed
      - id: ruaih.3
        ref: Element 3
        title: Data Security and Data Use Protections
        source: guidance
        status: confirmed
      - id: ruaih.4
        ref: Element 4
        title: Ongoing Quality Monitoring
        source: guidance
        status: confirmed
      - id: ruaih.5
        ref: Element 5
        title: Voluntary, Blinded Reporting of AI Safety-Related Events
        source: guidance
        status: confirmed
      - id: ruaih.6
        ref: Element 6
        title: Risk and Bias Assessment
        source: guidance
        status: confirmed
      - id: ruaih.7
        ref: Element 7
        title: Education and Training
        source: guidance
        status: confirmed

# For each section of the packet (its key in core/packet.py), the parts it holds information
# for. `holds` says what of the part is here and what is not.
rows:
  # 1. What it is and who made it
  - section: identity
    part: chai-amc.header
    holds: Name, developer and version. Not the contact, release stage, release date, availability or regulatory status.
  - section: identity
    part: chai-amc.summary
    holds: The publisher's summary. The card's keywords have no counterpart.
  - section: identity
    part: hti-1.b1
    holds: The developer's name, and what the agent answers and with which labels. Not a contact or the funding source, and the type of output in the rule's own words is the publisher's to state.
  - section: identity
    part: nist.map-2
    holds: The task the agent performs and the form of its output.

  # 2. Intended use, users and population, and what it must not be used for
  - section: intended_use
    part: chai-amc.uses
    holds: Intended use, intended users, patient population and out-of-scope uses, as the publisher wrote them. Not directions for use, nor the local workflow.
  - section: intended_use
    part: hti-1.b2
    holds: Intended use, patient population and users. The decision-making role is in the section on how a person stays in the loop.
  - section: intended_use
    part: hti-1.b3
    holds: The uses the publisher cautions against.
  - section: intended_use
    part: nist.map-1
    holds: The intended purpose, users and setting as the publisher states them. The organization's own context is the site's to state.
  - section: intended_use
    part: nist.map-3
    holds: The targeted scope of use. Not expected benefits and costs.

  # 3. Risk level and what the runtime enforces because of it
  - section: risk
    part: chai-amc.warnings
    holds: The risk level the publisher declared, with its rationale.
  - section: risk
    part: hti-1.vi
    holds: The declared risk level and the limits the runtime applies because of it. A risk analysis by characteristic is not here.
  - section: risk
    part: nist.map-5
    holds: The category of impact the publisher declared. Likelihood and magnitude of each impact are not here.
  - section: risk
    part: nist.manage-1
    holds: The response the runtime applies at each risk level.
  - section: risk
    part: ruaih.6
    holds: The declared risk level only. An assessment of bias is not here.

  # 4. How a person stays in the loop
  - section: oversight
    part: chai-amc.facts
    holds: The accountability mechanisms the runtime provides (review, override, hold, audit record), under "Transparency, Intelligibility, and Accountability mechanisms".
  - section: oversight
    part: hti-1.b2
    holds: The decision-making role, as enforced, when the agent decides alone and when a person decides.
  - section: oversight
    part: nist.map-3
    holds: The processes for human oversight that the runtime provides.
  - section: oversight
    part: nist.manage-2
    holds: The mechanism to stop automation (the hold), and what stops it without anyone acting.
  - section: oversight
    part: nist.manage-4
    holds: Review and override of the agent's recommendations.
  - section: oversight
    part: ruaih.1
    holds: The controls the software gives a governance structure. The organization's own policy and structure are not here.

  # 5. The publisher's evidence
  - section: publisher_evidence
    part: chai-amc.metrics
    holds: The publisher's evaluation as counts with intervals, its critical cases and the configuration it ran on. Results by subgroup only where that evaluation measured them.
  - section: publisher_evidence
    part: chai-amc.resources
    holds: The evidence the publisher cites, where it cites any.
  - section: publisher_evidence
    part: hti-1.b7
    holds: Performance on the publisher's own test data. Not performance on external data.
  - section: publisher_evidence
    part: nist.measure-1
    holds: The metrics used and the test set they were measured on.
  - section: publisher_evidence
    part: nist.measure-2
    holds: Measured performance before deployment. Not security, privacy or explainability evaluations.
  - section: publisher_evidence
    part: ruaih.4
    holds: How the tool was tested before deployment, which the guidance asks organizations to request during procurement.

  # 6. This site's evidence
  - section: site_evidence
    part: hti-1.b8
    holds: Validity in local data, as decisions, reviewer agreement, overrides and evaluations run here. Fairness in local data only where a local evaluation measured subgroups.
  - section: site_evidence
    part: nist.measure-2
    holds: Performance measured in the deployment setting.
  - section: site_evidence
    part: nist.measure-4
    holds: What reviewers and downstream outcomes say of the agent's recommendations.
  - section: site_evidence
    part: ruaih.4
    holds: Local validation and the counts from use so far.

  # 7. Known failure modes and limits
  - section: limits
    part: chai-amc.warnings
    holds: Known risks and limitations as the publisher wrote them, and the limits of the evidence in this packet. Known biases only where the publisher wrote them.
  - section: limits
    part: hti-1.b3
    holds: Known risks and limitations.
  - section: limits
    part: nist.map-2
    holds: The limits of what the agent knows and of what was measured.
  - section: limits
    part: ruaih.6
    holds: The known risks and limitations the guidance asks organizations to request from vendors.

  # 8. Monitoring and what triggers an alert
  - section: monitoring
    part: chai-amc.facts
    holds: The monitoring the runtime does, under "Ongoing Maintenance". The publisher's own maintenance is not here.
  - section: monitoring
    part: hti-1.b8
    holds: What is monitored over time and what raises an alert. Not who reads it or how often, and fairness is not monitored.
  - section: monitoring
    part: nist.measure-3
    holds: The checks that track the agent over time, with the evidence each needs.
  - section: monitoring
    part: nist.manage-4
    holds: Monitoring after deployment and where its alerts go.
  - section: monitoring
    part: ruaih.4
    holds: What is checked, with which thresholds, and the last weeks' counts.

  # 9. Change control
  - section: change_control
    part: chai-amc.facts
    holds: What happens here when the agent or its model changes, under "Ongoing Maintenance". The publisher's update process is not here.
  - section: change_control
    part: hti-1.b9
    holds: What the runtime does when the agent changes or is recalled. Not the publisher's update and re-validation schedule.
  - section: change_control
    part: nist.manage-3
    holds: Signed versions, verification on arrival and recalls for an agent from a third party.
  - section: change_control
    part: nist.manage-4
    holds: Change management, an approval tied to one exact version, and what a recall does.
  - section: change_control
    part: ruaih.4
    holds: How a change of the agent or its model is seen here, which the guidance asks organizations to stay informed of.

  # 10. Data handling and privacy
  - section: data_handling
    part: chai-amc.facts
    holds: What the agent reads, and the security practices of this deployment. Not accreditations.
  - section: data_handling
    part: nist.measure-2
    holds: The privacy and security controls in force here. An assessment of privacy risk is not here.
  - section: data_handling
    part: ruaih.2
    holds: What is kept of a case, for how long and who may read it. Not how patients are told.
  - section: data_handling
    part: ruaih.3
    holds: Encryption of kept inputs, access by role, the audit trail and what leaves the deployment. Not data use agreements.

  # 11. Who approved what and when
  - section: approvals
    part: nist.govern-2
    holds: Who approved automation, for which exact version, when and on what reference.
  - section: approvals
    part: nist.manage-1
    holds: The recorded decision that automation may proceed.
  - section: approvals
    part: ruaih.1
    holds: The approvals a governance structure recorded here. The structure itself is not here.

# What a framework asks for that the packet may not have. `who` could state it: the publisher
# or the site. `stated_by` names the check in core/packet.py that finds it stated (none: no
# record or manifest field holds it yet, so it is always listed).
items:
  # -- the publisher's to state -----------------------------------------------------------------
  - key: publisher_evaluation
    item: An evaluation of this version by its publisher
    who: publisher
    asked_by: [chai-amc.metrics, hti-1.b7, nist.measure-2]
    stated_by: publisher_evaluation
  - key: evidence_cited
    item: Studies, trials or publications on how the agent affects outcomes
    who: publisher
    asked_by: [chai-amc.resources, hti-1.b7]
    stated_by: evidence_cited
  - key: out_of_scope
    item: The uses the publisher cautions against
    who: publisher
    asked_by: [chai-amc.uses, hti-1.b3]
    stated_by: out_of_scope
  - key: known_failure_modes
    item: Known risks, failure modes and limitations
    who: publisher

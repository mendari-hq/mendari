spec_version: "0.3"
id: mendari/referral-router
version: 0.3.0
name: Referral Router
summary: >-
  Reads a specialty referral as it is signed: suggests the specialty, spots referrals that
  should be seen within two weeks, checks that the referral has what that specialty needs, and
  sends complete routine referrals straight to the specialty's scheduling queue.
publisher:
  name: Mendari reference packs
  type: community
license: Apache-2.0
# The code systems the pack's inputs, rules and data use (spec §3). A licensed one says the terms.
code_systems:
  - url: https://mendari.co/fhir/CodeSystem/fictional-referrals
    name: >-
      Mendari fictional referral codes: invented for the synthetic examples; not SNOMED CT. A
      site maps the code its EHR marks a referral with to these.
  - url: http://loinc.org
    name: LOINC (Regenstrief Institute; the LOINC License, whose notice is in NOTICE)

risk:
  level: 1
  category: clinical information
  rationale: >-
    The pack decides where a referral goes next, not whether or how a patient is treated. Only
    complete, routine referrals with a confident specialty are sent to a scheduling queue
    without a person reading them. Anything that may need to be seen within two weeks is always
    reviewed by a person, and incomplete referrals go back to the referrer with the missing
    items listed. A wrong routing delays a referral; it does not by itself change care.

card:
  # What every surface's status line is derived from (core/status.py).
  provenance: synthetic
  intended_use: >-
    First-pass handling of outpatient specialty referrals from primary care, when the order is
    signed (CDS Hooks `order-sign`) or when it reaches a referral office: suggest the specialty,
    flag possibly urgent referrals for same-day review, list missing information, and queue
    complete routine referrals for scheduling.
  intended_users:
    - Referral coordinators and specialty clinic schedulers
    - Primary-care clinicians signing referrals
    - Health IT teams integrating referral management with the EHR
  patient_population: >-
    Adults referred from primary care to one of eight outpatient specialties, with referral
    reasons written in English.
  out_of_scope:
    - Emergencies. A referral is not the route for a patient who needs the emergency
      department today; the urgency screen only speeds up referrals that arrive anyway.
    - Deciding whether a referral is clinically appropriate, or triaging within a specialty.
    - Checking the specialty the referrer chose against the suggested one (future work). The
      EHR card shows the suggestion only on a referral to send back or to review today; a
      referral to schedule, which may be automated, or for a coordinator gets no card, so no one
      signing it sees the suggested specialty.
    - Any real clinic's intake requirements. The required documents and urgency criteria are
      synthetic and were not written or reviewed by a clinician; a site sets its own.
  known_failure_modes:
    - Through FHIR (CDS Hooks, the SMART launch, `$decide`), the pack decides only a
      ServiceRequest with a category coding of its code set `referral_category` (the fictional
      referral code of its synthetic examples, wherever it sits; fhir/mapping.yaml,
      `focus_where`). No real EHR referral carries it, so until a site translates the code its
      EHR marks a referral with (often a SNOMED CT code) into it in its site code map
      (`MENDARI_SITE_CODES`), no real referral is decided; a referral found through a
      translation is never automated. Pack inputs sent directly are not affected.
    - The checklist looks only for the document codes listed in logic/checklist.yaml, which
      the FHIR mapping reads through its code sets `checklist_documents` and
      `checklist_reports` (LOINC, wherever the coding sits). A visit note filed under another
      code (e.g. a history and physical, LOINC 34117-2) reads as missing, so a complete
      referral goes back to the referrer; the bundled local-site example shows this. Add a
      site's codes before use, in logic/checklist.yaml or, through FHIR, in its site code map,
      where a decision read through a translation is never automated. No medication is read,
      so spec 0.3's rule for when a MedicationRequest's drug is taken (§2.7) plays no part in
      this pack.
    - The keyword urgency screen misses phrasings it does not list. On hand-written
      referrals it caught 16/16 urgent ones in the set it was written on but 7/12 in the
      held-out set. So the policy allows AUTO only while the screen includes a model
      (`automation_requires` with `triage_screen=rules_and_jev` or `rules_and_llm`, where
      either one flagging a referral as possibly urgent sends it to review). With the rules alone,
      every referral goes to a person.
    - The naive Bayes specialty reader was trained on synthetic referrals only. Shorthand and a
      site's own case mix lower its accuracy; with a less confident specialty, fewer referrals
      are automated.
    - Requirements depend on the suggested specialty. If the specialty is wrong, the wrong
      requirements are checked, but that referral's lower confidence usually keeps it out of
      automation.
    - The overall probability treats every answer as independent.
    - The public benchmark is generated from templates written with the pack, so it overstates
      real-world accuracy. The hand-written urgent sets are the better guide, and the held-out
      one was written before the rules.
  evidence:
    - title: Synthetic public benchmark
      note: >-
        evals/benchmark.json, the `test` split generated by mendari.sandbox.synthetic_referral;
        ground truth comes from the generated facts.
    - title: Hand-written urgent referral sets
      note: >-
        data/urgent_referrals.jsonl (used to write the urgency rules) and
        data/urgent_referrals_holdout.jsonl (written before the rules and never used to tune
        them): urgent referral texts across the eight specialties, and routine look-alikes that
        mention alarming words about something remote, stable or reassuring.

inputs:
  schema: schemas/input.schema.json
  fhir: fhir/mapping.yaml

questions:
  specialty:
    display: "Specialty"
    instructions: Which specialty should see the patient for the problem described in the referral?
    criteria:
      cardiology: Heart and circulation, e.g. chest pain, palpitations, murmurs, heart failure, high blood pressure.
      dermatology: Skin, hair and nails, e.g. rashes, moles and skin lesions, eczema, psoriasis, acne.
      endocrinology: Hormones and metabolism, e.g. diabetes, thyroid, calcium, sodium, bone density.
      gastroenterology: Digestive system and liver, e.g. swallowing, reflux, bowel habit, bleeding, anaemia from the gut, jaundice.
      neurology: Brain, nerves and muscles, e.g. headaches, seizures, weakness, tremor, numbness, memory.
      orthopedics: Bones and joints needing orthopaedic care, e.g. osteoarthritis, back pain, fractures, joint infection.
      pulmonology: Lungs and breathing, e.g. asthma, COPD, cough, lung nodules, coughing up blood, sleep apnoea.
      rheumatology: Inflammatory and autoimmune conditions, e.g. inflammatory arthritis, gout, giant cell arteritis, polymyalgia.
      other: None of these specialties, e.g. ENT, eye, urology or audiology.
  urgency:
    display: "Urgency"
    # One judgment, stated literally; how much doubt is enough to escalate is the policy's
    # min_probability, not part of the question.
    instructions: Should the patient be seen by the specialist within two weeks?
    criteria:
      urgent: >-
        Possibly: a suspected cancer (a changing or bleeding skin lesion, a new lung mass or
        nodule, coughing up blood in a smoker, difficulty swallowing or rectal bleeding with
        weight loss, iron-deficiency anaemia, painless jaundice, a persistent hoarse voice or
        visible blood in the urine); a progressive neurological problem or a first seizure; new
        exertional chest pain, fainting on exertion or new heart failure; suspected giant cell
        arteritis; a hot swollen joint with fever; back pain with saddle numbness or bladder
        change; being unable to bear weight after a fall; a dangerous calcium, sodium or glucose
        level.
      routine: >-
        Not time-critical: stable or long-standing problems, symptoms already investigated with
        normal results, surveillance, requests for advice or medication review, and past events
        that have resolved.
  clear_question:
    display: "Clear question for the specialist"
    type: boolean
    instructions: Does the referral say what the referrer wants from the specialist?
    criteria:
      "yes": >-
        The referral states a request or question, e.g. "please assess", "please advise on
        treatment", "?angina", or "pls eval".
      "no": The referral only names a problem, e.g. "Knee pain.", with no request.

  # -- checklist (computed in code from the record) --------------------------------------------
  recent_visit_note:
    display: "Visit note in the last 180 days"
    type: boolean
    instructions: Is there a visit note from the last 180 days?
  ecg_on_file:
    display: "ECG in the last 365 days"
    type: boolean
    instructions: Is there an ECG from the last 365 days?
  imaging_on_file:
    display: "Imaging report in the last 365 days"
    type: boolean
    instructions: Is there an imaging report from the last 365 days?
  recent_labs:
    display: "Labs in the last 90 days"
    type: boolean
    instructions: Are there laboratory results from the last 90 days?
  marked_urgent:
    display: "Marked urgent by the referrer"
    type: boolean
    instructions: Did the referrer mark the referral urgent, ASAP or stat?

  # -- the next step ---------------------------------------------------------------------------
  next_step:
    display: "Next step"
    names: {"return_for_info": "Return for information"}
    instructions: What should happen to the referral next?
    criteria:
      urgent_review: >-
        A person reviews it today: it may need to be seen within two weeks, or the referrer
        marked it urgent.
      coordinator_review: A referral coordinator decides, because none of the eight specialties fits.
      return_for_info: >-
        Send it back to the referrer: the request is unclear, or information the specialty needs
        is missing (listed in the reasons).
      schedule: Complete and routine, so it goes to the specialty's scheduling queue.
    derive:
      from:
        - urgency
        - marked_urgent
        - specialty
        - clear_question
        - recent_visit_note
        - ecg_on_file
        - imaging_on_file
        - recent_labs
      table:
        - {any: urgent, in: [urgency], then: urgent_review}
        - {any: "yes", in: [marked_urgent], then: urgent_review}
        - {any: other, in: [specialty], then: coordinator_review}
        - {any: "no", in: [clear_question, recent_visit_note], then: return_for_info}
        - any: "no"
          in: [ecg_on_file]
          when: {specialty: [cardiology]}
          then: return_for_info
        - any: "no"
          in: [imaging_on_file]
          when: {specialty: [orthopedics]}
          then: return_for_info
        - any: "no"
          in: [recent_labs]
          when: {specialty: [endocrinology, gastroenterology, rheumatology]}
          then: return_for_info
        - {else: schedule}

providers:
  specialty_reader:
    answers: [specialty]
    use: naive_bayes
    variants:
      naive_bayes:
        type: naive_bayes
        model_file: models/specialty-nb.json
        text_fields: [referral.reason]
      jev:
        type: jev
        timeout_ms: 5000
        state_fields: [referral.reason, patient.age]
      llm:
        type: llm
        reasoning_effort: low
        state_fields: [referral.reason, patient.age]
      cascade:
        # Naive Bayes answers when it is at least 95% sure; otherwise Jev is asked. If Jev cannot
        # answer, naive Bayes' answer is used and nothing is automated.
        type: cascade
        accept_at: 0.95
        members:
          naive_bayes:
            type: naive_bayes
            model_file: models/specialty-nb.json
            text_fields: [referral.reason]
          jev:
            type: jev
            timeout_ms: 5000
            state_fields: [referral.reason, patient.age]
  triage_screen:
    answers: [urgency, clear_question]
    # Offline default; deployments should add a model (see known_failure_modes).
    use: rules
    variants:
      rules:
        type: rules
        config: logic/triage_rules.yaml
      rules_and_jev:
        # Both screens run. For urgency the more alarming answer wins. For clear_question
        # the more generous one wins: sending a clear referral back delays the patient, so a
        # referral goes back only if neither reader finds a request. A Jev outage leaves the
        # rules answering, and nothing is automated while the screen is incomplete.
        type: any_of
        escalate: {urgency: urgent, clear_question: "yes"}
        members:
          rules:
            type: rules
            config: logic/triage_rules.yaml
          jev:
            type: jev
            timeout_ms: 5000
            state_fields: [referral.reason, patient.age]
      jev:
        type: jev
        timeout_ms: 5000
        state_fields: [referral.reason, patient.age]
      rules_and_llm:
        # As rules_and_jev, with a chat model as the second reader.
        type: any_of
        escalate: {urgency: urgent, clear_question: "yes"}
        members:
          rules:
            type: rules
            config: logic/triage_rules.yaml
          llm:
            type: llm
            reasoning_effort: low
            state_fields: [referral.reason, patient.age]
      llm:
        type: llm
        reasoning_effort: low
        state_fields: [referral.reason, patient.age]
  checklist:
    answers: [recent_visit_note, ecg_on_file, imaging_on_file, recent_labs, marked_urgent]
    use: criteria
    variants:
      criteria:
        type: criteria
        config: logic/checklist.yaml

policy: policy.yaml

evaluation:
  datasets:
    train: data/train.jsonl
    calibration: data/calibration.jsonl
    test: data/test.jsonl
    # Hand-written urgent referrals and routine look-alikes; the urgency rules were written on this set.
    urgent_referrals: data/urgent_referrals.jsonl
    # Written before the urgency rules; never used to write or tune them.
    urgent_referrals_holdout: data/urgent_referrals_holdout.jsonl
  benchmark: evals/benchmark.json
  benchmark_dataset: test
  critical:
    - {question: urgency, label: urgent}
    - {question: next_step, label: urgent_review}
  subgroups: [site, specialty, kind, style, age_band, sex]
  degradation_tolerance: 0.03

tests: tests/cases.yaml

audit:
  store_input: full

cds_hooks:
  hook: order-sign
  title: Referral Router
  description: >-
    When a referral is signed, suggests the specialty, flags referrals that may need to be seen
    within two weeks, and lists missing information.
  prefetch:
    patient: Patient/{{context.patientId}}
    documents: DocumentReference?patient={{context.patientId}}&category=clinical-note
    reports: DiagnosticReport?patient={{context.patientId}}
    labs: Observation?patient={{context.patientId}}&category=laboratory
  card:
    summaries:
      schedule: "Referral to {specialty}: ready to schedule"
      return_for_info: "Referral to {specialty} is missing information"
      urgent_review: "Possibly urgent {specialty} referral: review today"
      coordinator_review: "Referral needs a coordinator: no listed specialty fits"
      none: "Referral: no suggestion; the referral office will review it"
    indicators:
      schedule: info
      return_for_info: warning
      urgent_review: critical
      coordinator_review: info
      none: info
    # A card only where the person signing the referral can act: send it back with what is
    # missing, or review it today. A referral to schedule, for a coordinator or with no
    # suggestion is decided and audited for the referral office, with no card, and so is one
    # refused as invalid input (a BLOCK, which has no suggestion either). An ABSTAIN because
    # part of the record could not be read still gets its card.
    show: [return_for_info, urgent_review]
    suggestion: Create a referral task

# A Decision Pack written in YAML. Change anything; `mendari validate` checks it.
# The authoring guide walks through every section:
# https://github.com/mendari-hq/mendari/blob/main/docs/guides/authoring-a-pack.md
spec_version: "0.2"
id: "{{id}}"
version: 0.1.0
name: "{{name}}"
summary: >-
  Routes a patient portal message: a medication refill, an appointment request, or something
  else for the front desk. Messages that describe same-day symptoms go to a nurse.
publisher:
  name: "{{publisher}}"
  type: community
license: Apache-2.0

risk:
  # 0 administrative, 1 clinical information, 2 clinical support, 3 patient-level prediction,
  # 4 time-critical. At 2 and 3 a person reviews every decision unless your organization
  # records a governance approval; 4 is never automated. Choosing which team reads a message
  # first, with anything possibly urgent sent to a person, is administrative (0), as for the
  # patient inbox router; reading clinical facts to decide is 1 (the authoring guide's table).
  level: 0
  category: administrative
  rationale: >-
    The decision is which queue reads a message first. The pack never replies to patients or
    makes a clinical judgement, and a message that may describe same-day symptoms always goes to
    a nurse for review.

card:
  # What the pack's criteria, examples and data were built from: synthetic, de_identified or
  # site_records. Every surface derives the pack's status line from it.
  provenance: synthetic
  intended_use: >-
    Route portal messages to the refill queue, the scheduling queue or the front desk, and
    send messages describing same-day symptoms to a nurse.
  intended_users:
    - Front-desk and nursing staff
  patient_population: Adult patients who write to the clinic's portal, in English.
  out_of_scope:
    - Deciding whether a refill is appropriate; a clinician decides.
  known_failure_modes:
    - Keyword rules miss phrasings they don't list. Evaluate on your own messages before use.

inputs:
  schema: schemas/input.schema.json

questions:
  # Criteria are written for people: they are the pack's documentation and a model's
  # instructions.
  request:
    instructions: What does the patient ask for?
    criteria:
      refill: A refill or renewal of a medication they already take.
      appointment: To book, move or cancel a visit.
      other: Anything else, or more than one thing.
  urgent_symptoms:
    type: boolean
    instructions: Does the message describe symptoms that need attention today?
    criteria:
      "yes": For example chest pain, trouble breathing, or signs of a stroke.
      "no": No such symptoms.

providers:
  reader:
    answers: [request, urgent_symptoms]
    use: rules
    variants:
      rules:
        type: rules
        config: logic/rules.yaml

policy:
  primary: request
  thresholds:
    auto: 0.90    # automate from this confidence
    review: 0.50  # below this, no suggestion
  labels:
    other:
      allow_auto: false  # the front desk always reads these
  rules:
    - name: same-day-symptoms
      when:
        question: urgent_symptoms
        labels: ["yes"]
        min_probability: 0.3
      outcome: HUMAN_REVIEW
      priority: urgent
      reason: The message may describe symptoms that need a nurse today.
  fallback: The front desk reads the message.

evaluation:
  datasets:
    examples: data/examples.jsonl
  benchmark_dataset: examples
  critical:
    - {question: urgent_symptoms, label: "yes"}

tests: tests/cases.yaml

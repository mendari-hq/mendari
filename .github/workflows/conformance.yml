name: conformance

# Inferno's conformance suites against Mendari, weekly and by hand (sandbox/inferno/README.md).
# Not a required check: a run builds the kit, and its validator downloads and loads the
# implementation guides it needs from packages.fhir.org, which takes minutes. The offline
# `fhir-conformance` job in ci.yml stays the required gate.
#
# dtr-payer: the Da Vinci DTR test kit v0.18.0, suite dtr_payer_server_v220, with Inferno as the
# DTR client against the engine's `$questionnaire-package`, on synthetic data, in open mode.
# Groups 1, 3 and 4; group 2 (SMART Backend Services) waits for LP-23. The verdict is
# scripts/inferno_check.py's: every test must give the result its expected results file lists,
# so a new failure and an unexpected pass both fail the job. The raw output can quote request
# and response bodies: it is uploaded for 7 days and never committed.
# No secret is used: images are pulled anonymously, and the token Inferno sends is a static one
# the open engine never reads.
on:
  schedule:
    - cron: "29 10 * * 2"  # Tuesdays, 06:29 EDT or 05:29 EST (cron runs on UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dtr-payer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build the engine and the kit
        run: docker compose -f sandbox/inferno/docker-compose.yml build engine inferno
      - name: Start the engine (open mode, PHI mode off)
        run: docker compose -f sandbox/inferno/docker-compose.yml up -d --wait engine
      - name: The suite's inputs, made over HTTP against the engine (synthetic data)
        run: >-
          uv run python scripts/inferno_dtr_inputs.py --engine http://127.0.0.1:8090
          --out var/inferno/dtr_payer_server_v220_preset.json
      - name: The run's tests, with their short ids and requirement ids
        run: >-
          docker compose -f sandbox/inferno/docker-compose.yml run --rm -T --no-deps inferno
          bundle exec ruby /opt/mendari/list_tests.rb dtr_payer_server_v220 1 3 4
          > var/inferno/dtr_payer_server_v220_tests.json
      - name: Run groups 1, 3 and 4 (Inferno exits 3 when a test does not pass; the check decides)
        run: |
          docker compose -f sandbox/inferno/docker-compose.yml run --rm -T inferno \
            bundle exec inferno execute --suite dtr_payer_server_v220 --groups 1 3 4 \
            --preset-file /inputs/dtr_payer_server_v220_preset.json --outputter json \
            > var/inferno/dtr_payer_server_v220_results.json \
            || echo "inferno execute exited $?"
      - name: Every test gives its expected result
        run: >-
          uv run python scripts/inferno_check.py var/inferno/dtr_payer_server_v220_results.json
          --expected sandbox/inferno/dtr_payer_server_v220_expected.json
          --tests var/inferno/dtr_payer_server_v220_tests.json
      - name: The raw output, for 7 days (it can quote payloads; never committed)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: inferno-dtr-payer-raw
          path: var/inferno/
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f sandbox/inferno/docker-compose.yml logs --tail 200
      - if: always()
        run: docker compose -f sandbox/inferno/docker-compose.yml down --volumes

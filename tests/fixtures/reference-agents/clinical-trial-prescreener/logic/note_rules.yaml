# Keyword rules for exclusions documented in clinic notes (the offline default for `notes`).
#
# Written on data/exclusions.jsonl only; data/exclusions_holdout.jsonl measures them.
# English only: notes in other languages are mostly missed (see the Decision Card). Deploy with
# a model as a second reader (notes=rules_and_jev or rules_and_llm).
#
# Scores: "no" starts at `default_score`; each matching pattern adds its weight to "yes", and
# softmax(scores) gives P(yes). With default_score 3, a weight-6 pattern gives P(yes) = 0.95
# and a weight-2.5 pattern 0.38, enough for the policy's 0.3 review flag on the safety
# exclusions but not to call the exclusion documented.
#
# `negation_cues` also lists family members: a mention preceded by one of these words, in the
# same clause and within `negation_window` characters, is not about the patient now
# ("No history of pancreatitis", "Mother had pancreatitis", "Remote MI in 2015").
# Word gaps use [^.;!?\n] so that a match never spans two sentences.
text_fields: [notes]
temperature: 1.0
negation_cues:
  - "no"
  - not
  - denies
  - denied
  - without
  - never
  - negative
  - remote
  - mother
  - father
  - brother
  - sister
  - son
  - daughter
  - wife
  - husband
  - partner
  - aunt
  - uncle
  - grandmother
  - grandfather
  - family history
  - FHx
negation_window: 40

questions:
  note_pregnancy:
    default: "no"
    default_score: 3.0
    labels:
      "yes":
        - name: pregnant
          # "Pregnancy test negative" and "pregnancy ruled out" are not a pregnancy.
          pattern: "pregnan(?:t|cy)\\b(?![^.;!?\\n]*\\b(?:test (?:is |was )?negative|negative|ruled out)\\b)"
          weight: 6
          negatable: true
        - name: gravida-para
          pattern: "(?-i:\\bG\\d+(?:\\s*P\\d+)?\\b)"
          weight: 6
          negatable: true
        - name: gestational-age
          pattern: "\\b\\d{1,2}\\s*(?:weeks?|wks?)\\s*(?:pregnant|gestation|GA)\\b"
          weight: 6
          negatable: true
        - name: breastfeeding
          pattern: "breast-?feed\\w*|\\blactating\\b|\\bnursing (?:her|a|an) (?:baby|infant|newborn)\\b"
          weight: 6
          negatable: true
        - name: expecting
          pattern: "\\bexpecting (?:her |a |their )?(?:\\w+ )?(?:baby|child)\\b|\\bdue date\\b"
          weight: 6
          negatable: true
        - name: positive-hcg
          pattern: "\\bpositive (?:urine |serum )?(?:hcg|pregnancy test)\\b|\\bhcg (?:is |was )?positive\\b"
          weight: 6
          negatable: true

  note_pancreatitis:
    default: "no"
    default_score: 3.0
    labels:
      "yes":
        - name: pancreatitis
          pattern: "pancreatitis\\b(?![^.;!?\\n]*\\bruled out\\b)"
          weight: 6
          negatable: true

  note_active_cancer_treatment:
    default: "no"
    default_score: 3.0
    labels:
      "yes":
        - name: on-treatment
          pattern: "\\b(?:receiving|on|getting|started|starting|undergoing|continues|continuing|currently in)\\b[^.;!?\\n]{0,20}?\\b(?:chemo(?:therapy)?|radiation(?: therapy)?|radiotherapy|XRT|immunotherapy|hormone therapy|endocrine therapy|targeted therapy)\\b"
          weight: 6
          negatable: true
        - name: treatment-cycle
          pattern: "\\bcycle \\d+ of \\d+\\b"
          weight: 6
          negatable: true
        - name: being-treated-for-cancer
          pattern: "\\b(?:being treated|under treatment|in treatment) for\\b[^.;!?\\n]{0,30}?\\b(?:cancer|carcinoma|lymphoma|leuk(?:a)?emia|myeloma|melanoma|ca)\\b"
          weight: 6
          negatable: true

  note_recent_cv_event:
    default: "no"
    default_score: 3.0
    labels:
      "yes":
        # An event with a recency cue in the same sentence, in either order. The rules cannot
        # compare dates written in the text, so "rehab" and "stents placed" also count as cues.
        - name: recent-event
          pattern: "(?:heart attack|myocardial infarction|(?-i:\\bN?STEMI\\b|\\bMI\\b|\\bACS\\b|\\bCVA\\b)|acute coronary syndrome|unstable angina|\\bstroke)[^.;!?\\n]{0,60}?(?:\\b(?:[1-9]|1\\d|2[0-5]) (?:weeks?|wks?) ago|\\b\\d+ days? ago|\\b[1-6] (?:months?|mos?) ago|\\b(?:a few|two|three|several) (?:days|weeks) ago|\\blast (?:week|month)|\\bthis (?:week|month)|\\brecent(?:ly)?\\b|\\brehab\\b|\\bstents? placed)|(?:\\b(?:[1-9]|1\\d|2[0-5]) (?:weeks?|wks?) ago|\\b\\d+ days? ago|\\b[1-6] (?:months?|mos?) ago|\\blast (?:week|month)|\\bthis (?:week|month)|\\brecent(?:ly)?\\b)[^.;!?\\n]{0,60}?(?:heart attack|myocardial infarction|(?-i:\\bN?STEMI\\b|\\bMI\\b|\\bACS\\b|\\bCVA\\b)|acute coronary syndrome|unstable angina|\\bstroke)"
          weight: 6
          negatable: true
        # Any other mention: possibly recent, so it reaches review (policy flag at P >= 0.3).
        - name: event-mentioned
          pattern: "heart attack|myocardial infarction|(?-i:\\bN?STEMI\\b|\\bMI\\b|\\bACS\\b|\\bCVA\\b)|acute coronary syndrome|unstable angina|\\bstroke\\b"
          weight: 2.5
          negatable: true

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OpenHealth Hub</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>
    // Resolve the theme before the stylesheet paints anything, so there is never a flash of the
    // wrong theme: the saved choice (System / Light / Dark), else the system setting. theme.js
    // keeps it in sync afterwards.
    (function () {
      var choice = "system";
      try { choice = localStorage.getItem("oh.theme") || "system"; } catch (e) { /* private mode */ }
      var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <!-- The server fills the import map (each module's content-stamped URL) and preloads every module. -->
  <script type="importmap"></script>
</head>
<body>
  <!-- Keyboard users skip the top bar and the section list (a button: "#…" links are routes here). -->
  <button type="button" class="skip-link" id="skip-link">Skip to content</button>
  <!-- Icons from Lucide (https://lucide.dev), ISC License; see /static/LICENSE-lucide.txt. -->

  </svg>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <span>OpenHealth Hub</span>
      <span class="badge tag">sandbox · synthetic data only</span>
    </div>
    <div class="topbar-actions">
      <div class="segmented compact" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" title="Match the system setting"><svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg><span class="label">System</span></button>
        <button type="button" data-theme-choice="light" title="Light theme"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="label">Light</span></button>
        <button type="button" data-theme-choice="dark" title="Dark theme"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="label">Dark</span></button>
      </div>
      <label class="pack-picker">
        <span class="sr-only">Decision Pack</span>
        <select id="pack-select"></select>
      </label>
    </div>
  </header>
  <div class="shell">
    <nav class="nav" aria-label="Sections">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#review" data-view="review">Review queue <span class="count" id="review-count"></span></a>
      <a href="#audit" data-view="audit">Audit trail</a>
      <a href="#evals" data-view="evals">Evaluations</a>
      <a href="#feedback" data-view="feedback">Feedback</a>
      <a href="#card" data-view="card">Decision Card</a>
      <a href="#try" data-view="try">Try it</a>
      <a href="/docs" class="external">API docs <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg></a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <!-- The toast is for the eye; screen readers hear messages from the two live regions below it:
       notices politely, errors at once. -->
  <div id="toast" aria-hidden="true"></div>
  <div id="announce-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="announce-alert" class="sr-only" role="alert"></div>
  <script type="module" src="/static/main.js"></script>
</body>
</html>

# Synthetic behaviour tests shipped with the pack. `openhealth test` runs them against the
# pack's default providers. They document, in reviewable form, what the pack must always do.
#
# Every case is decided on 2026-09-01. The base record is complete for any specialty: a visit
# note, an ECG, an imaging report and labs, all recent, and priority `routine`.
#
# expect keys: outcome, outcome_in, not_outcome, recommendation, priority, answers.<question>

- name: a complete, routine dermatology referral is scheduled
  input: &base
    as_of: "2026-09-01"
    patient: {age: 45, sex: female}
    referral:
      reason: Eczema on the hands not controlled with steroid creams. Please advise on treatment.
      priority: routine
    documents: [{code: 11506-3, name: Progress note, date: "2026-08-20"}]
    reports:
      - {code: 11524-6, name: ECG, date: "2026-06-10"}
      - {code: 18748-4, name: Imaging report, date: "2026-07-15"}
    labs: [{code: 58410-2, name: CBC, date: "2026-08-15"}]
  expect:
    recommendation: schedule
    outcome_in: [AUTO, HUMAN_REVIEW]
    answers: {specialty: dermatology, urgency: routine, clear_question: "yes"}

- name: new exertional chest pain is reviewed today, never automated
  input:
    <<: *base
    referral:
      reason: New chest tightness when climbing stairs for 3 weeks, eases with rest. Please assess.
      priority: routine
  expect: {outcome: HUMAN_REVIEW, recommendation: urgent_review, priority: urgent, answers: {urgency: urgent}}

- name: a referral the referrer marked urgent is reviewed today
  input:
    <<: *base
    referral: {reason: "Psoriasis on the elbows; wants to discuss other treatments. Please advise.", priority: asap}
  expect: {outcome: HUMAN_REVIEW, recommendation: urgent_review, priority: urgent, answers: {marked_urgent: "yes"}}

- name: a stable, long-standing problem is not urgent
  input:
    <<: *base
    referral: {reason: "Known stable angina, unchanged for 5 years. Please review medication.", priority: routine}
  expect: {recommendation: schedule, answers: {specialty: cardiology, urgency: routine}}

- name: a cardiology referral without an ECG goes back for information
  input:
    <<: *base
    referral: {reason: "Palpitations for 6 months, ECG normal. Please assess.", priority: routine}
    reports: [{code: 18748-4, name: Imaging report, date: "2026-07-15"}]
  expect: {recommendation: return_for_info, not_outcome: AUTO, answers: {specialty: cardiology, ecg_on_file: "no"}}

- name: a dermatology referral does not need an ECG
  input:
    <<: *base
    referral: {reason: "Acne not improving after 8 months of treatment. Please advise.", priority: routine}
    reports: []
  expect: {recommendation: schedule, answers: {specialty: dermatology, ecg_on_file: "no"}}

- name: an orthopaedic referral needs recent imaging
  input:
    <<: *base
    referral: {reason: "Shoulder pain limiting overhead movement for 7 months. Please assess.", priority: routine}
    reports: [{code: 18748-4, name: Imaging report, date: "2025-03-01"}]
  expect: {recommendation: return_for_info, answers: {specialty: orthopedics, imaging_on_file: "no"}}

- name: an endocrine referral needs labs from the last 90 days
  input:
    <<: *base
    referral: {reason: "Hypothyroidism with TSH still raised despite dose changes. Please advise.", priority: routine}
    labs: [{code: 3016-3, name: TSH, date: "2026-04-01"}]
  expect: {recommendation: return_for_info, answers: {specialty: endocrinology, recent_labs: "no"}}

- name: a referral with no recent visit note goes back for information
  input:
    <<: *base
    documents: [{code: 11506-3, name: Progress note, date: "2025-11-01"}]
  expect: {recommendation: return_for_info, answers: {recent_visit_note: "no"}}

- name: a referral that only names a problem goes back for a clear request
  input:
    <<: *base
    referral: {reason: "Rash.", priority: routine}
  expect: {recommendation: return_for_info, answers: {clear_question: "no"}}

- name: a referral for a service outside the eight specialties goes to a coordinator
  input:
    <<: *base
    referral: {reason: "Recurrent ear infections. Please see ENT.", priority: routine}
  expect: {recommendation: coordinator_review, answers: {specialty: other}}

- name: an urgent referral outside the eight specialties is still reviewed today
  input:
    <<: *base
    referral: {reason: "Hoarse voice for 6 weeks in a smoker. Please see ENT.", priority: routine}
  expect: {recommendation: urgent_review, priority: urgent, answers: {urgency: urgent}}

- name: a negated red flag is not urgent
  input:
    <<: *base
    referral: {reason: "Chronic low back pain, no bladder or bowel change, no leg weakness. Please advise.", priority: routine}
  expect: {answers: {urgency: routine}, not_outcome: BLOCK}

- name: an empty referral gives no confident suggestion
  input: {as_of: "2026-09-01"}
  expect: {not_outcome: AUTO}

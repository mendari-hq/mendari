# FHIR R4 -> pack input: one order (ServiceRequest) and the patient's coverage and record. The
# as-of date is the day of the request. Spec 0.3 (docs/spec/agent-manifest-0.3.md): a coding is
# read by its code system wherever it sits, the payer through the Coverage's reference to its
# Organization, and a note through `attachment_text` (plain text or HTML, inline or in a Binary).
fhir_version: R4
focus: ServiceRequest
focus_where:
  # Only the services the pack has requirement sets for, by the pack's fictional procedure code
  # wherever it sits among the order's codings; other orders signed at the same time get no
  # decision and no card.
  path: "code.coding[system=https://mendari.co/fhir/CodeSystem/fictional-procedures].code"
  in: ["FX101", "FX102", "FX103", "FX201", "FX202", "FX301", "FX302"]

resources:
  ServiceRequest:
    required: true

fields:
  order.code:
    # The pack's fictional procedure code wherever it sits. An order without one is not the
    # pack's (`focus_where`), so no other coding is read: a site's own order code that
    # logic/structured.yaml lists counts on JSON input, not through FHIR.
    path: "ServiceRequest.code.coding[system=https://mendari.co/fhir/CodeSystem/fictional-procedures].code"
  order.name:
    path: ServiceRequest.code.text
  coverage.payer:
    # The Organization the Coverage's first payor names (contained, in the record, or read from
    # the EHR), by its identifier in the synthetic payers' system; else the payor's own
    # identifier as the Coverage writes it, which is how the synthetic records name their payers.
    # A site's own payer identifier is neither: it reads as no payer the pack knows (`other`).
    follow: Coverage.payor[0]
    paths:
      - "Organization.identifier[system=https://mendari.co/fhir/sid/fictional-payers].value"
      - Coverage.payor[0].identifier.value
  patient.age:
    path: Patient.birthDate
    transform: age_years
  patient.sex:
    path: Patient.gender
    map: {female: female, male: male, other: other, unknown: unknown}
  notes:
    # Plain text and HTML, inline or in a Binary the attachment's url names; RTF, PDF and CDA
    # are unreadable, and the decision abstains (spec 0.3 §2.4).
    path: DocumentReference.content.attachment
    transform: attachment_text

lists:
  conditions:
    resource: Condition
    fields:
      code:
        # ICD-10-CM wherever it sits, else the first coding (a site's own code).
        paths:
          - "code.coding[system=http://hl7.org/fhir/sid/icd-10-cm].code"
          - code.coding[0].code
      text:
        path: code.text
  procedures:
    resource: Procedure
    fields:
      code:
        # The pack's fictional procedure code wherever it sits, else the first coding.
        paths:
          - "code.coding[system=https://mendari.co/fhir/CodeSystem/fictional-procedures].code"
          - code.coding[0].code
      name:
        path: code.text
      date:
        path: performedDateTime

# Decision -> FHIR Task for the prior-authorization work queue.
task:
  code_text: Prior authorization preflight
  performer_system: https://mendari.co/fhir/CodeSystem/prior-auth-queue
  performer: prior-auth-team
  description: "Prior auth for {service} ({payer}): {recommendation}"

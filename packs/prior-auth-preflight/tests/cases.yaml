# Synthetic behaviour tests shipped with the pack. `mendari test` runs them against the
# pack's default providers (keyword rules for the notes, so nothing is automated).
#
# Every case is decided on 2026-09-01. The base order is a lumbar MRI for an Acme member with a
# supporting diagnosis, a recent lumbar X-ray and 8 weeks of physical therapy.
#
# expect keys: outcome, outcome_in, not_outcome, recommendation, priority, answers.<question>

- name: a complete lumbar MRI request is ready to submit
  input: &lumbar
    as_of: "2026-09-01"
    patient: {age: 52, sex: male}
    order: {code: "72148", name: MRI lumbar spine without contrast}
    coverage: {payer: acme}
    conditions:
      - {code: M54.16, text: "Radiculopathy, lumbar region"}
    procedures:
      - {code: "72100", name: X-ray lumbar spine, date: "2026-07-20"}
    notes: "Low back pain for 3 months. Completed 8 weeks of physical therapy without improvement."
  expect:
    recommendation: submit_ready
    outcome: HUMAN_REVIEW  # rules only: no AUTO (automation_requires)
    answers: {service: lumbar_mri, payer: acme, conservative_therapy: "yes", red_flag: "no"}

- name: too little physical therapy is a gap
  input:
    <<: *lumbar
    notes: "Back pain radiating to the left leg. Started PT 2 weeks ago."
  expect: {recommendation: needs_attention, answers: {conservative_therapy: "no"}}

- name: therapy without a duration is unclear, and unclear is a gap
  input:
    <<: *lumbar
    notes: "Has tried some physical therapy for his back."
  expect: {recommendation: needs_attention, answers: {conservative_therapy: unknown}}

- name: a red flag waives conservative treatment and is flagged for urgent review
  input:
    <<: *lumbar
    notes: "History of prostate cancer, now new back pain at night."
  expect:
    recommendation: submit_ready
    outcome: HUMAN_REVIEW
    priority: urgent
    answers: {red_flag: "yes", conservative_therapy: "no"}

- name: a red flag in a family member is not a red flag
  input:
    <<: *lumbar
    notes: "Father had colon cancer. Back pain for 2 months; 6 weeks of PT."
  expect: {recommendation: submit_ready, priority: routine, answers: {red_flag: "no"}}

- name: Acme asks for a recent lumbar X-ray
  input:
    <<: *lumbar
    procedures:
      - {code: "72100", name: X-ray lumbar spine, date: "2025-11-01"}
  expect: {recommendation: needs_attention, answers: {prior_imaging: "no"}}

- name: Beacon does not ask for prior imaging
  input:
    <<: *lumbar
    coverage: {payer: beacon}
    procedures: []
  expect: {recommendation: submit_ready, answers: {payer: beacon, prior_imaging: "no"}}

- name: a diagnosis that does not support the service is a gap
  input:
    <<: *lumbar
    conditions:
      - {code: R51.9, text: Headache}
  expect: {recommendation: needs_attention, answers: {diagnosis_supports: "no"}}

- name: a knee arthroscopy needs mechanical symptoms
  input: &knee
    <<: *lumbar
    order: {code: "29881", name: Knee arthroscopy with meniscectomy}
    conditions:
      - {code: S83.241A, text: Tear of medial meniscus}
    procedures:
      - {code: "73721", name: MRI knee, date: "2026-07-10"}
    notes: "Knee pain on stairs, no locking or catching. Completed 8 weeks of PT."
  expect: {recommendation: needs_attention, answers: {service: knee_arthroscopy, mechanical_symptoms: "no"}}

- name: a complete knee arthroscopy request is ready to submit
  input:
    <<: *knee
    notes: "Knee locks several times a week after a twisting injury. 6 weeks of PT did not help."
  expect: {recommendation: submit_ready, answers: {mechanical_symptoms: "yes", conservative_therapy: "yes"}}

- name: a red flag does not waive conservative treatment for a knee arthroscopy
  input:
    <<: *knee
    notes: "The knee locks. History of breast cancer."
  expect: {recommendation: needs_attention, answers: {red_flag: "yes", conservative_therapy: "no"}}

- name: a sleep study needs apnoea symptoms
  input: &sleep
    <<: *lumbar
    order: {code: "95810", name: Polysomnography}
    conditions:
      - {code: R06.83, text: Snoring}
    procedures: []
    notes: "Wife reports loud snoring and pauses in breathing at night."
  expect: {recommendation: submit_ready, answers: {service: sleep_study, sleep_symptoms: "yes"}}

- name: insomnia is not an apnoea symptom
  input:
    <<: *sleep
    notes: "Trouble falling asleep because of stress; no snoring."
  expect: {recommendation: needs_attention, answers: {sleep_symptoms: "no"}}

- name: Beacon does not require prior authorization for a sleep study
  input:
    <<: *sleep
    coverage: {payer: beacon}
  expect: {recommendation: not_required, answers: {payer: beacon}}

- name: an unknown payer is not checked
  input:
    <<: *lumbar
    coverage: {payer: summit}
  expect: {recommendation: not_checked, not_outcome: AUTO, answers: {payer: other}}

- name: a service without a requirement set is not checked
  input:
    <<: *lumbar
    order: {code: "70553", name: MRI brain}
  expect: {recommendation: not_checked, answers: {service: other}}

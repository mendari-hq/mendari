# Mendari on Kubernetes: the engine behind a Service, and a daily CronJob for retention and
# monitoring. Postgres is yours (a managed database, or your operator of choice).
#
# Create the secret first (never commit it):
#   kubectl create secret generic mendari-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=MENDARI_OIDC_CLIENT_SECRET='...' \
#     --from-literal=MENDARI_PHI_KEY='...' \
#     --from-literal=MENDARI_INPUT_HASH_KEY='...'
# (the two keys differ: each 32 random bytes, base64)
# Set `image:` (twice below) to a release image, e.g. ghcr.io/junebugg1214/mendari-engine:v0.6.0,
# or one pack's image (mendari-referral-router). No release is published yet: until then,
# build and push your own (`docker build --build-arg PACK=... .`, see deploy/README.md).
# then: kubectl apply -f mendari.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mendari-config
data:
  MENDARI_PUBLIC_URL: https://mendari.example.org
  MENDARI_OIDC_ISSUER: https://login.example.org/realms/clinic
  MENDARI_OIDC_CLIENT_ID: mendari
  MENDARI_OIDC_ROLE_MAP: clinicians=reviewer,informatics=admin,ai-committee=governance
  MENDARI_PHI_MODE: encrypt
  MENDARI_RETENTION_DAYS: "90"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mendari
  labels: {app: mendari}
spec:
  replicas: 2
  selector:
    matchLabels: {app: mendari}
  template:
    metadata:
      labels: {app: mendari}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: engine
          image: ghcr.io/junebugg1214/mendari-engine:RELEASE
          command: ["sh", "-c", "mendari serve --host 0.0.0.0 --port 8000 --db \"$DATABASE_URL\""]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: mendari-config}
            - secretRef: {name: mendari-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: mendari
spec:
  selector: {app: mendari}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mendari-daily
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: jobs
              image: ghcr.io/junebugg1214/mendari-engine:RELEASE
              command:
                - sh
                - -c
                - mendari phi purge --db "$DATABASE_URL" && (mendari monitor --db "$DATABASE_URL" || true)
              envFrom:
                - configMapRef: {name: mendari-config}
                - secretRef: {name: mendari-secrets}

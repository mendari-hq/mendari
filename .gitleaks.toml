# gitleaks configuration (ci.yml, job `secrets`): the default rules, plus each reviewed false
# positive, allowed as narrowly as it can be. Add an entry only for a finding that is not a
# secret, with the reason; a real secret is revoked and rotated first, never allowed here.
title = "Mendari"

[extend]
useDefault = true

[[allowlists]]
description = """deploy/onprem/.env.example leaves MENDARI_PHI_KEY= empty for the operator to fill. \
The generic-api-key rule matched across the newline and took the next line for the key \
(commits 3e67c62c and 3678ffde, line 17)."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^deploy/onprem/\.env\.example$''']
regexTarget = "match"
regexes = ['''^MENDARI_PHI_KEY=\r?\n''']

[[allowlists]]
description = """src/mendari/server/connection_routes.py passes a variable and the signed-in \
actor's name as keyword arguments (`token=token, by=principal.actor`). The generic-api-key rule \
took the second argument for the first one's value (commit f12650c2, line 261)."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/mendari/server/connection_routes\.py$''']
regexTarget = "match"
regexes = ['''^token, by=principal\.actor$''']

[[allowlists]]
description = """tests/support/evaluation_pages.py annotates a parameter with its type \
(`key: Ed25519PrivateKey = KEY`). The generic-api-key rule took the class's name for a key \
(commit 9a14c8c5, line 153)."""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/support/evaluation_pages\.py$''']
regexTarget = "match"
regexes = ['''^key: Ed25519PrivateKey\s*$''']

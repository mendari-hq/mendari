# The Mendari documentation site: every page in docs/.
#   uv sync --group docs && uv run mkdocs serve      # http://127.0.0.1:8000
#   uv run mkdocs build --strict                      # what CI runs: a broken link fails
site_name: Mendari
site_description: Open, auditable Decision Packs for healthcare
# Where the docs workflow (.github/workflows/docs.yml) publishes the site: GitHub Pages by
# default, until the owner names the host (tasks/todo.md, LP-15c); a custom domain changes this
# line. Links inside docs/ stay relative.
site_url: https://mendari-hq.github.io/mendari/
repo_url: https://github.com/mendari-hq/mendari
edit_uri: edit/main/docs/
strict: true

# The notice every page shows, from src/mendari/notices.py (scripts/check_site_notice.py checks).
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  custom_dir: docs_theme
  font: false  # system fonts: the site makes no third-party requests
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark theme}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light theme}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  # The API guide includes the example scripts CI runs (src/mendari/dashboard/snippets/); a
  # missing one fails the build.
  - pymdownx.snippets:
      base_path: [src/mendari/dashboard/snippets]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Guides:
      - Writing a Decision Pack: guides/authoring-a-pack.md
      - Contributing a community pack: guides/contributing-a-pack.md
      - Using the API: guides/api.md
      - Connecting an EHR: guides/connecting-an-ehr.md
      - Deploying with real patient data: deploying-with-phi.md
      - Holding automation: operations/automation-hold.md
      - Revoking access: operations/revoking-access.md
      - Organizations and memberships: operations/accounts.md
      - Status checks: operations/status-checks.md
      - Hidden evaluation sets: operations/evalsets.md
      - Running the scoreboard: operations/scoreboard.md
      - Running a pack registry: operations/registry.md
      - Incident runbook: operations/incident-runbook.md
  - Reference:
      - Decision Pack spec 0.3 (FHIR mapping): spec/decision-pack-0.3.md
      - Decision Pack spec 0.2: spec/decision-pack-0.2.md
      - Evaluation reports and ledgers: spec/evaluation-reports.md
      - Decision Pack spec 0.1: spec/decision-pack-0.1.md
      - Architecture: architecture.md
  - Grading:
      - Grading method 1.0 (draft): grading/method-1.0.md
      - Scoreboard (public sets): grading/scoreboard.md
      - Verifying a scoreboard result: grading/verifying.md
  - Security:

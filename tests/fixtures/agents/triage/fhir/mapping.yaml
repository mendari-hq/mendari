# FHIR R4 to the fixture's input. A synthetic message is a Communication: its topic, its text and
# how it came (the sandbox's message-channel codes: portal, sms, email). Its sender is a Patient,
# which the fixture does not read.
fhir_version: R4
focus: Communication

resources:
  Communication:
    required: true
  Patient:
    required: false

fields:
  message.subject:
    path: Communication.topic.text
  message.body:
    path: Communication.payload.contentString
    transform: join
  message.channel:
    path: Communication.medium[0].coding[0].code
    map: {portal: portal, sms: sms, email: email}

# The decision as a FHIR Task: the team it suggests, in the fixture's own performer system.
task:
  code_text: Route a synthetic patient message
  performer_system: https://mendari.co/fhir/CodeSystem/fixture-triage-team

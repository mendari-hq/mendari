# FHIR R4 -> pack input: one order (ServiceRequest) and the patient's coverage and record. The
# as-of date is the day of the request.
fhir_version: R4
focus: ServiceRequest
focus_where:
  # Only the services the pack has requirement sets for; other orders signed at the same time
  # get no decision and no card.
  path: code.coding[0].code
  in: ["72148", "72149", "72158", "29880", "29881", "95810", "95811"]

resources:
  ServiceRequest:
    required: true

fields:
  order.code:
    path: ServiceRequest.code.coding[0].code
  order.name:
    path: ServiceRequest.code.text
  coverage.payer:
    # The synthetic payers are identified by their payor identifier value.
    path: Coverage.payor[0].identifier.value
  patient.age:
    path: Patient.birthDate
    transform: age_years
  patient.sex:
    path: Patient.gender
    map: {female: female, male: male, other: other, unknown: unknown}
  notes:
    path: DocumentReference.content.attachment.data
    transform: base64_text

lists:
  conditions:
    resource: Condition
    fields:
      code:
        path: code.coding[0].code
      text:
        path: code.text
  procedures:
    resource: Procedure
    fields:
      code:
        path: code.coding[0].code
      name:
        path: code.text
      date:
        path: performedDateTime

# Decision -> FHIR Task for the prior-authorization work queue.
task:
  code_text: Prior authorization preflight
  performer_system: https://mendari.co/fhir/CodeSystem/prior-auth-queue
  performer: prior-auth-team
  description: "Prior auth for {service} ({payer}): {recommendation}"

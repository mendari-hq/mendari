# The checks an operator's status page runs against a Mendari deployment (LP-21b): set them up
# in your status provider as docs/operations/status-checks.md says, or run them here with
# `python scripts/status_checks.py --api https://... [--registry ...] [--hub ...]`.
#
# {api}, {registry} and {hub} are your base URLs. A check whose base is not given is skipped.
# A registry served under the engine (MENDARI_REGISTRY=on) has the base {api}/registry.
# The decide check's key is read from the environment variable it names, never from this file:
# a key of its own, decide-only, in an organization of its own, so its decisions are told apart
# from anyone's (each waits in that organization's review queue). It decides with the bundled
# demo agent.
interval_seconds: 300
checks:
  - name: readiness
    what: the database answers and the agents loaded (503 when not; /api/health stays up)
    request: {method: GET, url: "{api}/api/health/ready"}
    expect: {status: [200]}

  - name: sign-in
    what: signing in reaches the identity provider (with sign-in on; skipped in open mode)
    request: {method: GET, url: "{api}/auth/login?next=%2F"}
    expect: {status: [302], location_leaves: "{api}"}
    only_with_sign_in: true

  - name: decide
    what: a synthetic decision by the bundled demo agent, with the status organization's key
    request:
      method: POST
      url: "{api}/api/agents/mendari/portal-message-agent/decide"
      key_from: STATUS_DECIDE_KEY
      json:
        message: {body: "Status check: what time does the clinic open on Friday?"}
    expect: {status: [200], json_has: outcome}

  - name: registry
    what: the agent registry answers
    request: {method: GET, url: "{registry}/v1/health"}
    expect: {status: [200]}

  - name: hub
    what: the Hub's page loads
    request: {method: GET, url: "{hub}/"}
    expect: {status: [200]}

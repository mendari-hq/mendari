# OpenHealth on Kubernetes: the engine behind a Service, and a daily CronJob for retention and
# monitoring. Postgres is yours (a managed database, or your operator of choice).
#
# Create the secret first (never commit it):
#   kubectl create secret generic openhealth-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=OPENHEALTH_OIDC_CLIENT_SECRET='...' \
#     --from-literal=OPENHEALTH_PHI_KEY='...'
# Set `image:` (twice below) to a release image, e.g. ghcr.io/junebugg1214/openhealth-engine:v0.6.0,
# or one pack's image (openhealth-referral-router). No release is published yet: until then,
# build and push your own (`docker build --build-arg PACK=... .`, see deploy/README.md).
# then: kubectl apply -f openhealth.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: openhealth-config
data:
  OPENHEALTH_PUBLIC_URL: https://openhealth.example.org
  OPENHEALTH_OIDC_ISSUER: https://login.example.org/realms/clinic
  OPENHEALTH_OIDC_CLIENT_ID: openhealth
  OPENHEALTH_OIDC_ROLE_MAP: clinicians=reviewer,informatics=admin,ai-committee=governance
  OPENHEALTH_PHI_MODE: encrypt
  OPENHEALTH_RETENTION_DAYS: "90"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhealth
  labels: {app: openhealth}
spec:
  replicas: 2
  selector:
    matchLabels: {app: openhealth}
  template:
    metadata:
      labels: {app: openhealth}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: engine
          image: ghcr.io/junebugg1214/openhealth-engine:RELEASE
          command: ["sh", "-c", "openhealth serve --host 0.0.0.0 --port 8000 --db \"$DATABASE_URL\""]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: openhealth-config}
            - secretRef: {name: openhealth-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: openhealth
spec:
  selector: {app: openhealth}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openhealth-daily
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: jobs
              image: ghcr.io/junebugg1214/openhealth-engine:RELEASE
              command:
                - sh
                - -c
                - openhealth phi purge --db "$DATABASE_URL" && (openhealth monitor --db "$DATABASE_URL" || true)
              envFrom:
                - configMapRef: {name: openhealth-config}
                - secretRef: {name: openhealth-secrets}

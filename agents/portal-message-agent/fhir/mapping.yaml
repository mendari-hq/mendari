# FHIR R4 -> the agent's input. A portal message is a Communication; its sender is a Patient,
# which the agent does not read (it decides from the message alone).
fhir_version: R4
focus: Communication

resources:
  Communication:
    required: true
  Patient:
    required: false

fields:
  message.subject:
    path: Communication.topic.text
  message.body:
    path: Communication.payload.contentString
    transform: join

# Decision -> FHIR Task that puts the message in the queue that reads it first.
task:
  code_text: Route portal message
  performer_system: https://mendari.co/fhir/CodeSystem/portal-queue

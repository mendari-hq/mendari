# Test fixture for the AI Guard runtime: the `dosing` provider, a blocking policy rule and the
# `guard` section. Not a real pack.
spec_version: "0.2"
id: mendari-test/guard-mini
version: 0.1.0
name: Guard Mini (test fixture)
summary: Toy guard for LLM draft replies, used to test the v0.3 runtime.
publisher: {name: Mendari tests, type: community}
license: Apache-2.0
risk:
  level: 2
  category: clinical support
  rationale: Test fixture.
card:
  intended_use: Test fixture only.
  intended_users: [Mendari developers]
  patient_population: Synthetic.
inputs:
  schema: schemas/input.schema.json
questions:
  question_emergency:
    instructions: Does the question describe a possible emergency?
    criteria: {"yes": Possibly an emergency., "no": Not an emergency., unknown: Unclear.}
  draft_escalates:
    instructions: Does the draft tell the patient to seek emergency care now?
    criteria: {"yes": It does., "no": It does not., unknown: Unclear.}
  dose_exceeds_limit:
    instructions: Does a dose in the draft go above the maximum?
    criteria: {"yes": Above the maximum., "no": Within the maximum or no dose., unknown: Cannot tell.}
  verdict:
    instructions: May the draft be sent?
    criteria: {pass: Safe to send., review: A clinician should check it., block: Must not be sent.}
    derive:
      from: [question_emergency, draft_escalates, dose_exceeds_limit]
      table:
        - {any: "yes", in: [question_emergency], when: {draft_escalates: ["no", unknown]}, then: block}
        - {any: "yes", in: [dose_exceeds_limit], then: block}
        - {any: ["yes", unknown], in: [question_emergency, dose_exceeds_limit], then: review}
        - {else: pass}
providers:
  screen:
    answers: [question_emergency, draft_escalates]
    use: rules
    variants:
      rules: {type: rules, config: logic/screen.yaml}
  dosing:
    answers: [dose_exceeds_limit]
    use: dosing
    variants:
      dosing: {type: dosing, config: logic/doses.yaml}
policy:
  primary: verdict
  thresholds: {auto: 0.9, review: 0.4}
  rules:
    - name: possible-block
      when: {question: verdict, labels: [block], min_probability: 0.3}
      outcome: BLOCK
      reason: The draft may be unsafe to send.
  fallback: Do not send the draft; route the message to nurse triage.
tests: tests/cases.yaml
guard: {draft: draft, release: [pass]}

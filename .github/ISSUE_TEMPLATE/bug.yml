name: Bug
description: Something in the engine, dashboard, CLI or Hub doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Never paste real patient data. Use synthetic examples (`mendari sandbox generate`
        makes some).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Commands, a pack id and version, a synthetic input.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (`mendari --version` or the commit)

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: openhealth-test
          POSTGRES_DB: openhealth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENHEALTH_TEST_DATABASE_URL: postgresql://postgres:openhealth-test@localhost:5432/openhealth_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv run openhealth test openhealth/patient-inbox-router
      - run: uv run openhealth test openhealth/clinical-trial-prescreener
      - run: uv run openhealth test openhealth/referral-router
      - run: uv run openhealth test openhealth/prior-auth-preflight
      - run: uv run openhealth test openhealth/ai-guard

  browser:
    # The dashboard in a real browser (tests/browser, skipped by the default pytest run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser

  reference-pack:
    # Derived pack artifacts (synthetic data, trained model) must be reproducible from source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: ./scripts/build-reference-pack.sh
      - name: Data and model are byte-identical
        run: git diff --exit-code -- packs datasets ':!packs/*/evals/benchmark.json' ':!packs/*/DECISION_CARD.md'

  fhir-conformance:
    # US Core 6.1.0 with the official HL7 FHIR validator: what OpenHealth accepts or produces as
    # conforming has no errors, and every resource the in-process checks flag is an error for the
    # validator too (scripts/fhir_validate.py).
    runs-on: ubuntu-latest
    env:
      VALIDATOR_VERSION: "6.10.4"
      VALIDATOR_SHA256: 1106b9d58f9e363e47bea7c4fc065841e5fc91fe9d062775c3bfdd212bd653cc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            var/validator/validator_cli.jar
            ~/.fhir
          key: fhir-validator-${{ env.VALIDATOR_VERSION }}-us-core-6.1.0
      - name: Download the HL7 FHIR validator (pinned, checksum verified)
        run: |
          mkdir -p var/validator
          if [ ! -f var/validator/validator_cli.jar ]; then
            curl -sSfL -o var/validator/validator_cli.jar \
              "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          fi
          echo "${VALIDATOR_SHA256}  var/validator/validator_cli.jar" | sha256sum -c -
      - run: uv sync --locked
      - run: uv run python scripts/audit_fhir_sample.py var/fhir-samples/audit-export.json
      - run: uv run python scripts/sandbox_fhir_sample.py var/fhir-samples
      - run: >-
          uv run python scripts/fhir_validate.py
          --valid tests/fixtures/us-core/*.json var/fhir-samples/*.json
          --invalid tests/fixtures/us-core/invalid/*.json

  sandbox-e2e:
    # The roadmap's v0.4 exit on the real sandbox (docker compose): HAPI FHIR, the SMART launcher
    # and the engine. The inbox and referral packs run from a scripted SMART EHR launch, and every
    # input they decide on conforms to US Core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait engine launcher
      - name: Wait until the workflow has seeded both packs
        run: |
          docker compose up -d workflow
          for i in $(seq 1 60); do
            total=$(curl -s -H 'cache-control: no-cache' \
              'http://127.0.0.1:8080/fhir/ServiceRequest?_tag=https%3A%2F%2Fopenhealth.dev%2Ffhir%2Fsandbox%7Csynthetic&_summary=count' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total", 0))' 2>/dev/null || echo 0)
            [ "${total:-0}" -gt 0 ] && echo "seeded ($total referrals)" && exit 0
            sleep 5
          done
          docker compose logs workflow
          exit 1
      - name: SMART launch, referral pack
        run: >-
          docker compose exec -T engine openhealth sandbox smart-launch --strict
          --engine http://engine:8000 --launcher http://launcher --fhir http://fhir:8080/fhir
          --pack openhealth/referral-router
      - name: SMART launch, inbox pack
        run: >-
          docker compose exec -T engine openhealth sandbox smart-launch --strict
          --engine http://engine:8000 --launcher http://launcher --fhir http://fhir:8080/fhir
          --pack openhealth/patient-inbox-router
      - name: Bulk export -> dataset -> openhealth eval (referral pack)
        # The export's cases must evaluate exactly like the same cases read from the dataset file.
        run: >-
          docker compose exec -T engine openhealth sandbox bulk-check
          --fhir http://fhir:8080/fhir --pack openhealth/referral-router
      - if: failure()
        run: docker compose logs --tail 200

  hub-site:
    # The Hub website (hub/, Next.js) against a real registry holding the five reference packs.
    runs-on: ubuntu-latest
    env:
      OPENHEALTH_REGISTRY_ADMIN_TOKEN: ci-only-admin-token
      REGISTRY_URL: http://127.0.0.1:8100
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start a registry and publish the five packs
        run: |
          uv run openhealth registry serve --db /tmp/registry.db --port 8100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/v1/health && break; sleep 1; done
          uv run python scripts/hub_seed.py --registry http://127.0.0.1:8100
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
        working-directory: hub
      - run: npm run lint
        working-directory: hub
      - run: npm run typecheck
        working-directory: hub
      - run: npm run build
        working-directory: hub
      - run: npx playwright install --with-deps chromium
        working-directory: hub
      - run: npm test
        working-directory: hub
        env:
          CI: "1"

  hub-e2e:
    # The v0.5 exit: on a clean machine, `pip install openhealth && openhealth pull
    # openhealth/referral-router` works. The wheel stands in for PyPI until the release.
    runs-on: ubuntu-latest
    env:
      OPENHEALTH_REGISTRY_ADMIN_TOKEN: ci-only-admin-token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start a registry and publish the five packs
        run: |
          uv run openhealth registry serve --db /tmp/registry.db --port 8100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8100/v1/health && break; sleep 1; done
          uv run python scripts/hub_seed.py --registry http://127.0.0.1:8100
      - run: uv build --wheel --out-dir /tmp/dist
      - name: A clean virtual environment installs openhealth, pulls a pack and tests it
        env:
          HOME: /tmp/clean-home
          OPENHEALTH_REGISTRY_URL: http://127.0.0.1:8100
        run: |
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet /tmp/dist/*.whl
          /tmp/clean/bin/openhealth pull openhealth/referral-router
          test -f /tmp/clean-home/.cache/openhealth/packs/openhealth/referral-router/0.1.1/pack.yaml
          /tmp/clean/bin/openhealth test openhealth/referral-router
          /tmp/clean/bin/openhealth search --risk 2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openhealth-engine:ci .
      - run: docker run --rm openhealth-engine:ci openhealth test openhealth/patient-inbox-router
      - run: docker run --rm openhealth-engine:ci openhealth test openhealth/clinical-trial-prescreener
      - run: docker run --rm openhealth-engine:ci openhealth test openhealth/referral-router
      - run: docker run --rm openhealth-engine:ci openhealth test openhealth/prior-auth-preflight
      - run: docker run --rm openhealth-engine:ci openhealth test openhealth/ai-guard
      - name: A per-pack image serves only its pack
        run: |
          docker build --build-arg PACK=openhealth/referral-router -t openhealth-referral:ci .
          docker run --rm openhealth-referral:ci python -c "
          from fastapi.testclient import TestClient
          from openhealth.server.app import create_app
          packs = TestClient(create_app(db_path='/tmp/a.db')).get('/api/packs').json()
          assert [p['id'] for p in packs] == ['openhealth/referral-router'], packs
          print('serves', packs[0]['id'])
          "

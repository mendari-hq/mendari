          - file: NOTICE
          - file: SECURITY.md
          - file: CODE_OF_CONDUCT.md
          - tests:
              - tests/test_excluded_paths.py::test_each_excluded_path_is_refused_at_any_depth
              - tests/test_excluded_paths.py::test_an_image_is_checked_in_its_application_paths_and_for_agent_files_anywhere
              - tests/test_workflow_safety.py::test_ci_checks_what_would_be_published_for_excluded_paths
              - tests/test_packaging.py::test_the_sdist_includes_exactly_the_build_inputs
              - tests/test_notice_file.py::test_notice_is_what_the_manifest_says
              - tests/test_dco.py::test_a_signed_commit_passes_and_an_unsigned_one_fails
              - tests/test_dco.py::test_contributing_asks_every_commit_to_be_signed_off
              - tests/test_dco.py::test_the_code_of_conduct_is_contributor_covenant_2_1
              - tests/test_workflow_safety.py::test_every_commit_of_a_pull_request_is_signed_off
              - tests/test_security_txt.py::test_the_policy_and_its_disclosure_window_are_linked
              - tests/test_workflow_safety.py::test_nothing_starts_on_a_tag_push
              - tests/test_workflow_safety.py::test_a_release_publishes_only_by_hand_after_its_build_from_a_guarded_environment
              - tests/test_release_gate.py::test_the_environment_guard_fails_closed
      - id: a2-docs-promise
        what: "A2: what the docs promise works (release paths, docs deploy, every documented command checked, one-line errors), and the scaffold and README point at the published docs"
        owner: build
        probes:
          - tests:
              - tests/test_release_gate.py::test_the_version_is_the_same_wherever_it_is_written
              - tests/test_workflow_safety.py::test_a_release_publishes_only_by_hand_after_its_build_from_a_guarded_environment
              - tests/test_workflow_safety.py::test_the_docs_deploy_by_hand_from_a_strict_checked_build
              - tests/test_doc_blocks.py::test_every_shell_and_python_block_has_its_marker
              - tests/test_doc_blocks.py::test_ci_runs_every_runner
              - tests/test_cli_errors.py::test_a_broken_input_is_one_line_and_exit_1
              - tests/test_cli_errors.py::test_debug_lets_the_error_through
              - tests/test_validate_datasets.py::test_validate_reads_every_declared_dataset
          - pending: "owner step 9 (the docs on GitHub Pages), then a build PR that points `mendari new` and the README at mkdocs.yml's site_url (LP-15 requirement 2)"
      - id: a5-phi-protection
        what: "A5: patient data on the hosted site encrypted by default, retention on a schedule, erasure, key rotation"
        owner: build
        probes:
          - tests:

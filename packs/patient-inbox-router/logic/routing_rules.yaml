# Keyword routing baseline (answers `destination`). Transparent and dependency-free, but it
# cannot weigh context, so it is the `rules` variant rather than the default router.
text_fields: [message.subject, message.body]
temperature: 1.5

questions:
  destination:
    default: front_desk
    default_score: 0.5
    labels:
      front_desk:
        - {name: scheduling, weight: 2.5, pattern: "schedul|appointment|\\bappt\\b|\\bbook\\b|cancel|opening|\\bslots?\\b|availab|\\bcita\\b"}
        - {name: logistics, weight: 2.0, pattern: "\\bhours\\b|\\bopen\\b|\\bpark|address|location|directions|arrive early|\\babren\\b"}
        - {name: portal, weight: 2.5, pattern: "portal|log ?in|password|proxy|\\bapp\\b"}
        - {name: contact-details, weight: 2.5, pattern: "phone number|\\bmoved\\b|contact method"}
      medical_assistant:
        - {name: refill, weight: 3.0, pattern: "refill|renew|day supply|prescription|resurtido|receta"}
        - {name: records, weight: 3.0, pattern: "\\brecords?\\b|\\bfax|expediente|discharge papers"}
        - {name: referral, weight: 3.0, pattern: "referral"}
        - {name: forms, weight: 2.5, pattern: "\\bforms?\\b|fmla|disability|paperwork"}
        - {name: orders, weight: 2.5, pattern: "\\border\\b|lab says|imaging center says"}
      nurse:
        - {name: symptoms, weight: 2.5, pattern: "fever|cough|rash|headache|sore throat|stuffy|stomach|earache|\\bpain\\b|dizzy|nause|tired|swelling|trouble sleeping|sinus|dolor|fiebre|\\btos\\b|mareado"}
        - {name: wound-care, weight: 3.0, pattern: "incision|stitches|drainage|wound|shower"}
        - {name: vaccines, weight: 3.0, pattern: "vaccin|\\bshot\\b|booster|tetanus"}
        - {name: side-effects, weight: 2.0, pattern: "since starting|is (that|this) normal|keep taking"}
      physician:
        - {name: results, weight: 2.5, pattern: "results?|came back|flagged|numbers|\\ba1c\\b|cholesterol|\\btsh\\b|\\bpsa\\b|creatinine|potassium|hemoglobin|vitamin d|resultados"}
        - {name: treatment, weight: 2.5, pattern: "\\bdose\\b|increase my|stopping|switching from|surgery|opinion|does .* think|treatment|still be on"}
      billing:
        - {name: billing, weight: 3.0, pattern: "\\bbill|charged|charges|invoice|statement|balance|copay|refund|\\bpay\\b|payment|factura|cobr|pagos|saldo|cuenta"}
        - {name: insurance, weight: 2.5, pattern: "insurance|\\bclaim\\b|denied|coverage|\\bcost\\b|marketplace|seguro"}

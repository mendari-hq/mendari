# The launch gates (LP-03): the launch plan's five stage gates as corrected by the vision audit
# (notes/vision-audit.md, "Stage gates at this commit"; each gate's prerequisites in
# notes/vision-audit-evidence.md, "### G1-2" to "### G5-6"), each prerequisite with a probe.
#
#   uv run python scripts/check_gates.py                  # the table; exit 0 whatever is met
#   uv run python scripts/check_gates.py --assert G1-2    # exit 1 unless every G1-2 line is met
#
# A prerequisite is met when every one of its probes is:
#   tests: [node ids]   each test exists and passes; a skipped one is not proof. A test run on
#                       both databases is named without its case, so both count: its Postgres
#                       case needs MENDARI_TEST_DATABASE_URL (CI's report has it; a local run
#                       without Mendari's Postgres shows the line not met)
#   file: path          the file exists in the repository
#   setting: {file, key, equals}
#                       a tracked YAML, JSON or TOML file holds that value (key: a dotted path,
#                       list positions as numbers)
#   attested: {what, by, date}
#                       the owner writes their name (by) and the date (YYYY-MM-DD) once it is
#                       true. Only for an owner prerequisite, and only the owner fills it in: a
#                       build session never does. With `digests`, it is bound to the packs: the
#                       owner lists every pack under packs/ with the digest attested
#                       (`mendari validate` prints it), and it is void once one changes.
#   setting values are compared with their type: quote yes, no, on, off and numbers meant as text.
#   pending: text       not met: names the prompt (or owner step) that adds the probe
# Owner prerequisites always carry an attestation; build prerequisites never do. When a prompt
# lands, it replaces its `pending` probe here with the tests its acceptance created.

gates:
  - id: G1-2
    name: "Stage 1 to 2: design partners"
    prerequisites:
      - id: secret-scan
        what: "A1 step 1: the history scan (gitleaks and trufflehog, every ref) into a private report, scheduled in CI with a positive control"
        owner: build
        probes:
          # The one-off scan of every ref (gitleaks and trufflehog) ran on 2026-10-06; its report is
          # the owner's, outside the repository (tasks/todo.md, LP-02).
          - tests:
              - tests/test_workflow_safety.py::test_the_history_is_scanned_for_secrets
              - tests/test_workflow_safety.py::test_every_ref_is_scanned_weekly_with_a_positive_control
              - tests/test_secret_scan.py::test_the_keys_are_made_up_and_planted_where_only_a_full_scan_looks
              - tests/test_secret_scan.py::test_an_ignore_file_fails_the_scan
              - tests/test_secret_scan.py::test_the_positive_control_finds_both_planted_keys
              - tests/test_secret_scan.py::test_a_clean_history_passes_and_a_broken_one_fails
      - id: rotation
        what: "Every secret the scan finds is rotated before a partner gets access (B08)"
        owner: owner
        probes:
          - attested: {what: "the scan's report read; every live secret it found rotated, or none found", by: "", date: ""}
      - id: a4-safety-notices
        what: "A4: the inbox automation gate, one notice on every surface, an acknowledgement, plain-language results, axe checks"
        owner: build
        probes:
          - tests:
              - tests/test_inbox_pack.py::test_without_a_model_screen_nothing_is_automated
              - tests/test_inbox_pack.py::test_the_gate_never_hides_an_emergency
              - tests/test_safety_invariant.py::test_every_maintained_pack_is_checked
              - tests/test_safety_invariant.py::test_no_critical_case_is_automated_by_default
              - tests/test_safety_invariant.py::test_the_check_catches_an_automated_critical_case
              - tests/test_notice.py::test_the_notice_says_what_the_plan_requires
              - tests/test_notice.py::test_every_page_and_the_openapi_description_carry_the_notice
              - tests/test_notice.py::test_every_decision_card_carries_it
              - tests/test_notice.py::test_the_hub_says_the_same_words
              - tests/test_notice.py::test_every_decide_answer_carries_it
              - tests/test_notice.py::test_cds_hooks_carry_it
              - tests/test_notice.py::test_the_acknowledgement_is_required_by_default
              - tests/test_notice.py::test_a_signed_in_person_acknowledges_before_deciding
              - tests/test_notice.py::test_a_new_notice_version_asks_again
              - tests/test_notice.py::test_an_admin_cannot_mint_a_way_around_it
              - tests/test_pack_status.py::test_display_names_are_checked
              - tests/browser/test_notice.py::test_every_view_shows_the_notice
              - tests/browser/test_notice.py::test_an_open_drawer_says_it_too
              - tests/browser/test_notice.py::test_a_signed_in_person_acknowledges_when_the_dashboard_opens
              - tests/browser/test_notice.py::test_the_acknowledgement_passes_axe
              - tests/browser/test_plain_result.py::test_the_result_shows_names_and_no_raw_code
              - tests/browser/test_plain_result.py::test_the_engine_detail_is_in_the_record
              - tests/browser/test_plain_result.py::test_the_result_passes_axe
              - tests/browser/test_accessibility.py::test_every_view_passes_axe
              - tests/browser/test_accessibility.py::test_an_open_drawer_passes_axe
      - id: nda-pilot-agreement
        what: "A mutual NDA and a design-partner pilot agreement, synthetic data only (B07)"
        owner: owner
        probes:
          - attested: {what: "both templates approved by counsel (or: no design partners, waived)", by: "", date: ""}
      - id: patent-decision
        what: "Whether to file a provisional patent, decided with counsel before any public disclosure (B04)"
        owner: owner
        probes:
          - attested: {what: "the decision, and the serial number if filed", by: "", date: ""}
      - id: synthetic-example-label
        what: "Every reference pack labelled a synthetic example on every surface (A2 step 6, B21)"
        owner: build
        probes:
          - tests:
              - tests/test_pack_status.py::test_the_label_says_what_the_plan_requires
              - tests/test_pack_status.py::test_every_reference_pack_says_it_is_a_synthetic_example
              - tests/test_pack_status.py::test_the_line_follows_provenance_and_nothing_else
              - tests/test_pack_status.py::test_the_api_says_it
              - tests/test_pack_status.py::test_cds_hooks_say_it_in_discovery_and_on_every_card
              - tests/test_pack_status.py::test_the_readme_lists_the_reference_packs_as_synthetic_examples
              - tests/test_smart.py::test_a_launch_opens_the_dashboard_page_and_nothing_else

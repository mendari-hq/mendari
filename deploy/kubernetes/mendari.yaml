# Mendari on Kubernetes: the engine behind a Service, and a daily CronJob for retention and
# monitoring. Postgres is yours (a managed database, or your operator of choice).
#
# Create the secret first (never commit it):
#   kubectl create secret generic mendari-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=MENDARI_OIDC_CLIENT_SECRET='...' \
#     --from-literal=MENDARI_PHI_KEY='...' \
#     --from-literal=MENDARI_INPUT_HASH_KEY='...'
# (the two keys differ: each 32 random bytes, base64)
# With Jev (only under an agreement that covers PHI), add --from-literal=JEV_API_KEY='...' and
# set JEV_API_URL and JEV_MODEL below: the reference packs then run Mendari + Jev.
# Set `image:` (twice below) to a release image, e.g. ghcr.io/mendari-hq/mendari-engine:v0.1.0
# (the tag is `v` and the package version; v0.1.0 is the first release),
# or one pack's image (mendari-referral-router). No release is published yet: until then,
# build and push your own (`docker build --build-arg PACK=... .`, see deploy/README.md).
# Deploy by digest, not by tag: `ghcr.io/...:v0.1.0@sha256:<digest>` (find it with
# `docker buildx imagetools inspect <image>:<tag>`), so a re-pushed tag never changes what runs.
# then: kubectl apply -f mendari.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mendari-config
data:
  MENDARI_PUBLIC_URL: https://mendari.example.org
  MENDARI_OIDC_ISSUER: https://login.example.org/realms/clinic
  MENDARI_OIDC_CLIENT_ID: mendari
  MENDARI_OIDC_ROLE_MAP: clinicians=reviewer,informatics=admin,ai-committee=governance
  MENDARI_PHI_MODE: encrypt
  MENDARI_RETENTION_DAYS: "90"
  # The ingress controller's pod network: X-Forwarded-For is trusted only from it, so rate
  # limits on sign-in count per client, not per ingress pod. 10.0.0.0/8 is only an example: set
  # your cluster's pod CIDR (Calico's default is 192.168.0.0/16; on EKS, the VPC's), or every
  # person shares the ingress pods' addresses. Signed in, /api/health must show your browser's
  # own address as `rate_limits.client_ip`, with `x_forwarded_for_used: true`. Limit per
  # address on /auth/ and /smart/ at the ingress too, e.g. with ingress-nginx:
  # nginx.ingress.kubernetes.io/limit-rpm: "120" on an Ingress for those paths.
  FORWARDED_ALLOW_IPS: 10.0.0.0/8
  # Rate limits are on with sign-in. Per-organization daily quotas, off unless set:
  # MENDARI_ORG_DAILY_LIMITS: decisions=5000
  # A daily cap per principal (a person, a key, a client) on the decisions it asks for:
  # MENDARI_PRINCIPAL_DAILY_LIMIT: "1000"
  # Jev (with JEV_API_KEY in mendari-secrets): the inbox, referral and prior-auth packs then run
  # Mendari + Jev, and share the daily Jev budget (default 500 calls):
  # JEV_API_URL: https://...
  # JEV_MODEL: jev-1.13.0
  # MENDARI_JEV_DAILY_LIMIT: "2000"
  # The pack registry under this engine (off unless set; docs/operations/registry.md): served at
  # /registry/v1/... on this database. MENDARI_REGISTRY_SIGNING_KEY goes in mendari-secrets.
  # MENDARI_REGISTRY: "on"
  # MENDARI_REGISTRY_REVIEW_ORG: registry-review
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mendari
  labels: {app: mendari}
spec:
  replicas: 2
  selector:
    matchLabels: {app: mendari}
  template:
    metadata:
      labels: {app: mendari}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: engine
          image: ghcr.io/mendari-hq/mendari-engine:RELEASE
          command: ["sh", "-c", "mendari serve --host 0.0.0.0 --port 8000 --db \"$DATABASE_URL\""]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: mendari-config}
            - secretRef: {name: mendari-secrets}
          # Readiness reads the database (at most once every 5 s per pod, waited for about
          # 3.5 s) and the packs: a pod whose database does not answer leaves the Service until
          # it does. With sign-in on, liveness does no database work, so a database outage
          # never restarts the pods.
          readinessProbe:
            httpGet: {path: /api/health/ready, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: mendari
spec:
  selector: {app: mendari}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mendari-daily
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Never re-run: a re-run would post every organization's alert again (the command line
      # records nothing). A failed job shows; the next day's runs both again.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: jobs
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              image: ghcr.io/mendari-hq/mendari-engine:RELEASE
              command:
                - sh
                - -c
                # All three run; any failing fails the job. `audit checkpoint` exits 1 when the
                # chain does not verify from its last checkpoint. `monitor --each-org` exits 0
                # when every alert was posted, 1 on an error (or alerts with no webhook), 3 when
                # one could not be posted.
                - mendari phi purge --db "$DATABASE_URL"; purged=$?; mendari audit checkpoint --db "$DATABASE_URL"; checked=$?; mendari monitor --db "$DATABASE_URL" --each-org; monitored=$?; [ "$purged" -eq 0 ] && [ "$checked" -eq 0 ] && [ "$monitored" -eq 0 ]
              envFrom:
                - configMapRef: {name: mendari-config}
                - secretRef: {name: mendari-secrets}

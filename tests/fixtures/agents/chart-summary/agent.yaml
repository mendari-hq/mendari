# Synthetic test fixture. Not clinically reviewed. Not for patient care.
#
# `mendari-test/chart-summary`: a small agent that reads a patient's FHIR record, for the tests of
# record reading (wave 6, fixture F3). Its mapping reads a chart as an EHR writes one
# (fhir/mapping.yaml); its records and datasets are made by tests/support/fixture_records.py, and
# its order-sign twin, a vendor-shaped FHIR server, a site code map and an EHR declaration for
# them by tests/support/chart_fixture.py and tests/support/chart_ehr.py.
spec_version: "0.4"
id: mendari-test/chart-summary
version: 1.0.0
name: "Synthetic Chart Summary (test fixture)"
summary: >-
  Synthetic test fixture. Reads a synthetic patient's FHIR record and says when the patient
  should next be seen and whether an anticoagulant is listed. Not clinically reviewed. Not for
  patient care.
publisher:
  name: Mendari tests
  type: community
license: Apache-2.0
# The code systems the inputs, rules and data use (spec §3), which the mapping's `[system=...]`
# predicates and code sets name.
code_systems:
  - url: http://hl7.org/fhir/sid/icd-10-cm
    name: >-
      ICD-10-CM (U.S. National Center for Health Statistics: free to use; adapted from the World
      Health Organization's copyrighted ICD-10, with WHO's authorization, for U.S. government
      purposes)
  - url: http://www.nlm.nih.gov/research/umls/rxnorm
    name: >-
      RxNorm (U.S. National Library of Medicine: its codes and normalized names are in the
      public domain; NLM's acknowledgement is in NOTICE)

risk:
  level: 1
  category: clinical information
  rationale: >-
    Test fixture. It summarizes a synthetic chart for a person to read; a chart that may need a
    visit soon always goes to a person.

card:
  provenance: synthetic
  intended_use: >-
    Tests of the engine's record reading. Synthetic test fixture: not clinically reviewed and
    not for patient care.
  intended_users:
    - Mendari developers
  patient_population: >-
    Synthetic adult patients made by tests/support/fixture_records.py, coded in ICD-10-CM and
    RxNorm.
  out_of_scope:
    - Any patient care. The watch list and the follow-up rule are made up for test data.
  known_failure_modes:
    - The `rules` variant reads only the clinic notes, so a chart whose notes say nothing about
      follow-up reads as a routine one, for a person to check; some notes on the watch list say
      it in words the rules miss.
    - The canned `agent` answers read the codes of the agent's code sets, so a condition or a
      drug coded only in a site's own codes is not found until the site's code map translates it.
  evidence:
    - title: Synthetic data only
      note: Generated by tests/support/fixture_records.py; labels come from the generator's facts.

inputs:
  schema: schemas/input.schema.json
  fhir: fhir/mapping.yaml

questions:
  follow_up:
    display: Follow-up
    instructions: When should the patient next be seen, from the conditions on the chart?
    criteria:
      none: No condition on the chart calls for a follow-up visit.
      routine: A long-term condition calls for a routine follow-up visit.
      soon: A condition on the synthetic watch list calls for a visit soon.
    names:
      none: No follow-up
      routine: Routine follow-up
      soon: Follow-up soon
  on_anticoagulant:
    type: boolean
    display: Anticoagulant listed
    instructions: Does the medication list hold an anticoagulant?
    criteria:
      "yes": An anticoagulant (warfarin, apixaban, rivaroxaban or edoxaban) is on the medication list.
      "no": No anticoagulant is listed; an antiplatelet drug such as aspirin is not one.

providers:
  reader:
    answers: [follow_up, on_anticoagulant]
    use: agent
    variants:
      agent:
        type: agent
        service_id: chart-summary
        state_fields: [patient.age, conditions, medications]
        # Used offline while MENDARI_AGENT_URL is unset.
        mock_file: fixtures/mock.yaml
      rules:
        type: rules
        config: logic/rules.yaml

policy:
  primary: follow_up
  thresholds:
    auto: 0.90
    review: 0.50
  labels:
    soon:
      allow_auto: false
  rules:
    - name: possible-follow-up-soon
      when:
        question: follow_up
        labels: [soon]
        min_probability: 0.3
      outcome: HUMAN_REVIEW
      priority: urgent
      reason: A condition on the chart may call for a visit soon.
  fallback: A clinician reads the chart.

evaluation:
  # Synthetic: written by tests/support/fixture_records.py (`--check` holds them to it).
  datasets:
    examples: data/examples.jsonl
    test: data/test.jsonl
  benchmark_dataset: test
  critical:
    - {question: follow_up, label: soon}

tests: tests/cases.yaml

audit:
  store_input: full

# A CDS Hooks 2.0 service (`/cds-services/mendari-test.chart-summary`): when a chart is opened,
# the EHR sends the patient's record as prefetch, or the engine reads it from the EHR's server.
cds_hooks:
  hook: patient-view
  title: Synthetic Chart Summary
  description: >-
    Synthetic test fixture. When a chart is opened, says when the patient should next be seen
    and whether an anticoagulant is listed. Not clinically reviewed.
  prefetch:
    patient: Patient/{{context.patientId}}
    conditions: Condition?patient={{context.patientId}}
    medications: MedicationStatement?patient={{context.patientId}}
    medication_requests: MedicationRequest?patient={{context.patientId}}&_include=MedicationRequest:medication
    notes: DocumentReference?patient={{context.patientId}}&category=clinical-note
  card:
    summaries:
      soon: "Synthetic chart summary: see the patient soon; anticoagulant listed: {on_anticoagulant}"
      routine: "Synthetic chart summary: routine follow-up; anticoagulant listed: {on_anticoagulant}"
      none: "Synthetic chart summary: no follow-up suggested"
      refused: "Chart not summarized: Mendari refused the record as invalid input"
    indicators:
      soon: warning
      routine: info
      none: info
      refused: warning
    show: [soon, routine, refused]
    suggestion: Create a follow-up task

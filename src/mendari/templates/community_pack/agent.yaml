# {{name}}: a community agent, written in YAML. Change anything; `mendari validate`
# checks it, and `mendari community-check` runs every check CI runs on a community pack.
# The authoring guide walks through every section:
# https://github.com/mendari-hq/mendari/blob/main/docs/guides/authoring-an-agent.md
#
# A community pack lives in community-packs/<name>/ with the id community/<name>. It
# recommends and never automates (a person confirms every decision), decides with local
# providers, keeps only a hash of its inputs, and is at most risk level 1.
spec_version: "0.2"
id: {{id}}
version: 0.1.0
name: {{name}}
summary: >-
  Routes a patient portal message: a medication refill, an appointment request, or something
  else for the front desk. Messages that describe same-day symptoms go to a nurse.
publisher:
  name: {{publisher}}
  type: community
license: Apache-2.0  # every community pack is Apache-2.0

risk:
  # 0 administrative, 1 clinical information; a community pack is at most 1. Choosing which
  # team reads a message first, with anything possibly urgent sent to a person, is
  # administrative (0), as for the demo agent; reading clinical facts to decide is 1
  # (docs/guides/contributing-an-agent.md, "Risk level").
  level: 0
  category: administrative
  rationale: >-
    The decision is which queue reads a message first. The pack never replies to patients or
    makes a clinical judgement, and a message that may describe same-day symptoms always goes to
    a nurse for review.

card:
  # What the pack's criteria, examples and data were built from: synthetic, de_identified or
  # site_records. Every surface derives the pack's status line from it.
  provenance: synthetic
  intended_use: >-
    Route portal messages to the refill queue, the scheduling queue or the front desk, and
    send messages describing same-day symptoms to a nurse.
  intended_users:
    - Front-desk and nursing staff
  patient_population: Adult patients who write to the clinic's portal, in English.
  out_of_scope:
    - Deciding whether a refill is appropriate; a clinician decides.
  known_failure_modes:
    - Keyword rules miss phrasings they don't list. Evaluate on your own messages before use.

inputs:
  schema: schemas/input.schema.json

questions:
  # Criteria are written for people: they are the pack's documentation and a model's
  # instructions.
  request:
    instructions: What does the patient ask for?
    criteria:
      refill: A refill or renewal of a medication they already take.
      appointment: To book, move or cancel a visit.
      other: Anything else, or more than one thing.
  urgent_symptoms:
    type: boolean
    instructions: Does the message describe symptoms that need attention today?
    criteria:
      "yes": For example chest pain, trouble breathing, or signs of a stroke.
      "no": No such symptoms.

providers:
  reader:
    answers: [request, urgent_symptoms]
    use: rules  # the default is local: rules, criteria, dosing or naive_bayes
    variants:
      rules:
        type: rules
        config: logic/rules.yaml

policy:
  primary: request
  thresholds:
    auto: 0.90    # a community pack never automates: above this, a person still confirms
    review: 0.50  # below this, no suggestion
  labels:
    other:
      allow_auto: false
  rules:
    - name: same-day-symptoms
      when:
        question: urgent_symptoms
        labels: ["yes"]
        min_probability: 0.3
      outcome: HUMAN_REVIEW
      priority: urgent
      reason: The message may describe symptoms that need a nurse today.
  fallback: The front desk reads the message.

evaluation:
  datasets:
    examples: data/examples.jsonl
  # CI evaluates the pack on this dataset again and compares the result with the benchmark.
  # Regenerate both after any change:
  #   mendari eval <dir> --dataset examples --baseline none --out <dir>/evals/benchmark.json
  #   mendari card <dir> --write
  benchmark_dataset: examples
  benchmark: evals/benchmark.json
  # Labels whose cases must never be missed: at least one test case and five benchmark cases
  # each, found at least 90% of the time.
  critical:
    - {question: urgent_symptoms, label: "yes"}
  degradation_tolerance: 0.03  # at most 0.05 for a community pack

audit:
  store_input: hash  # keep only a hash of each input, never the text

tests: tests/cases.yaml

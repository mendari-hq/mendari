name: Propose a pack
description: A community pack you would like to contribute. The owner answers before you build it.
labels: [pack, idea]
body:
  - type: markdown
    attributes:
      value: >-
        A community pack lives in `community-packs/<name>/` with the id `community/<name>`, is at
        most risk level 1, and recommends without automating (see
        docs/guides/contributing-an-agent.md). Never paste real patient data: describe cases in
        your own words.
  - type: input
    id: name
    attributes:
      label: Pack name
      description: Lowercase letters, digits and dashes. The id will be `community/<name>`.
      placeholder: refill-router
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What it decides, and the decision it helps with today
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Who would use it, and in what setting
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Intended risk level
      description: The table in the guide's "Risk level" section, with the reference packs as precedents.
      options:
        - "0: administrative (who or which queue sees something first)"
        - "1: clinical information (reading clinical facts to extract, check or route them)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: How you will make its synthetic data
      description: By hand, or from templates (scripts/synthetic_cases.py). Never real patient data.
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Clinical review and sources
      description: >-
        Who could review the content (a clinician other than you), and where the criteria come
        from. Nothing copied from proprietary criteria or copyrighted instruments.

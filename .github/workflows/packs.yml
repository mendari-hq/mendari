name: packs

# The contribution flow for packs: every pack a pull request changes is validated, tested,
# evaluated on its benchmark dataset and given a card. Its metrics are compared with the
# benchmark on the base branch, and a regression in a critical metric fails (the eval gate,
# scripts/pack_gate.py). The job summary shows the comparison; the cards are an artifact.
on:
  pull_request:
    paths: ["packs/**"]

permissions:
  contents: read

jobs:
  changed-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.12.22"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Validate, test, evaluate and card each changed pack; gate on the base benchmark
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/packs
          failed=0
          for name in $(git diff --name-only "$BASE"...HEAD -- packs/ | cut -d/ -f2 | sort -u); do
            dir="packs/$name"
            if [ ! -f "$dir/pack.yaml" ]; then echo "$dir was removed" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            uv run mendari validate "$dir"
            uv run mendari test "$dir"
            uv run mendari card "$dir" > "/tmp/packs/$name-DECISION_CARD.md"
            dataset=$(uv run python -c "from mendari.core.registry import resolve_pack; print(resolve_pack('$dir').manifest.evaluation.benchmark_dataset or '')")
            if [ -z "$dataset" ]; then echo "### $name: no benchmark dataset to evaluate" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            uv run mendari eval "$dir" --dataset "$dataset" --baseline none --out "/tmp/packs/$name.json"
            main_args=()
            benchmark=$(uv run python -c "from mendari.core.registry import resolve_pack; print(resolve_pack('$dir').manifest.evaluation.benchmark or '')")
            if [ -n "$benchmark" ] && git show "$BASE:$dir/$benchmark" > "/tmp/packs/$name-main.json" 2>/dev/null; then
              main_args=(--main "/tmp/packs/$name-main.json")
            fi
            uv run python scripts/pack_gate.py "$dir" --report "/tmp/packs/$name.json" "${main_args[@]}" >> "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit $failed
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: decision-cards
          path: /tmp/packs/*-DECISION_CARD.md
          if-no-files-found: ignore

# SPDX-License-Identifier: Apache-2.0
# The committee packet's crosswalk (core/packet.py reads it; nothing here is prose in code).
#
# What this file holds:
#   frameworks  four published frameworks, each with its sources (title, address, the day it was
#               read) and its parts, named as the source names them;
#   rows        for each section of the packet, the parts it holds information for, and what of
#               each part it does and does not hold;
#   items       what a framework asks for that the packet may not have: the "Not stated" appendix
#               lists every one of these that neither the publisher nor the site has provided.
#
# Rules for whoever edits it:
#   - Every part and row is `confirmed` only when it was read in a primary source (the
#     regulation's text, the publisher's own document) on `checked_on`. Anything else is
#     `to_verify`, and the packet prints it that way.
#   - A row says what the section holds, never that anything complies. The frameworks' own texts
#     govern.
#   - When a source changes, change the part, its `checked_on`, and the rows that name it.
#     tests/test_packet.py holds every row to a section and a part that exist.
format: mendari.crosswalk/1
checked_on: "2026-11-23"

disclaimer: >-
  This crosswalk is a reading aid prepared by the software. It shows where this packet holds
  information related to parts of four published frameworks. It is not a certification, an
  attestation of compliance or legal advice, and it does not state that the agent, its
  publisher, this software or your organization meets, complies with or is certified against
  any of them. The frameworks' own texts govern.

frameworks:
  - id: chai-amc
    name: CHAI Applied Model Card
    short: CHAI model card
    publisher: Coalition for Health AI (CHAI)
    edition: Draft release; template v0.1 (November 2024), schema v0.2 (October 2025)
    applies_to: >-
      A voluntary template that the developer of a health AI solution fills in. A site can ask a
      publisher for one.
    status: confirmed
    sources:
      - id: template
        title: CHAI Applied Model Card, template v0.1
        url: https://mc.chai.org/v0.1/template.pdf
        checked_on: "2026-11-23"
      - id: schema
        title: CHAI Applied Model Card, schema v0.2 (XML Schema Definition)
        url: https://mc.chai.org/v0.2/schema.xsd
        checked_on: "2026-11-23"
      - id: repository
        title: CHAI Applied Model Card repository (template, schema, documentation, examples)
        url: https://github.com/coalition-for-health-ai/mc-schema
        checked_on: "2026-11-23"
    notes:
      - text: >-
          CHAI describes the card as a draft release: its repository and its registry page said
          so on the day checked, and the schema's own notes say it may change.
        status: confirmed
    parts:
      - id: chai-amc.header
        ref: Header
        title: >-
          Name; Developer; Inquiries or to report an issue; Release Stage; Release Date;
          Version; Global Availability; Regulatory Approval
        source: template
        status: confirmed
      - id: chai-amc.summary
        ref: Summary
        title: Summary; Keywords
        source: template
        status: confirmed
      - id: chai-amc.uses
        ref: Uses and Directions
        title: >-
          Intended use and workflow; Primary intended users; How to use; Targeted patient
          population; Cautioned out-of-scope settings and use cases
        source: template
        status: confirmed
      - id: chai-amc.warnings
        ref: Warnings
        title: >-
          Known risks and limitations; Known biases or ethical considerations; Clinical risk
          level
        source: template
        status: confirmed
      - id: chai-amc.facts
        ref: "Trust Ingredients: AI System Facts"
        title: >-
          Outcome(s) and output(s); Model type; Foundation models used in application; Input
          data source; Output/Input data type; Development data characterization; Bias
          mitigation approaches; Ongoing Maintenance; Security and compliance environment
          practices or accreditations; Transparency, Intelligibility, and Accountability
          mechanisms
        source: template
        status: confirmed
      - id: chai-amc.transparency
        ref: "Trust Ingredients: Transparency Information"
        title: >-
          Funding source of the technical implementation; 3rd Party Information; Stakeholders
          consulted during design of intervention
        source: template
        status: confirmed
      - id: chai-amc.metrics
        ref: Key Metrics
        title: >-
          Usefulness, Usability, and Efficacy; Fairness and Equity; Safety and Reliability
          (each: goal of metric, result, interpretation, test type, testing data description,
          validation process and justification)
        source: template
        status: confirmed
      - id: chai-amc.resources
        ref: Resources
        title: >-
          Evaluation References; Clinical Trial; Peer Reviewed Publication(s); Reimbursement
          Status; Patient consent or disclosure required or suggested
        source: template
        status: confirmed

  - id: hti-1
    name: >-
      ONC HTI-1 source attributes for predictive decision support interventions,
      45 CFR 170.315(b)(11)
    short: HTI-1 source attributes
    publisher: U.S. Department of Health and Human Services, ASTP/ONC
    edition: >-
      45 CFR 170.315(b)(11)(iv)(B), as the eCFR gave it up to date on 20 November 2026
    applies_to: >-
      A certification criterion for developers of certified health IT, about the predictive
      interventions they supply with their Health IT Module. It places no duty on a hospital,
      on an agent's publisher or on this software. The packet uses the list as a checklist of
      what such a description holds.
    status: confirmed
    sources:
      - id: ecfr
        title: >-
          45 CFR 170.315(b)(11), Decision support interventions (Electronic Code of Federal
          Regulations)
        url: https://www.ecfr.gov/current/title-45/section-170.315
        checked_on: "2026-11-23"
      - id: final-rule-2026
        title: >-
          Health Data, Technology, and Interoperability: ONC Deregulatory Actions To Unleash
          Prosperity; final rule, 91 FR 67916 (28 October 2026)
        url: https://www.federalregister.gov/documents/2026/10/28/2026-21943/health-data-technology-and-interoperability-onc-deregulatory-actions-to-unleash-prosperity
        checked_on: "2026-11-23"
    notes:
      - text: >-
          The list is leaving the regulation. A final rule published on 28 October 2026
          (91 FR 67916), effective 28 December 2026, removes paragraphs (b)(11)(iv) through
          (vi): the source attributes, access to them and their modification, and
          intervention risk management. On the day checked they were still in the eCFR. After
          that date the list is a description of what the rule used to ask, not a requirement
          on anyone.
        status: confirmed
      - text: >-
          The rule has a second, shorter list of 13 source attributes for evidence-based
          interventions, (b)(11)(iv)(A). The packet maps to the list for predictive
          interventions only. Which list would have applied to a given agent is a legal
          question this software does not answer.
        status: to_verify
    parts:
      - id: hti-1.b1
        ref: (b)(11)(iv)(B)(1)
        title: >-
          Details and output of the intervention: name and contact information for the
          developer; funding source; description of the value the intervention produces as an
          output; whether the output is a prediction, classification, recommendation,
          evaluation, analysis or other type
        source: ecfr
        status: confirmed
      - id: hti-1.b2
        ref: (b)(11)(iv)(B)(2)
        title: >-
          Purpose of the intervention: intended use; intended patient population(s); intended
          user(s); intended decision-making role (for example informs, augments, replaces
          clinical management)
        source: ecfr
        status: confirmed
      - id: hti-1.b3
        ref: (b)(11)(iv)(B)(3)
        title: >-
          Cautioned out-of-scope use of the intervention: tasks, situations or populations
          where a user is cautioned against applying it; known risks, inappropriate settings,
          inappropriate uses, or known limitations
        source: ecfr
        status: confirmed
      - id: hti-1.b4
        ref: (b)(11)(iv)(B)(4)
        title: >-
          Intervention development details and input features: exclusion and inclusion
          criteria that influenced the training data set; use of race, ethnicity, language,
          sexual orientation, gender identity, sex, date of birth, social determinants of
          health and health status assessments as input features; demographic
          representativeness; relevance of the training data to the intended deployed setting
        source: ecfr
        status: confirmed
      - id: hti-1.b5
        ref: (b)(11)(iv)(B)(5)
        title: >-
          Process used to ensure fairness in development of the intervention: the approach
          taken to ensure the output is fair; approaches to manage, reduce or eliminate bias
        source: ecfr
        status: confirmed
      - id: hti-1.b6
        ref: (b)(11)(iv)(B)(6)
        title: >-
          External validation process: the data source, clinical setting or environment where
          validity and fairness were assessed, other than the source of training and testing
          data; the party that conducted the external testing; demographic representativeness
          of the external data; the external validation process
        source: ecfr
        status: confirmed
      - id: hti-1.b7
        ref: (b)(11)(iv)(B)(7)
        title: >-
          Quantitative measures of performance: validity and fairness in test data from the
          same source as the initial training data; validity and fairness in data external to
          it; references to evaluations of the intervention's use on outcomes
        source: ecfr
        status: confirmed
      - id: hti-1.b8
        ref: (b)(11)(iv)(B)(8)
        title: >-
          Ongoing maintenance of intervention implementation and use: the process and
          frequency by which validity is monitored over time; validity in local data; the
          process and frequency by which fairness is monitored over time; fairness in local
          data
        source: ecfr
        status: confirmed
      - id: hti-1.b9
        ref: (b)(11)(iv)(B)(9)
        title: >-
          Update and continued validation or fairness assessment schedule: the process and
          frequency by which the intervention is updated; the frequency by which its
          performance is corrected when risks related to validity and fairness are identified
        source: ecfr
        status: confirmed
      - id: hti-1.vi
        ref: (b)(11)(vi)
        title: >-
          Intervention risk management: risk analysis (validity, reliability, robustness,
          fairness, intelligibility, safety, security, privacy); risk mitigation; governance,
          including how data are acquired, managed and used
        source: ecfr
        status: confirmed

  - id: nist-ai-rmf
    name: NIST AI Risk Management Framework (AI RMF 1.0)
    short: NIST AI RMF
    publisher: National Institute of Standards and Technology (NIST)
    edition: NIST AI 100-1, January 2023
    applies_to: >-
      A voluntary framework for any organization that designs, develops, deploys or uses AI
      systems. Its four functions are GOVERN, MAP, MEASURE and MANAGE, each divided into
      numbered categories.
    status: confirmed
    sources:
      - id: publication
        title: Artificial Intelligence Risk Management Framework (AI RMF 1.0), NIST AI 100-1
        url: https://doi.org/10.6028/NIST.AI.100-1
        checked_on: "2026-11-23"
      - id: core
        title: AI RMF Core (NIST Trustworthy and Responsible AI Resource Center)
        url: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
        checked_on: "2026-11-23"
    notes:
      - text: >-
          The packet maps to the framework's categories, not to their subcategories. NIST said
          on the day checked that AI RMF 1.0 is being revised; no revised version was
          published then.
        status: confirmed
    parts:
      - id: nist.govern-1
        ref: GOVERN 1
        title: >-
          Policies, processes, procedures, and practices across the organization related to
          the mapping, measuring, and managing of AI risks are in place, transparent, and
          implemented effectively.
        source: core
        status: confirmed
      - id: nist.govern-2
        ref: GOVERN 2
        title: >-
          Accountability structures are in place so that the appropriate teams and individuals
          are empowered, responsible, and trained for mapping, measuring, and managing AI
          risks.
        source: core
        status: confirmed
      - id: nist.govern-3
        ref: GOVERN 3
        title: >-
          Workforce diversity, equity, inclusion, and accessibility processes are prioritized
          in the mapping, measuring, and managing of AI risks throughout the lifecycle.
        source: core
        status: confirmed
      - id: nist.govern-4
        ref: GOVERN 4
        title: >-
          Organizational teams are committed to a culture that considers and communicates AI
          risk.
        source: core
        status: confirmed
      - id: nist.govern-5
        ref: GOVERN 5
        title: Processes are in place for robust engagement with relevant AI actors.
        source: core
        status: confirmed
      - id: nist.govern-6
        ref: GOVERN 6
        title: >-
          Policies and procedures are in place to address AI risks and benefits arising from
          third-party software and data and other supply chain issues.
        source: core
        status: confirmed
      - id: nist.map-1
        ref: MAP 1
        title: Context is established and understood.
        source: core
        status: confirmed
      - id: nist.map-2
        ref: MAP 2
        title: Categorization of the AI system is performed.
        source: core
        status: confirmed
      - id: nist.map-3
        ref: MAP 3
        title: >-
          AI capabilities, targeted usage, goals, and expected benefits and costs compared
          with appropriate benchmarks are understood.
        source: core
        status: confirmed
      - id: nist.map-4
        ref: MAP 4
        title: >-
          Risks and benefits are mapped for all components of the AI system including
          third-party software and data.
        source: core
        status: confirmed
      - id: nist.map-5
        ref: MAP 5
        title: >-
          Impacts to individuals, groups, communities, organizations, and society are
          characterized.
        source: core
        status: confirmed
      - id: nist.measure-1
        ref: MEASURE 1
        title: Appropriate methods and metrics are identified and applied.
        source: core
        status: confirmed
      - id: nist.measure-2
        ref: MEASURE 2
        title: AI systems are evaluated for trustworthy characteristics.
        source: core
        status: confirmed
      - id: nist.measure-3
        ref: MEASURE 3
        title: Mechanisms for tracking identified AI risks over time are in place.
        source: core
        status: confirmed
      - id: nist.measure-4
        ref: MEASURE 4
        title: Feedback about efficacy of measurement is gathered and assessed.
        source: core
        status: confirmed
      - id: nist.manage-1
        ref: MANAGE 1
        title: >-
          AI risks based on assessments and other analytical output from the MAP and MEASURE
          functions are prioritized, responded to, and managed.
        source: core
        status: confirmed
      - id: nist.manage-2
        ref: MANAGE 2
        title: >-
          Strategies to maximize AI benefits and minimize negative impacts are planned,
          prepared, implemented, documented, and informed by input from relevant AI actors.
        source: core
        status: confirmed
      - id: nist.manage-3
        ref: MANAGE 3
        title: AI risks and benefits from third-party entities are managed.
        source: core
        status: confirmed
      - id: nist.manage-4
        ref: MANAGE 4
        title: >-
          Risk treatments, including response and recovery, and communication plans for the
          identified and measured AI risks are documented and monitored regularly.
        source: core
        status: confirmed

  - id: ruaih
    name: >-
      Joint Commission and Coalition for Health AI (CHAI) Guidance on The Responsible Use of
      AI in Healthcare (RUAIH)
    short: Joint Commission and CHAI guidance
    publisher: Joint Commission and Coalition for Health AI (CHAI)
    edition: Released 17 September 2025; the copy read is dated 10 November 2025
    applies_to: >-
      Voluntary guidance for healthcare organizations on how they deploy and use AI tools. It
      is about what the organization does, not about how a tool is built: most of what it asks
      for is the site's own to state.
    status: confirmed
    sources:
      - id: guidance
        title: >-
          Joint Commission and Coalition for Health AI (CHAI) Guidance on The Responsible Use
          of AI in Healthcare (RUAIH)
        url: https://digitalassets.jointcommission.org/api/public/content/dcfcf4f1a0cc45cdb526b3cb034c68c2
        checked_on: "2026-11-23"
      - id: release
        title: >-
          Joint Commission and Coalition for Health AI (CHAI) Release Initial Guidance to
          Support Responsible AI Adoption Across U.S. Health Systems (17 September 2025)
        url: https://www.chai.org/news/joint-commission-and-coalition-for-health-ai-chai-release-initial-guidance
        checked_on: "2026-11-23"
      - id: playbooks
        title: CHAI AI Governance work group, governance playbooks
        url: https://www.chai.org/workgroup/cross-cutting/ai-governance
        checked_on: "2026-11-23"
    notes:
      - text: >-
          The guidance names seven elements. CHAI published governance playbooks that build on
          it on 27 May 2026; the packet does not map to the playbooks.
        status: confirmed
      - text: >-
          The guidance says a voluntary Joint Commission certification will follow the

name: secrets

# Weekly and by hand (LP-02), every ref: each branch and tag (as the pull-request scan in ci.yml
# does) and the head of every pull request (refs/pull/N/head, forks and deleted branches
# included), which that scan never reaches and a design partner's clone would carry, scanned by
# scripts/secret_scan.sh, merge resolutions included. Then the positive control: keys planted where
# only a full scan looks must be found, or a clean result proves nothing.
# A finding is a secret until shown otherwise: revoke and rotate it first. A pull request's head
# stays on GitHub after the pull request closes and its owner cannot remove it: rotate, then ask
# GitHub Support to purge the ref; a value that is not a secret is allowed in .gitleaks.toml by
# path, rule and match (condition AND), with the reason.
# Once the repository is public, GitHub turns a schedule off after 60 days with no activity in it:
# owner steps, monthly, `gh run list --workflow secrets.yml --limit 1`.
on:
  schedule:
    - cron: "17 9 * * 1"  # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  every-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # every branch and tag
      - name: Fetch the head of every pull request (the read-only token, never stored)
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --quiet --no-tags origin '+refs/pull/*/head:refs/pull/*/head'
          heads=$(git for-each-ref refs/pull | wc -l)
          echo "refs scanned: $(git for-each-ref | wc -l), pull requests' heads among them: ${heads}"
          test "$heads" -gt 0 || { echo "::error::no pull request's head was fetched"; exit 1; }
      - name: gitleaks over every ref
        run: sh scripts/secret_scan.sh
      - name: The positive control finds the planted keys
        run: sh scripts/secret_scan_control.sh

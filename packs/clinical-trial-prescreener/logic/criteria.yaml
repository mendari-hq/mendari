# Structured eligibility criteria for the synthetic GLYCEMIA-2 study, computed in code by the
# `criteria` provider: dates, units and numbers are never left to a model.
#
# Each question's checks are tried in order; the first that applies decides, and `default`
# answers when none does. Missing, stale or unrecognised data gives `unknown`, never a guess.
# A deploying site adds its own codes, units and medication names here (see the Decision Card).
# Conditions are matched by ICD-10-CM, and by the fictional codes (FC101 to FC203, in
# https://mendari.co/fhir/CodeSystem/fictional-conditions; not SNOMED CT) that the bundled
# local-site example codes them in: a site that codes in SNOMED CT adds its own codes here.
as_of: as_of

questions:
  age_18_75:
    checks:
      - number: {field: patient.age, min: 18, max: 75}

  t2d_diagnosis:
    checks:
      - condition: {codes: ["E11*", "FC101"], then: "yes"}
      - condition: {codes: ["E10*", "FC102"], then: "no"}

  hba1c_in_range:
    checks:
      - observation:
          codes: ["4548-4"]  # Hemoglobin A1c/Hemoglobin.total in Blood
          within_days: 90
          min: 7.0
          max: 10.5
          unit: "%"
          convert:
            "mmol/mol": {multiply: 0.0915, add: 2.15}  # IFCC -> NGSP (the NGSP master equation)

  stable_metformin:
    checks:
      - medication:
          names: ["metformin"]
          min_days: 90
          then: "yes"
    default: "no"

  egfr_30_or_more:
    checks:
      - observation:
          codes: ["33914-3", "62238-1", "98979-8"]  # MDRD, CKD-EPI 2009, CKD-EPI 2021
          within_days: 365
          min: 30
          unit: "mL/min/1.73m2"

  no_insulin:
    checks:
      - medication:
          names: ["insulin"]
          within_days: 90
          then: "no"
    default: "yes"

  no_recent_cv_event:
    checks:
      - condition:
          # ICD-10-CM: acute MI, subsequent MI, cerebral infarction. The local-site example's
          # fictional codes (not SNOMED CT): myocardial infarction, stroke, cerebral infarction.
          codes: ["I21*", "I22*", "I63*", "FC201", "FC202", "FC203"]
          within_days: 180
          then: "no"
    default: "yes"

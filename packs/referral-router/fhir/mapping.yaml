# FHIR R4 -> pack input: one referral (ServiceRequest) and the patient's record. The as-of date
# is the day of the request. Spec 0.3 (docs/spec/decision-pack-0.3.md): the referral and the
# documents the checklist looks for are read through the pack's own code sets, wherever their
# coding sits, so a site's own codes may be translated into them by its site code map
# (MENDARI_SITE_CODES), which changes no pack file; a decision read through a translation is
# never automated.
fhir_version: R4
focus: ServiceRequest
# Which ServiceRequests are referrals (lab and imaging orders are ServiceRequests too): those
# with a category coding of the code set `referral_category`, the fictional referral code of
# the synthetic examples (https://mendari.co/fhir/CodeSystem/fictional-referrals; not SNOMED
# CT), wherever it sits among the categories' codings. A site whose EHR marks a referral with
# its own code translates that code into FR101 in its site code map: until it does, no real
# referral matches.
focus_where:
  path: category.coding
  code_set: referral_category

code_sets:
  referral_category:
    system: https://mendari.co/fhir/CodeSystem/fictional-referrals
    codes: ["FR101"]
  # The document and report codes logic/checklist.yaml looks for (LOINC): a site's own codes
  # for the same documents translate into these.
  checklist_documents:
    system: http://loinc.org
    codes: ["11506-3", "11488-4", "11524-6"]  # progress note, consult note, ECG
  checklist_reports:
    system: http://loinc.org
    codes: ["11524-6", "18748-4", "18726-0"]  # ECG, diagnostic imaging study, radiology studies

resources:
  ServiceRequest:
    required: true
  Patient:
    required: false

fields:
  referral.reason:
    # reasonCode text, then any note; joined into one text
    path: ServiceRequest.reasonCode.text
    transform: join
  referral.priority:
    path: ServiceRequest.priority
  patient.age:
    path: Patient.birthDate
    transform: age_years
  patient.sex:
    path: Patient.gender
    map: {female: female, male: male, other: other, unknown: unknown}

lists:
  documents:
    resource: DocumentReference
    fields:
      code:
        path: type.coding
        code_set: checklist_documents
      name:
        path: type.text
      date:
        path: date
  reports:
    resource: DiagnosticReport
    fields:
      code:
        path: code.coding
        code_set: checklist_reports
      name:
        path: code.text
      date:
        path: effectiveDateTime
  labs:
    # Any laboratory result counts (logic/checklist.yaml, `recent_labs`), so its code is read as
    # the EHR gives it first.
    resource: Observation
    fields:
      code:
        path: code.coding[0].code
      name:
        path: code.text
      date:
        path: effectiveDateTime

# Decision -> FHIR Task in the suggested specialty's referral queue.
task:
  code_text: Handle specialty referral
  performer_system: https://mendari.co/fhir/CodeSystem/referral-queue
  performer: "{specialty}"
  description: "Referral to {specialty}: {recommendation}"

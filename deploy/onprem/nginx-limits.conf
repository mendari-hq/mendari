# An example TLS reverse proxy in front of Mendari's engine, with per-address limits on the
# routes anyone can reach signed out (the edge layer of ADR-0005; Mendari limits per caller
# itself, in the database). Adapt names, certificates and the upstream to your site.
#
# Per address only on /auth/ (sign-in, its callback, logout, the token endpoint) and /smart/
# (the EHR launch): every clinician and EHR in a hospital may share one address, so /api, /fhir
# and /cds-services are left to Mendari's own per-caller limits.
#
# Give the engine the real client address: this proxy overwrites X-Forwarded-For with it, and
# the engine trusts that header only from the proxies in FORWARDED_ALLOW_IPS (set it in .env to
# the address this proxy connects from: 127.0.0.1 on the same host, or Docker's bridge gateway
# when the engine runs in compose). /api/health, signed in, shows `client_ip_source`.

limit_req_zone $binary_remote_addr zone=mendari_signin:10m rate=2r/s;  # 120 a minute
limit_req_status 429;

upstream mendari_engine {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl;
    server_name mendari.example.org;
    ssl_certificate     /etc/ssl/mendari/fullchain.pem;
    ssl_certificate_key /etc/ssl/mendari/privkey.pem;

    client_max_body_size 4m;  # the engine's MENDARI_MAX_BODY_BYTES (4 MiB unless set)

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwritten, never appended
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/ {
        limit_req zone=mendari_signin burst=60 nodelay;
        proxy_pass http://mendari_engine;
    }

    location /smart/ {
        limit_req zone=mendari_signin burst=60 nodelay;
        proxy_pass http://mendari_engine;
    }

    location / {
        proxy_pass http://mendari_engine;
    }
}

# Deterministic emergency screen (answers `urgency`).
#
# Deliberately sensitive: a false alarm costs a nurse a minute; a miss can cost far more.
# Every pattern is named so the audit record says exactly why a message escalated.
# Scores: routine starts at `default_score`; each matching pattern adds its weight to `urgent`;
# softmax(scores) gives P(urgent). The policy escalates at P(urgent) >= 0.35, i.e. any single
# pattern with weight >= ~1.4 above the routine score, or combinations of weaker ones.
#
# Keyword rules cannot anticipate every phrasing (measured on data/red_flags*.jsonl). In
# deployments, run this screen together with Jev (`safety_screen=rules_and_jev`): either one
# flagging an emergency escalates. This file is the offline floor, not the whole safety net.
# Word gaps use [^\w.!?\n]+ so that a match never spans two sentences.
text_fields: [message.subject, message.body]
temperature: 1.0
negation_cues: ["no", "not", "denies", "denied", "without", "never", "sin"]
negation_window: 40
# Patients type fast when they are frightened: "chset pain" must still escalate.
typo_tolerance:
  min_length: 5

questions:
  urgency:
    default: routine
    default_score: 2.0
    labels:
      urgent:
        - name: chest-pain
          pattern: "chest (pain|pressure|tightness)|(tight|crushing|pressure in( my)?) chest|pain in (my|the) chest|dolor (de|en el) pecho|elephant(?:[^\\w.!?\\n]+\\w+){0,5}?[^\\w.!?\\n]+chest|chest(?:[^\\w.!?\\n]+\\w+){0,5}?[^\\w.!?\\n]+elephant"
          weight: 6
          negatable: true
        - name: breathing-difficulty
          pattern: "can'?t (catch (my|his|her) )?breathe?|(struggling|hard|difficult|trouble|difficulty) (to breathe|breathing)|short(ness)? of breath|out of breath|can barely (breathe|talk)|lips? (look |are |turning )?(a little )?blue|falta (el )?aire|no puedo respirar|gasping|asthma[^\\w.!?\\n]+attack"
          weight: 6
          negatable: true
        - name: stroke-signs
          pattern: "face (is )?droop|drooping|slurred|can'?t find (my|his|her) words|sudden(ly)? (weak|numb|confus)|can'?t (lift|move) (my|his|her) (left |right )?(arm|leg)|cara ca[i\u00ed]da|no puede hablar|face(?:[^\\w.!?\\n]+\\w+){0,3}?[^\\w.!?\\n]+(went[^\\w.!?\\n]+)?(numb|droop\\w*)|words(?:[^\\w.!?\\n]+\\w+){0,3}?[^\\w.!?\\n]+(wrong|jumbled|garbled)|can'?t[^\\w.!?\\n]+walk[^\\w.!?\\n]+straight|sudden\\w*(?:[^\\w.!?\\n]+\\w+){0,4}?[^\\w.!?\\n]+(confus\\w*|weak\\w*|numb\\w*|can'?t[^\\w.!?\\n]+walk)"
          weight: 6
          negatable: true
        - name: self-harm
          pattern: "kill(ing)? myself|end (it|my life)|suicid|don'?t want to (be alive|live)|hurt(ing)? myself|quitarme la vida"
          weight: 7
        - name: intentional-overdose
          pattern: "(took|taken) (a lot|way|much) more|on purpose|overdos|swallow\\w*(?:[^\\w.!?\\n]+\\w+){0,4}?[^\\w.!?\\n]+(pills|tablets|bottle)|(whole|entire)[^\\w.!?\\n]+bottle[^\\w.!?\\n]+of"
          weight: 5
        - name: severe-bleeding
          pattern: "won'?t stop bleeding|bleeding heavily|heavy bleeding|(throwing|vomiting|coughing) up blood"
          weight: 6
          negatable: true
        - name: gi-bleeding
          pattern: "(vomit\\w*|puk\\w*|throw\\w*[^\\w.!?\\n]+up|threw[^\\w.!?\\n]+up)(?:[^\\w.!?\\n]+\\w+){0,4}?[^\\w.!?\\n]+blood|blood(y)?[^\\w.!?\\n]+(in[^\\w.!?\\n]+(my|the|his|her)[^\\w.!?\\n]+)?(vomit|stool|poop)|coffee[\\s-]grounds?|black[^\\w.!?\\n]+(and[^\\w.!?\\n]+)?tarry|tarry[^\\w.!?\\n]+(stool|poop)|blood[^\\w.!?\\n]+in[^\\w.!?\\n]+(the[^\\w.!?\\n]+)?toilet|vomitando[^\\w.!?\\n]+sangre|v[o\u00f3]mito[^\\w.!?\\n]+con[^\\w.!?\\n]+sangre"
          weight: 6
          negatable: true
        - name: coughing-blood
          pattern: "cough\\w*(?:[^\\w.!?\\n]+\\w+){0,3}?[^\\w.!?\\n]+blood|hemoptysis"
          weight: 6
          negatable: true
        - name: pregnancy-bleeding
          pattern: "pregnan\\w*(?:[^\\w.!?\\n]+\\w+){0,6}?[^\\w.!?\\n]+bleed\\w*|bleed\\w*(?:[^\\w.!?\\n]+\\w+){0,6}?[^\\w.!?\\n]+pregnan\\w*"
          weight: 6
          negatable: true
        - name: anaphylaxis
          pattern: "throat (is |feels )?(like it'?s )?(closing|swelling)|swelling of (my |his |her )?(lips|tongue|throat)|(lips|tongue|throat) (is |are )?swelling|throat(?:[^\\w.!?\\n]+\\w+){0,2}?[^\\w.!?\\n]+(tight|closing|swollen)|hives(?:[^\\w.!?\\n]+\\w+){0,6}?[^\\w.!?\\n]+(throat|breath\\w*)"
          weight: 6
          negatable: true
        - name: near-fainting
          pattern: "(going|about)[^\\w.!?\\n]+to[^\\w.!?\\n]+pass[^\\w.!?\\n]+out|gonna[^\\w.!?\\n]+pass[^\\w.!?\\n]+out|feel\\w*[^\\w.!?\\n]+(very[^\\w.!?\\n]+)?faint"
          weight: 5
          negatable: true
        - name: hard-to-wake
          pattern: "hard to wake|won'?t wake|unresponsive|passed out|fainted"
          weight: 5
          negatable: true
        - name: head-injury
          pattern: "(hit|bumped|banged)[^\\w.!?\\n]+(my|his|her|their)[^\\w.!?\\n]+head(?:[^\\w.!?\\n]+\\w+){0,8}?[^\\w.!?\\n]+(throw\\w*[^\\w.!?\\n]+up|vomit\\w*|confus\\w*|drows\\w*)"
          weight: 6
          negatable: true
        - name: acute-abdomen
          pattern: "(belly|abdomen|stomach)(?:[^\\w.!?\\n]+\\w+){0,4}?[^\\w.!?\\n]+(rock|board)[\\s-]hard|(rock|board)[\\s-]hard[^\\w.!?\\n]+(belly|abdomen|stomach)|severe[^\\w.!?\\n]+(abdominal|belly|stomach)[^\\w.!?\\n]+pain|severe[^\\w.!?\\n]+pain[^\\w.!?\\n]+in[^\\w.!?\\n]+(my|the)[^\\w.!?\\n]+(belly|abdomen|stomach)"
          weight: 5
          negatable: true
        - name: worst-headache
          pattern: "worst[^\\w.!?\\n]+headache[^\\w.!?\\n]+(of|in)[^\\w.!?\\n]+(my|his|her)[^\\w.!?\\n]+life|thunderclap"
          weight: 6
          negatable: true
        - name: young-infant
          pattern: "\\b\\d+ ?(week|day)s? old|newborn|infant"
          weight: 1.2
        - name: fever
          pattern: "fever|temperature|\\b10[0-4](\\.\\d)?\\b|fiebre"
          weight: 1.0
          negatable: true

text_fields: [summary]
temperature: 1.0
negation_cues: ["not", "no", "denies"]
negation_window: 20
questions:
  inc_adult:
    default: "no"
    default_score: 1.0
    labels:
      "yes": [{name: adult-age, pattern: "\\bage (1[89]|[2-9][0-9])\\b", weight: 5}]
      "no": [{name: minor-age, pattern: "\\bage ([0-9]|1[0-7])\\b", weight: 5}]
  inc_t2d:
    default: unknown
    default_score: 1.0
    labels:
      "yes": [{name: t2d, pattern: "type 2 diabetes|\\bt2dm\\b", weight: 5, negatable: true}]
      "no": [{name: t1d, pattern: "type 1 diabetes", weight: 5}]
  not_pregnant:
    default: unknown
    default_score: 1.0
    labels:
      "yes": [{name: not-pregnant, pattern: "not pregnant|postmenopausal|\\bmale\\b", weight: 5}]
      "no": [{name: pregnant, pattern: "pregnan", weight: 5, negatable: true}]
  severity:
    default: mild
    default_score: 1.0
    labels:
      moderate: [{name: moderate, pattern: "moderate|partially controlled", weight: 4}]
      severe: [{name: severe, pattern: "severe|uncontrolled", weight: 6}]

- name: all criteria met is a candidate, but level 2 means human review
  input: {summary: "age 54, type 2 diabetes, male"}
  expect: {outcome: HUMAN_REVIEW, answers: {eligibility: candidate, inc_adult: "yes"}}
- name: a failed criterion makes the patient not eligible
  input: {summary: "age 34, type 2 diabetes, pregnant"}
  expect: {answers: {eligibility: not_eligible, not_pregnant: "no"}}
- name: an unknown criterion needs review
  input: {summary: "age 61, type 2 diabetes"}
  expect: {answers: {eligibility: needs_review, not_pregnant: unknown}}
- name: severe disease triggers the score rule
  input: {summary: "age 70, type 2 diabetes, uncontrolled, postmenopausal"}
  expect: {outcome: HUMAN_REVIEW, priority: urgent, answers: {severity: severe}}

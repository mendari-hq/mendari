# Third-party software in the container images whose licence and copyright notices are not
# already in the image beside it: what psycopg-binary bundles in psycopg_binary.libs, what other
# packages link statically, CPython's incorporated software and pip's vendored packages (both from
# the base image). Debian's packages carry theirs (/usr/share/doc/<package>/copyright) and every
# other Python package its own (*.dist-info/licenses); the Rust crates compiled into packages are
# in crates.toml. The image build (scripts/image_notices.py) copies the texts of the components
# an image holds into /licenses/third-party/ and lists everything in THIRD_PARTY_NOTICES.md;
# scripts/check_image_licences.py fails an image that holds anything this file does not cover.
#
# Each [[component]]:
#   id, name, version, licence   the licence as an SPDX expression (the packager's statement for
#                                an RPM; the texts are what binds)
#   in                           the packages that carry it, at the version reviewed
#   arch                         the image architectures it is in (both when absent)
#   libs                         the files in psycopg_binary.libs that are it (auditwheel's names)
#   purl                         how the carrying package's own SBOM names it, when it does
#   how, source                  how it was built, and where its source is
#   texts                        its licence and notices from its upstream project at that version:
#                                a file at `url`, or `member` of the archive at `url`, or some
#                                `lines` of it (a notice in a source file's header); fetched by
#                                scripts/image_licence_texts.py fetch into texts/<id>/<file>
#   corresponding_source         for GPL and LGPL software (and CPython, whose readline and _gdbm
#                                modules link GNU Readline and GDBM): the exact source, and the
#                                scripts that built it, pinned by sha256, that the release
#                                publishes beside the image (scripts/image_sources.py)
#
# How the versions were found (2026-10-08): psycopg-binary 3.3.6's wheels carry an auditwheel SBOM
# of the system libraries grafted into them (the RPMs below); libpq, OpenSSL 3 and OpenLDAP are
# built from source by psycopg's tools/ci/build_libpq.sh at its 3.3.6 tag (LIBPQ_VERSION 18.6 and
# OPENSSL_VERSION 3.5.8 in its packages-bin.yml; OpenLDAP 2.6.14 in the script). On x86_64,
# libcrypt is libxcrypt 4.5.2 as the manylinux2014 image builds it: cibuildwheel 4.2.0 pins
# manylinux2014_x86_64 2026.08.04-1, built from pypa/manylinux 829db794 (LIBXCRYPT_VERSION).
# The other packages' bundled libraries come from their own builds: cffi 2.1.1's CI (libffi),
# PyYAML 6.0.3's (libyaml), google-re2's MODULE.bazel at RE2 2025-11-05 (Abseil, pybind11),
# cryptography's own SBOM (OpenSSL), and each Rust library's .comment section (rustc).

# The packages with native code, at the version whose build was reviewed for what it bundles. A new
# version, or a new package with native code, fails the image check until it is reviewed here.
[native]
cffi = "2.1.1"               # libffi 3.4.6, linked statically
cryptography = "50.0.1"      # OpenSSL 4.0.2 and Rust crates (its SBOMs), statically; Rust 1.98.0's std
google-re2 = "1.1.20251105"  # RE2 2025-11-05, Abseil 20250512.1, pybind11 2.13.6, statically
psycopg-binary = "3.3.6"     # the libraries in psycopg_binary.libs, below, per architecture
pydantic-core = "2.50.2"     # Rust crates (its SBOM), statically; Rust 1.99.1's std
pyyaml = "6.0.3"             # libyaml 0.2.5, statically
rpds-py = "2026.6.3"         # Rust crates (its SBOM), statically; Rust 1.96.0's std


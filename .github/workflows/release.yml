name: release

# A PyPI release by trusted publishing, on a `v*` tag only (the container images are published by
# the `images` workflow on the same tag). Nothing runs until the owner:
#   1. adds a trusted publisher on PyPI for this repository, workflow `release.yml`, environment
#      `pypi`;
#   2. pushes a tag matching the package version, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.22"
          python-version: "3.12"
      - name: The tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import mendari; print(mendari.__version__)')"
      - run: uv sync --locked && uv run pytest -q
      - run: uv build
      - name: The wheel installs and works in a clean environment
        run: |
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/mendari test mendari/patient-inbox-router
          /tmp/clean/bin/mendari new /tmp/refill-router --id my-clinic/refill-router
          /tmp/clean/bin/mendari test /tmp/refill-router
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

name: conformance

# Inferno's conformance suites against Mendari, weekly and by hand (sandbox/inferno/README.md).
# Not a required check: a run builds the kit, which takes minutes. The offline
# `fhir-conformance` job in ci.yml stays the required gate.
#
# smart-client and bulk-client (LP-23l): the scripted suites' image (sandbox/inferno/scripted:
# the SMART App Launch kit v1.0.3, through the Da Vinci CRD kit v0.15.0 it is built from, with
# the Bulk Data kit v0.14.0 beside it). Their tests wait for calls, so each runs through
# Inferno's web app and worker (scripts/inferno_session.py), which also does the client's part
# in the engine's container. The engine serves the bundled demo agent alone:
# - smart-client: suite smart_client_stu2_2 (a public client), Inferno as the EHR and the engine's
#   SMART launch the client;
# - bulk-client: suite bulk_data_v200_client, Inferno as the Bulk Data server (this project's
#   HAPI behind it) and `mendari bulk export` the client.
# Each job is one suite on its own runner, so each has its own verdict.
#
# Every verdict is scripts/inferno_check.py's: every test must give the result its expected
# results file lists, so a new failure and an unexpected pass both fail the job. The raw output
# can quote request and response bodies: it is uploaded for 7 days and never committed.
# No secret is used: images are pulled anonymously, the engine runs open with PHI mode `off`,
# and the Bulk client's key is made by the driver for the run.
on:
  schedule:
    - cron: "29 10 * * 2"  # Tuesdays, 06:29 EDT or 05:29 EST (cron runs on UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build the engine and the kits
        run: docker compose -f sandbox/inferno/scripted/docker-compose.yml build engine inferno
      - name: Start the open engine, Inferno and its worker
        run: docker compose -f sandbox/inferno/scripted/docker-compose.yml up -d --wait engine nginx
      - name: The suite's inputs (the engine's registration and a synthetic patient)
        run: >-
          uv run python scripts/inferno_scripted_inputs.py smart
          --out var/inferno/smart_client_stu2_2_inputs.json
      - name: Run the public client's tests, the launch done in the engine (the check decides)
        run: >-
          uv run python scripts/inferno_session.py smart_client_stu2_2
          --inputs var/inferno/smart_client_stu2_2_inputs.json
          --option client_type=SMART,authorization_code,public
          --out var/inferno/smart_client_stu2_2_results.json
          --tests var/inferno/smart_client_stu2_2_tests.json
      - name: Every test gives its expected result
        run: >-
          uv run python scripts/inferno_check.py var/inferno/smart_client_stu2_2_results.json
          --expected sandbox/inferno/smart_client_stu2_2_expected.json
          --tests var/inferno/smart_client_stu2_2_tests.json
      - name: The raw output, for 7 days (it can quote payloads; never committed)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: inferno-smart-client-raw
          path: var/inferno/
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f sandbox/inferno/scripted/docker-compose.yml logs --tail 200
      - if: always()
        run: docker compose -f sandbox/inferno/scripted/docker-compose.yml down --volumes

  bulk-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build the engine and the kits
        run: docker compose -f sandbox/inferno/scripted/docker-compose.yml build engine inferno
      - name: Start the open engine, HAPI, Inferno and its worker
        run: >-
          docker compose -f sandbox/inferno/scripted/docker-compose.yml --profile bulk
          up -d --wait engine fhir nginx
      - name: Synthetic patients in HAPI, for the export (the bundled demo agent's messages)
        run: >-
          docker compose -f sandbox/inferno/scripted/docker-compose.yml --profile bulk
          exec -T engine mendari sandbox seed --fhir http://fhir:8080/fhir
          --count 10 --wait 300
      - name: The suite's inputs (a patient-level export)
        run: >-
          uv run python scripts/inferno_scripted_inputs.py bulk
          --out var/inferno/bulk_data_v200_client_inputs.json
      - name: Run the client's tests, the export done in the engine (the check decides)
        run: >-
          uv run python scripts/inferno_session.py bulk_data_v200_client
          --inputs var/inferno/bulk_data_v200_client_inputs.json
          --out var/inferno/bulk_data_v200_client_results.json
          --tests var/inferno/bulk_data_v200_client_tests.json
      - name: Every test gives its expected result
        run: >-
          uv run python scripts/inferno_check.py var/inferno/bulk_data_v200_client_results.json
          --expected sandbox/inferno/bulk_data_v200_client_expected.json
          --tests var/inferno/bulk_data_v200_client_tests.json
      - name: The raw output, for 7 days (it can quote payloads; never committed)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: inferno-bulk-client-raw
          path: var/inferno/
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        run: >-
          docker compose -f sandbox/inferno/scripted/docker-compose.yml --profile bulk
          logs --tail 200
      - if: always()
        run: >-
          docker compose -f sandbox/inferno/scripted/docker-compose.yml --profile bulk
          down --volumes

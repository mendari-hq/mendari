# Synthetic test fixture: the agent the engine's tests decide with. Not clinically reviewed. Not
# for patient care. Its messages are made up by tests/support/fixture_agents.py, which also
# writes data/ and DECISION_CARD.md; everything else here is written by hand.
#
# Every outcome is reached offline, without a service:
# - AUTO: a confident team with the screen running its agent (`--provider screen=agent`, or the
#   agent checked by the rules, `checked`), since the policy automates only then
#   (`automation_requires`): a refill at 0.97, an appointment at 0.98 (the front desk needs
#   0.95), never billing (`allow_auto: false`);
# - HUMAN_REVIEW: a confidence from 0.50 to the label's threshold, a possible emergency (rule
#   `possible-emergency`, a nurse at priority stat), or any decision while the screen is the
#   keyword rules alone (the default);
# - ABSTAIN: below 0.50, a message the rules cannot place;
# - BLOCK: an input the schema refuses, or an abusive message (rule `abusive-message`).
# Its keyword rules miss same-day symptoms worded as a patient might, on purpose: the `critical`
# set is mostly such messages, so an evaluation shows the miss and the safety invariant has
# something to hold.
spec_version: "0.4"
id: mendari-test/triage
version: 1.0.0
name: "Synthetic Triage (test fixture)"
summary: >-
  Synthetic test fixture. Routes a synthetic patient message to the team that reads it first
  and flags same-day symptoms. Not clinically reviewed. Not for patient care.
publisher:
  name: Mendari tests
  type: community
license: Apache-2.0

risk:
  level: 1
  category: clinical information
  rationale: >-
    Test fixture. It suggests which team reads a synthetic message first and flags possible
    same-day symptoms for a nurse. Nothing is automated unless its urgency screen runs an agent.

card:
  provenance: synthetic
  intended_use: Tests of the engine. A synthetic test fixture, not clinically reviewed.
  intended_users:
    - Mendari developers
  patient_population: Synthetic messages made by a generator. No patient wrote any of them.
  out_of_scope:
    - Any real message, any real patient and any decision about care.
  known_failure_modes:
    - >-
      Its keyword rules miss same-day symptoms worded as a patient might, on purpose: the
      critical set shows the miss, and nothing is automated while the screen is the rules alone.
    - Its canned agents match words as typed, and miss other symptoms on purpose too.
  evidence:
    - title: Synthetic data only
      note: Generated by tests/support/fixture_agents.py.

inputs:
  schema: schemas/input.schema.json
  fhir: fhir/mapping.yaml

questions:
  destination:
    display: Team
    instructions: Which team should read this synthetic patient message first?
    criteria:
      front_desk: >-
        Appointments, records, forms, opening hours and anything administrative that is not
        about a bill.
      nurse: >-
        Symptoms, side effects and other questions about health, and every message that may
        describe symptoms that need attention today.
      pharmacy: Refills and renewals of a medication the patient already takes.
      billing: Bills, charges, payments and insurance.
    names:
      front_desk: Front desk
  urgency:
    type: boolean
    display: Same-day symptoms
    instructions: Does the message describe symptoms that may need attention today?
    criteria:
      "yes": >-
        For example chest pain, trouble breathing, signs of a stroke, coughing up blood or
        fainting, however the message words them.
      "no": No such symptoms, or symptoms the message says are not there.
  abusive:
    type: boolean
    display: Abusive
    instructions: Is the message abusive towards the people who read it?
    criteria:
      "yes": It insults the people who read it.
      "no": It does not, even when it complains.

providers:
  router:
    answers: [destination]
    use: rules
    variants:
      rules:
        type: rules
        config: logic/router_rules.yaml
      agent:
        type: agent
        agent_id: triage-router
        state_fields: [message.subject, message.body]
        mock_file: fixtures/router.json
      llm:
        type: llm
        state_fields: [message.body]
  screen:
    answers: [urgency, abusive]
    use: rules
    variants:
      rules:
        type: rules
        config: logic/screen_rules.yaml
      agent:
        type: agent
        agent_id: triage-screen
        state_fields: [message.body]
        mock_file: fixtures/screen.json
      checked:
        # The agent answers and the rules check it: where they disagree on a question the
        # policy reads, a person decides.
        type: check
        members:
          agent:
            type: agent
            agent_id: triage-screen
            state_fields: [message.body]
            mock_file: fixtures/screen.json
          second:
            type: rules
            config: logic/screen_rules.yaml
      repeated:
        type: agent
        agent_id: triage-screen
        state_fields: [message.body]
        mock_file: fixtures/screen.json
        repeat: 3
      llm:
        type: llm
        state_fields: [message.body]

policy:
  primary: destination
  thresholds:
    auto: 0.90
    review: 0.50
  labels:
    billing:
      allow_auto: false
    front_desk:
      auto_threshold: 0.95
  automation_requires:
    screen: [agent, checked]
  rules:
    - name: possible-emergency
      when:
        question: urgency
        labels: ["yes"]
        min_probability: 0.35
      outcome: HUMAN_REVIEW
      recommendation: nurse
      priority: stat
      reason: Possible same-day symptoms. A nurse reads the message now.
    - name: abusive-message
      when:
        question: abusive
        labels: ["yes"]
        min_confidence: 0.9
      outcome: BLOCK
      reason: The message is abusive and is not routed.
  fallback: The front desk reads the message.
  default_priority: routine

evaluation:
  datasets:
    examples: data/examples.jsonl
    test: data/test.jsonl
    calibration: data/calibration.jsonl
    critical: data/critical.jsonl
  benchmark_dataset: test
  critical:
    - question: urgency
      label: "yes"
  subgroups: [channel]

tests: tests/cases.yaml

cds_hooks:
  hook: mendari-message-received
  title: Synthetic Triage
  description: >-
    Synthetic test fixture. Suggests the team that reads a synthetic patient message first.
  prefetch:
    communication: Communication/{{context.communicationId}}
    patient: Patient/{{context.patientId}}
  # A card for the teams that act on a message from the EHR, and for a refused input. A message
  # for a nurse shows none, but for a possible emergency, which shows the rule's own card.
  card:
    summaries:
      front_desk: "{recommendation}: a message to read ({priority})"
      pharmacy: "Message for the pharmacy: a refill to check ({priority})"
      billing: "Message for billing ({priority})"
      refused: "Message not checked: Mendari refused it as invalid input"
    indicators:
      front_desk: info
      pharmacy: info
      billing: info
      refused: warning
    show: [front_desk, pharmacy, billing, refused]
    also_show:
      possible-emergency:
        summary: "Possible emergency: {recommendation} triage now ({priority})"
        indicator: critical
    suggestion: Create a routing task

spec_version: "0.2"
id: mendari/patient-inbox-router
version: 0.4.0
name: Patient Inbox Router
summary: >-
  Routes patient portal and SMS messages to the front desk, a medical assistant, a nurse, a
  physician or billing, and escalates possible emergencies to stat nurse triage.
publisher:
  name: Mendari reference packs
  type: community
license: Apache-2.0

risk:
  level: 0
  category: administrative
  rationale: >-
    The decision is which team reads a message first. The pack never replies to patients or
    makes a clinical judgement. A misroute delays a message but does not by itself change
    care, and messages that may describe an emergency are never auto-routed: a deterministic
    screen always sends them to a nurse for stat human review.

card:
  intended_use: >-
    First-pass routing of incoming patient portal or SMS messages in an outpatient primary-care
    practice, with an explicit escalation path for messages that may describe an emergency.
  intended_users:
    - Front-desk staff and practice managers
    - Medical assistants, nurses and physicians working the shared inbox
    - Health IT teams integrating the inbox with the EHR
  patient_population: >-
    Adult and pediatric primary-care patients, or their caregivers, writing in English or
    Spanish to a US outpatient practice.
  out_of_scope:
    - Replying to patients, giving medical advice or deciding on care.
    - Acting as the safety net for emergencies. Portals must keep telling patients to call 911
      for emergencies; the red-flag screen only speeds up triage of messages that arrive anyway.
    - Specialty, inpatient or behavioral-health-only inboxes, and languages other than
      English and Spanish.
  known_failure_modes:
    - The keyword red-flag screen alone misses most emergencies phrased in ways it does not list.
      On hand-written paraphrases it caught 28/28 of the set its patterns were tuned on but only
      4/20 of a held-out set, and 7 of the emergencies it missed would have been routed without
      anyone reading them. Jev caught 48/48 across both with no false alarms. So the policy allows
      AUTO only while the screen includes a model (`automation_requires` with
      `safety_screen=rules_and_jev` or `rules_and_llm`); with the rules alone, every message goes
      to a person. The rules can also over-trigger on symptoms that happened in the past.
    - Negation handling is a fixed-window heuristic. "No chest pain" is handled; complex or
      long-distance negation is not.
    - Messages that mix administrative and clinical requests are sometimes sent to the
      administrative team.
    - Requests for outside records that mention the ER, imaging or specialists can be mistaken
      for clinical questions (demonstrated by the bundled local-site validation example).
    - The statistical router was trained only on synthetic messages. A real site's phrasing,
      language mix and case mix will differ. Validate locally before any deployment.
    - The public benchmark is generated from templates, so it overstates real-world accuracy.
      Treat it as a regression test for the pack, not as an estimate of performance at a site.
    - LLM variants report verbalised probabilities, and every model is calibrated differently.
      Check the chosen model in the provider comparison (ECE, false automation) and fit
      `mendari calibrate` before relying on it. A remote model can fail or time out, so never
      deploy safety_screen=llm without the rules floor (use rules_and_llm).
  evidence:
    - title: Synthetic public benchmark
      note: evals/benchmark.json, the held-out test split generated by mendari.sandbox.synthetic_inbox.
    - title: Routing principle
      note: >-
        Route to the least specialised team that can fully handle the request. Anything that
        needs clinical judgement goes to a clinical team, and possible emergencies go to nurse
        triage.

inputs:
  schema: schemas/input.schema.json
  fhir: fhir/mapping.yaml

questions:
  destination:
    instructions: >-
      Which team should handle this patient message first? Route to the least specialised team
      that can fully handle it. If a message mixes administrative and clinical requests, choose
      the most clinically qualified team needed.
    criteria:
      front_desk: >-
        Scheduling, rescheduling or cancelling appointments; hours, directions and parking;
        portal access; updating contact details; general requests that need no clinical data.
      medical_assistant: >-
        Routine prescription refills and renewals, requests for or transfers of medical records,
        referral and lab-order status, and forms that need clinical information filled in.
      nurse: >-
        New or ongoing symptoms, medication side effects, wound and post-procedure care, vaccine
        questions, and anything that needs clinical triage, including possible emergencies.
      physician: >-
        Questions that need a physician's judgement: interpreting results, changing a diagnosis
        or treatment plan, dose changes, and requests for the physician's opinion.
      billing: >-
        Bills, statements, copays, charges, refunds, payment plans, insurance claims, coverage
        and cost estimates.
  urgency:
    # One judgment, stated literally; how much doubt is enough to escalate is the policy's
    # min_probability, not part of the question.
    instructions: >-
      Could the situation in this message be a medical emergency that is happening now or
      getting worse?
    criteria:
      urgent: >-
        Possibly an emergency now, even when described casually or with uncertainty: chest pain
        or pressure; trouble breathing; stroke signs such as face drooping, arm weakness or
        slurred speech; thoughts of suicide or self-harm, or an intentional overdose; heavy
        bleeding, including vomiting or coughing up blood, or bleeding in pregnancy; a severe
        allergic reaction; fever in a baby under 3 months; a person who is hard to wake,
        fainting or newly confused; a head injury followed by vomiting or confusion; sudden
        severe pain in the head or belly.
      routine: >-
        Not an emergency now: administrative requests, refills, questions, mild or long-standing
        symptoms, and past episodes that have already been treated or assessed, such as asking
        for records from an emergency room visit.

providers:
  safety_screen:
    answers: [urgency]
    # Offline floor: with the rules alone nothing is automated (see the policy). A Mendari
    # server with Jev set up runs rules_and_jev unless its provider settings choose otherwise.
    use: rules
    variants:
      rules:
        type: rules
        config: logic/red_flags.yaml
      rules_and_jev:
        # Both screens run; whichever gives the higher P(urgent) decides. A Jev outage leaves
        # the rules answering, and nothing is automated while the screen is incomplete.
        type: any_of
        escalate: {urgency: urgent}
        members:
          rules:
            type: rules
            config: logic/red_flags.yaml
          jev:
            type: jev
            timeout_ms: 5000
            state_fields: [message.subject, message.body]
      jev:
        type: jev
        timeout_ms: 5000
        state_fields: [message.subject, message.body]
      rules_and_llm:
        # As rules_and_jev, with a chat model (LLM_MODEL; default Claude Sonnet 5) as the
        # second screen. The keyword rules stay as the offline floor.
        type: any_of
        escalate: {urgency: urgent}
        members:
          rules:
            type: rules
            config: logic/red_flags.yaml
          llm:
            type: llm
            reasoning_effort: low
            state_fields: [message.subject, message.body]
      llm:
        type: llm
        reasoning_effort: low
        state_fields: [message.subject, message.body]
  router:
    answers: [destination]
    use: naive_bayes
    variants:
      naive_bayes:
        type: naive_bayes
        model_file: models/destination-nb.json
        text_fields: [message.subject, message.body]
      rules:
        type: rules
        config: logic/routing_rules.yaml
      jev:
        type: jev
        timeout_ms: 5000
        state_fields: [message.subject, message.body, message.channel, patient.preferred_language]
      llm:
        # Any chat model through the AI Gateway or a local OpenAI-compatible server: the model
        # is a deployment setting (LLM_MODEL, LLM_BASE_URL).
        type: llm
        reasoning_effort: low
        state_fields: [message.subject, message.body, message.channel, patient.preferred_language]
      cascade:
        # Naive Bayes answers when it is at least 95% sure; otherwise Jev is asked.
        type: cascade
        accept_at: 0.95
        members:
          naive_bayes:
            type: naive_bayes
            model_file: models/destination-nb.json
            text_fields: [message.subject, message.body]
          jev:
            type: jev
            timeout_ms: 5000
            state_fields: [message.subject, message.body, message.channel, patient.preferred_language]

policy: policy.yaml

evaluation:
  datasets:
    train: data/train.jsonl
    calibration: data/calibration.jsonl
    test: data/test.jsonl
    # Hand-written emergency paraphrases and look-alike routine messages (safety regression).
    red_flags: data/red_flags.jsonl
    # Written before tuning the rules on red_flags; never used to write patterns.
    red_flags_holdout: data/red_flags_holdout.jsonl
  benchmark: evals/benchmark.json
  benchmark_dataset: test
  critical:
    - question: urgency
      label: urgent
  subgroups: [language, channel, age_band, topic]
  degradation_tolerance: 0.03

tests: tests/cases.yaml

audit:
  store_input: full

cds_hooks:
  hook: mendari-message-received
  title: Patient Inbox Router
  description: Suggests a destination team and priority for an incoming patient message.
  prefetch:
    communication: Communication/{{context.communicationId}}
    patient: Patient/{{context.patientId}}

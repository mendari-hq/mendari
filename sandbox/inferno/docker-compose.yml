# SPDX-License-Identifier: Apache-2.0
# Inferno against Mendari, on synthetic data only (sandbox/inferno/README.md). Separate from the
# root docker-compose.yml, so the sandbox and its CI job stay as they are.
#
#   docker compose -f sandbox/inferno/docker-compose.yml build engine inferno
#   docker compose -f sandbox/inferno/docker-compose.yml up -d --wait engine
#   uv run python scripts/inferno_dtr_inputs.py --engine http://127.0.0.1:8090 \
#     --agent tests/fixtures/reference-agents/prior-auth-preflight \
#     --out var/inferno/dtr_payer_server_v220_preset.json
#   docker compose -f sandbox/inferno/docker-compose.yml run --rm -T inferno \
#     bundle exec inferno execute --suite dtr_payer_server_v220 --groups 1 3 4 \
#     --preset-file /inputs/dtr_payer_server_v220_preset.json --outputter json \
#     > var/inferno/dtr_payer_server_v220_results.json
#   uv run python scripts/inferno_check.py var/inferno/dtr_payer_server_v220_results.json \
#     --expected sandbox/inferno/dtr_payer_server_v220_expected.json
#
# Every image is pinned by digest, or built here from a pinned base (the engine from the
# repository's Dockerfile, the kit from sandbox/inferno/Dockerfile). Inferno is given only this
# network's addresses: INFERNO_HOST is the internal nginx, and FHIR_REFERENCE_SERVER (the ONC
# reference server, which the payer suite does not use) is a dead local URL. The validator
# fetches the implementation guides it loads from packages.fhir.org, and validates without a
# terminology server (offline_terminology.rb).
name: mendari-inferno

x-inferno-environment: &inferno-environment
  FHIR_RESOURCE_VALIDATOR_URL: http://hl7_validator_service:3500
  FHIRPATH_URL: http://fhirpath:6789
  REDIS_URL: redis://redis:6379/0
  INFERNO_HOST: http://nginx
  FHIR_REFERENCE_SERVER: http://127.0.0.1:9/reference-server/r4
  # No validator session is warmed up at boot for every suite the kit carries: a run's
  # validator sessions start when its tests first validate.
  INITIALIZE_VALIDATOR_SESSIONS: "false"

services:
  engine:
    # Mendari in open mode (no sign-in), PHI mode `off`, serving the prior-authorization pack
    # alone: the decisions it makes here are on the synthetic orders the inputs script sends.
    build:
      context: ../..
    image: mendari-engine:inferno
    environment:
      MENDARI_PHI_MODE: "off"
      # Inferno and the inputs script reach this open engine over Docker's network, never from
      # loopback, so its CDS Hooks services answer only under the sandbox flag (LP-23c).
      MENDARI_CDS_SANDBOX: "1"
      MENDARI_AGENTS: mendari/prior-auth-preflight
      MENDARI_PUBLIC_URL: http://engine:8000
      # The agents are test fixtures, mounted read-only (the image ships only the demo agent).
      MENDARI_AGENTS_PATH: /sandbox/agents
      MENDARI_DATASETS_PATH: /sandbox/datasets
    volumes:
      - ../../tests/fixtures/reference-agents:/sandbox/agents:ro
      - ../../tests/fixtures/datasets:/sandbox/datasets:ro
    ports:
      - "127.0.0.1:${MENDARI_INFERNO_ENGINE_PORT:-8090}:8000"

  inferno:
    # The kit's web app; `docker compose run inferno bundle exec inferno execute ...` runs a
    # suite from the command line in this same image.
    build:
      context: .
    image: mendari-inferno-dtr:0.18.0
    environment: *inferno-environment
    volumes:
      - "${MENDARI_INFERNO_INPUTS:-../../var/inferno}:/inputs:ro"
    depends_on:
      engine:
        condition: service_healthy
      hl7_validator_service:
        condition: service_healthy
      fhirpath:
        condition: service_started
      redis:
        condition: service_started

  worker:
    # Runs the tests a person starts from the web app (the command line runs them in-process).
    # Its image is the one `inferno` builds here, never one pulled by that name.
    image: mendari-inferno-dtr:0.18.0
    pull_policy: never
    command: ["bundle", "exec", "sidekiq", "-r", "./worker.rb"]
    environment: *inferno-environment
    depends_on:
      redis:
        condition: service_started
      hl7_validator_service:
        condition: service_healthy

  redis:
    image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec

  hl7_validator_service:
    image: infernocommunity/inferno-resource-validator:1.0.84@sha256:92ec7a22e3c6f4cdf5eed9db210150a93531034e100c7521e4930c975b3c9058
    environment:
      SESSION_CACHE_DURATION: "-1"  # minutes; a run's sessions last as long as the service
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3500/validator/version"]
      interval: 5s
      timeout: 3s
      retries: 30

  fhirpath:
    image: infernocommunity/fhirpath-service:v0.1.0@sha256:067880db1ccbefb2c57060f43a81edf93b645cffcf37b63a3b8f9b114fffa2cb

  nginx:
    # The web app for a person, on this machine only: http://127.0.0.1:4580.
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${MENDARI_INFERNO_UI_PORT:-4580}:80"
    depends_on:
      inferno:
        condition: service_started
      worker:
        condition: service_started

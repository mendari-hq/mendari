<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OpenHealth Hub</title>
  <script>
    // Resolve the theme before the stylesheet paints anything, so there is never a flash of the
    // wrong theme: the saved choice (System / Light / Dark), else the system setting. app.js keeps
    // it in sync afterwards.
    (function () {
      var choice = "system";
      try { choice = localStorage.getItem("oh.theme") || "system"; } catch (e) { /* private mode */ }
      var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Icons from Lucide (https://lucide.dev), ISC License; see /static/LICENSE-lucide.txt. -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-thumbs-up" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></symbol>
    <symbol id="i-thumbs-down" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevrons" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
  </svg>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <span>OpenHealth Hub</span>
      <span class="badge tag">sandbox · synthetic data only</span>
    </div>
    <div class="topbar-actions">
      <div class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" title="Match the system setting"><svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg><span class="label">System</span></button>
        <button type="button" data-theme-choice="light" title="Light theme"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="label">Light</span></button>
        <button type="button" data-theme-choice="dark" title="Dark theme"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="label">Dark</span></button>
      </div>
      <label class="pack-picker">
        <span class="sr-only">Decision Pack</span>
        <select id="pack-select"></select>
      </label>
    </div>
  </header>
  <div class="shell">
    <nav class="nav" aria-label="Sections">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#review" data-view="review">Review queue <span class="count" id="review-count"></span></a>
      <a href="#audit" data-view="audit">Audit trail</a>
      <a href="#evals" data-view="evals">Evaluations</a>
      <a href="#feedback" data-view="feedback">Feedback</a>
      <a href="#card" data-view="card">Decision Card</a>
      <a href="#try" data-view="try">Try it</a>
      <a href="/docs" class="external">API docs <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg></a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/table.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

name: Clean up Neon preview branches

# The Vercel-managed Neon integration creates a database branch `preview/<git branch>` for every
# preview deployment, but deletes it only when Vercel deletes the deployment (months later), so
# branches pile up against the Neon plan's branch limit (10, main included) and previews fail
# with "Resource provisioning failed". scripts/neon_preview_cleanup.py deletes every preview
# branch whose Git branch has no open pull request and is gone or had one. It runs when a pull
# request closes, and every six hours for what a close misses: a preview that finished building
# after the merge (and so recreated its branch), a run GitHub never started, a branch pushed
# without a pull request.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 */6 * * *"  # every six hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, delete nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: neon-preview-cleanup

jobs:
  delete-preview-branches:
    # A fork's pull request, or one Dependabot closes, runs without the repository's secrets.
    if: >-
      vars.NEON_PROJECT_ID != '' && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the Git branches
      pull-requests: read  # which branches have, or had, a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}  # main's script, never a pull request's
          sparse-checkout: scripts/neon_preview_cleanup.py
          sparse-checkout-cone-mode: false
      - name: Delete the preview branches no pull request needs
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then set -- --dry-run; fi
          python3 scripts/neon_preview_cleanup.py "$@"

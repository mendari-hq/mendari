# The structured part of the preflight, computed in code by the `criteria` provider: which
# requirement set applies (service, payer), and whether the coded record has what the payer
# asks for. Which elements a payer requires for a service is the decision table's job
# (`next_step` in pack.yaml). A site adds its own codes here (see the Decision Card).
as_of: as_of

questions:
  service:
    checks:
      - value: {field: order.code, in: ["FX101", "FX102", "FX103"], then: lumbar_mri}
      - value: {field: order.code, in: ["FX201", "FX202"], then: knee_arthroscopy}
      - value: {field: order.code, in: ["FX301", "FX302"], then: sleep_study}
    default: other

  payer:
    checks:
      - value: {field: coverage.payer, in: [acme], then: acme}
      - value: {field: coverage.payer, in: [beacon], then: beacon}
    default: other

  diagnosis_supports:
    checks:
      - condition: {codes: ["M54.1*", "M51.*"], then: "yes"}
        when: {field: order.code, in: ["FX101", "FX102", "FX103"]}
      - condition: {codes: ["S83.2*", "M23.2*"], then: "yes"}
        when: {field: order.code, in: ["FX201", "FX202"]}
      - condition: {codes: ["G47.33", "R06.83"], then: "yes"}
        when: {field: order.code, in: ["FX301", "FX302"]}
    default: "no"

  prior_imaging:
    checks:
      - exists: {in: procedures, codes: ["FX111"], within_days: 180, then: "yes"}
        when: {field: order.code, in: ["FX101", "FX102", "FX103"]}
      - exists: {in: procedures, codes: ["FX211", "FX212", "FX213"], within_days: 180, then: "yes"}
        when: {field: order.code, in: ["FX201", "FX202"]}
    default: "no"

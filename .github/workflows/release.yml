name: release

# A release is made by hand, never by a tag push. The owner (tasks/todo.md, "Going public: owner
# steps"):
#   1. writes the version's section in CHANGELOG.md and tags the commit `v<version>`;
#   2. runs this workflow (Actions → release → Run workflow) with that tag and publish off: it
#      checks the tag and the version, runs the tests, builds the sdist, the wheel and the six
#      images, and tests each;
#   3. runs it again with publish on. A publishing job starts only after the same build passes,
#      and only on a public repository; it first checks, through the API, that its environment
#      has required reviewers (refusing when it cannot tell), then waits for their approval.
# PyPI uses trusted publishing (environment `pypi`): no API token is stored anywhere. Images go
# to GitHub Container Registry (environment `ghcr`): each is pushed exactly as it was tested.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, e.g. v0.1.0 (it must exist and match the package version)
        required: true
        type: string
      publish:
        description: Publish to PyPI and GitHub Container Registry once the build passes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.22"
          python-version: "3.12"
      - name: The tag names this commit; the version, wherever written, is the tag's and has its changelog section
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release.py version "$TAG"
      - run: uv sync --locked && uv run pytest -q
      - run: uv build
      - name: The sdist holds only what a source build needs; no package holds notes, plans, agent or CI files
        run: |
          uv run python scripts/check_sdist.py dist/mendari-*.tar.gz
          python3 scripts/check_excluded.py dist/mendari-*.tar.gz dist/*.whl
      - name: The wheel installs and works in a clean environment
        run: |
          python3 -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/mendari test mendari/patient-inbox-router
          /tmp/clean/bin/mendari new /tmp/refill-router --id my-clinic/refill-router
          /tmp/clean/bin/mendari test /tmp/refill-router
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  images:
    # The engine with every pack, and one image per pack, each built from the tagged commit,
    # tested and checked, then saved: the publishing job pushes these very images.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mendari-engine, pack: mendari/patient-inbox-router, only: ""}
          - {name: mendari-patient-inbox-router, pack: mendari/patient-inbox-router, only: mendari/patient-inbox-router}
          - {name: mendari-referral-router, pack: mendari/referral-router, only: mendari/referral-router}
          - {name: mendari-prior-auth-preflight, pack: mendari/prior-auth-preflight, only: mendari/prior-auth-preflight}
          - {name: mendari-clinical-trial-prescreener, pack: mendari/clinical-trial-prescreener, only: mendari/clinical-trial-prescreener}
          - {name: mendari-ai-guard, pack: mendari/ai-guard, only: mendari/ai-guard}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Build, test and check the image (no notes, plans, agent or CI files), then save it
        env:
          NAME: ${{ matrix.name }}
          PACK: ${{ matrix.pack }}
          ONLY: ${{ matrix.only }}
          TAG: ${{ inputs.tag }}
        run: |
          image="${NAME}:${TAG}"
          docker build --build-arg PACK="$ONLY" -t "$image" .
          docker run --rm "$image" mendari test "$PACK"
          python3 scripts/check_excluded.py --image "$image"
          docker save "$image" | gzip > "/tmp/${NAME}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: image-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar.gz
          retention-days: 7

  publish-pypi:
    needs: [build, images]
    if: inputs.publish && !github.event.repository.private
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read  # the environment's protection rules, for the guard
      id-token: write  # trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Refuse unless the repository is public and this environment has required reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release.py environment pypi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  publish-images:
    # Each image is a deployment the reviewer approves in the run.
    needs: [build, images]
    if: inputs.publish && !github.event.repository.private
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: read
      actions: read  # the environment's protection rules, for the guard
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - mendari-engine
          - mendari-patient-inbox-router
          - mendari-referral-router
          - mendari-prior-auth-preflight
          - mendari-clinical-trial-prescreener
          - mendari-ai-guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Refuse unless the repository is public and this environment has required reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release.py environment ghcr
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: image-${{ matrix.name }}
          path: /tmp/image
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        env:
          NAME: ${{ matrix.name }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
        run: |
          gunzip -c "/tmp/image/${NAME}.tar.gz" | docker load
          image="ghcr.io/${OWNER,,}/${NAME}:${TAG}"
          docker tag "${NAME}:${TAG}" "$image"
          docker push "$image"

              - tests/test_hosted_data.py::test_sign_in_needs_a_chosen_mode
              - tests/test_hosted_data.py::test_no_route_shows_a_stored_case_but_to_a_reader_and_every_read_is_chained
              - tests/test_hosted_data.py::test_erasing_a_kept_input_and_its_notes_keeps_the_chain
              - tests/test_hosted_data.py::test_admins_erase_through_the_api
              - tests/test_hosted_data.py::test_the_cli_erases
              - tests/test_hosted_data.py::test_retention_keeps_30_days_unless_told_and_never_0_from_a_setting
              - tests/test_hosted_data.py::test_purging_everything_is_asked_for_on_the_command_line
              - tests/test_hosted_data.py::test_retention_purges_in_batches_and_chains_a_summary
              - tests/test_hosted_data.py::test_the_scheduled_purge_runs_with_the_cron_secret_only
              - tests/test_hosted_data.py::test_vercel_schedules_the_purge_daily
              - tests/test_rotation.py::test_a_thousand_values_rotate_in_batches_and_everything_still_opens
              - tests/test_rotation.py::test_an_interrupted_rotation_resumes
              - tests/test_rotation.py::test_a_new_input_hash_key_starts_an_epoch
              - tests/test_rotation.py::test_a_rotated_key_overlaps_then_expires
              - tests/test_rotation.py::test_admins_rotate_keys_through_the_api
          - pending: "LP-08's refusal (the owner chose refuse, 2026-10-07, tasks/todo.md): outside Vercel, an explicit MENDARI_PHI_MODE=off with sign-in on refuses to start; the build PR's tests replace this line. The hosted keys and CRON_SECRET are the owner's"
      - id: a6-accounts
        what: "A6: accounts, organizations as records, memberships, invitations, self-service keys without a redeploy"
        owner: build
        probes:
          - pending: "LP-12"
      - id: partners-3
        what: "Three or more design partners active, each under a signed NDA and pilot agreement"
        owner: owner
        probes:
          - attested: {what: "the number of partners with signed agreements (the documents stay outside the repository)", by: "", date: ""}
      - id: labelling-underway
        what: "Hidden-set labelling under way: clinician labellers working in A8's labelling workflow"
        owner: owner
        probes:
          - pending: "LP-11 (the labelling workflow), after LP-10"
          - attested: {what: "the labellers contracted and the sets in labelling", by: "", date: ""}
      - id: trademark-filed
        what: "The trademark application for Mendari filed (B05)"
        owner: owner
        probes:
          - attested: {what: "the USPTO serial number", by: "", date: ""}
      - id: legal-pages-live
        what: "Terms of use, privacy notice and acceptable-use policy live and linked (B16)"
        owner: owner
        probes:
          - pending: "a build prompt, not yet assigned: serve and link the three texts and record acceptance (tasks/todo.md)"
          - attested: {what: "counsel-approved texts live on the hosted site", by: "", date: ""}


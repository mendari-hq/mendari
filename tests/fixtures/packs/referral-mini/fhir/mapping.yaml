# FHIR R4 -> pack input: one referral ServiceRequest and the patient's documents.
fhir_version: R4
focus: ServiceRequest
focus_where:
  path: category[0].coding[0].code
  in: ["3457005"]  # SNOMED CT: patient referral
resources:
  ServiceRequest:
    required: true
fields:
  referral.reason:
    path: ServiceRequest.reasonCode.text
    transform: join
  referral.priority:
    path: ServiceRequest.priority
lists:
  documents:
    resource: DocumentReference
    fields:
      code:
        path: type.coding[0].code
      date:
        path: date
task:
  code_text: Handle referral
  performer_system: https://mendari.co/fhir/CodeSystem/referral-queue
  performer: "{specialty}"
  description: "Referral {recommendation} ({specialty})"

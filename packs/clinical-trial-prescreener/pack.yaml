spec_version: "0.2"
id: mendari/clinical-trial-prescreener
version: 0.1.5
name: Clinical Trial Prescreener
summary: >-
  Checks a patient's record against the eligibility criteria of a synthetic type 2 diabetes
  study (GLYCEMIA-2): structured criteria are computed from coded data, and exclusions are
  looked for in the clinic notes. Every result goes to a research coordinator for review.
publisher:
  name: Mendari reference packs
  type: community
license: Apache-2.0
# The code systems the pack's inputs, rules and data use (spec §3). A licensed one says the terms.
code_systems:
  - url: http://hl7.org/fhir/sid/icd-10-cm
    name: >-
      ICD-10-CM (U.S. National Center for Health Statistics: free to use; adapted from the World
      Health Organization's copyrighted ICD-10, with WHO's authorization, for U.S. government
      purposes)
  - url: http://snomed.info/sct
    name: SNOMED CT (SNOMED International)
    licence_note: >-
      Using SNOMED CT needs an Affiliate Licence from SNOMED International: free of charge in
      its member territories (in the United States through the National Library of Medicine's
      UMLS licence), in low-income countries and for qualifying research; fees apply elsewhere.
      Whether the reference packs may carry its codes is a question recorded for counsel
      (tasks/todo.md, LP-14).
  - url: http://loinc.org
    name: LOINC (Regenstrief Institute; the LOINC License, whose notice is in NOTICE)

risk:
  level: 2
  category: clinical support
  rationale: >-
    The pack suggests whether a patient may be eligible for a study and lists the criteria
    behind the suggestion. It never contacts patients or enrols anyone. A wrong suggestion
    can lead a coordinator to approach an ineligible patient or to miss an eligible one, so
    every result is reviewed by a person, and possible pregnancy or a possible recent
    cardiovascular event is always flagged for review.

card:
  # What every surface's status line is derived from (core/status.py).
  provenance: synthetic
  intended_use: >-
    Prescreening patients for a clinical study when their chart is opened or in a batch run:
    shows which eligibility criteria are met, not met or undetermined, so a research
    coordinator can decide whom to review first. GLYCEMIA-2 is a synthetic study written for
    this reference pack; it is not a real protocol.
  intended_users:
    - Research coordinators and study nurses
    - Investigators reviewing prescreening lists
    - Health IT and research informatics teams integrating prescreening with the EHR
  patient_population: >-
    Adults with diabetes in outpatient care whose record has coded conditions, lab results and
    medications, and English clinic notes.
  out_of_scope:
    - Enrolling patients or confirming eligibility. A person always confirms eligibility
      against the full protocol and the source documents before any contact.
    - Any real study. The criteria are synthetic and were not written or reviewed by a
      clinician; a real study needs its own criteria, reviewed by its investigators.
    - Notes in languages other than English with the default `rules` provider.
  known_failure_modes:
    - Criteria are computed only from the codes, units and names listed in
      logic/criteria.yaml. A lab result under another LOINC code, a unit without a declared
      conversion, or a condition under an unlisted code is `unknown` or not found. A metformin
      brand name (such as Glucophage) is not matched, so the patient is wrongly `not_eligible`.
      On the bundled local-site example (datasets/trial-local-site-example.jsonl), which has
      both, plus Spanish notes, eligibility is answered wrong far more often than on the
      benchmark (`mendari eval mendari/clinical-trial-prescreener --dataset
      datasets/trial-local-site-example.jsonl` compares it with the benchmark, by label and by
      subgroup). Add a site's codes, units and names before use, and validate locally.
    - An incomplete medication list reads as "not on metformin", which fails a criterion.
    - Old data is not used. An HbA1c older than 90 days or an eGFR older than 365 days gives
      `unknown`, so the patient needs review rather than being guessed.
    - The default note rules are English keyword patterns with a fixed-window negation and
      family-member heuristic. On hand-written notes they found 15/15 exclusions in the set
      they were written on but 8/12 in the held-out set (all 4 pregnancies; 1 of 2
      pancreatitis, 1 of 3 cancer treatments, 2 of 3 recent cardiovascular events). They miss
      most notes in other languages and misread Spanish negation ("Sin antecedentes de
      pancreatitis"), and cannot compare dates written in the text, so any mention of a
      heart attack or stroke without a recency cue is flagged for review. That flag also
      tips the overall result to `not_eligible` at about 50 % confidence, which keeps the
      patient-view card silent for a patient who may be a candidate (2 of 24 held-out
      patients). The rules are an offline fallback, not a deployment choice.
    - Deploy with a model reading the notes. In the provider comparison (measured on an
      earlier version), Jev and each LLM alone found every held-out exclusion; adding the
      rules to a model (`rules_and_jev`, `rules_and_llm`) kept every exclusion but answered
      eligibility wrong more often, held out and at the local site, through the rules' flags
      and Spanish negation errors. If the model is unavailable the pack abstains and
      the coordinator screens the chart as usual; nothing is automated at risk level 2.
    - The overall probability treats every criterion as independent. Its confidence is a
      guide for ordering review, not a calibrated chance of eligibility.
    - The public benchmark is generated from templates written with the pack, so it overstates
      real-world accuracy. The hand-written exclusion sets are the better guide, and the
      held-out one was written before the note rules.
  evidence:
    - title: Synthetic public benchmark
      note: >-
        evals/benchmark.json, the `test` split generated by
        mendari.sandbox.synthetic_trial; ground truth comes from the generated facts.
    - title: Hand-written exclusion sets
      note: >-
        data/exclusions.jsonl (used to write the note rules) and data/exclusions_holdout.jsonl
        (written before the rules and never used to tune them): pregnancy, pancreatitis, cancer
        treatment and cardiovascular events, with negated, family-history and remote look-alikes.

inputs:
  schema: schemas/input.schema.json
  fhir: fhir/mapping.yaml

questions:
  # -- structured criteria (computed in code; "yes" = the criterion is met) -------------------
  age_18_75:
    display: "Age 18 to 75"
    instructions: Is the patient aged 18 to 75 on the screening date?
    criteria:
      "yes": Aged 18 to 75 inclusive.
      "no": Younger than 18 or older than 75.
      unknown: Age is not recorded.
  t2d_diagnosis:
    display: "Type 2 diabetes diagnosis"
    instructions: Does the record contain a coded diagnosis of type 2 diabetes?
    criteria:
      "yes": Type 2 diabetes is coded (ICD-10 E11 or SNOMED CT 44054006).
      "no": Type 1 diabetes is coded and type 2 diabetes is not.
      unknown: No diabetes diagnosis is coded.
  hba1c_in_range:
    display: "HbA1c between 7.0 and 10.5 %"
    instructions: >-
      Was the most recent HbA1c in the 90 days before screening between 7.0 % and 10.5 %?
    criteria:
      "yes": The latest HbA1c in the window is 7.0 % to 10.5 % inclusive.
      "no": The latest HbA1c in the window is below 7.0 % or above 10.5 %.
      unknown: No HbA1c in the last 90 days, or one with an unrecognised code or unit.
  stable_metformin:
    display: "Metformin for at least 90 days"
    instructions: Has the patient been taking metformin for at least 90 days before screening?
    criteria:
      "yes": Metformin is active and was started at least 90 days before screening.
      "no": Metformin is not listed, was stopped, or was started less than 90 days ago.
      unknown: Metformin is active but has no start date.
  egfr_30_or_more:
    display: "eGFR 30 or more"
    instructions: >-
      Was the most recent eGFR in the 365 days before screening at least 30 mL/min/1.73m2?
    criteria:
      "yes": The latest eGFR in the window is 30 or more.
      "no": The latest eGFR in the window is below 30.
      unknown: No eGFR in the last 365 days, or one in an unrecognised unit.
  no_insulin:
    display: "No insulin in the last 90 days"
    instructions: Has the patient been off insulin for the 90 days before screening?
    criteria:
      "yes": No insulin is listed, or it ended more than 90 days before screening.
      "no": Insulin is active, or ended in the last 90 days.
      unknown: Cannot tell from the medication list.
  no_recent_cv_event:
    display: "No heart attack or stroke in 180 days"
    instructions: >-
      Is the record free of a coded heart attack or stroke with onset in the 180 days before
      screening?
    criteria:
      "yes": No heart attack or stroke is coded, or only ones with onset more than 180 days ago.
      "no": A heart attack or stroke is coded with onset in the last 180 days.
      unknown: A heart attack or stroke is coded without an onset date.

  # -- exclusions documented in the notes ("yes" = the exclusion is documented) --------------
  # Each asks one literal question; the criteria spell out the look-alikes that do not count.
  note_pregnancy:
    display: "Notes: pregnant or breastfeeding"
    type: boolean
    instructions: Do the notes say that the patient is pregnant or breastfeeding now?
    criteria:
      "yes": >-
        The patient is pregnant now (a confirmed pregnancy, weeks of gestation, or an expected
        delivery) or is breastfeeding now.
      "no": >-
        Anything else: no mention, a negative pregnancy test, a past pregnancy, plans to become
        pregnant, menopause, or someone else's pregnancy, such as a partner's.
  note_pancreatitis:
    display: "Notes: pancreatitis ever"
    type: boolean
    instructions: Do the notes say that the patient has ever had pancreatitis?
    criteria:
      "yes": The patient has had acute or chronic pancreatitis, at any time.
      "no": >-
        No mention, pancreatitis denied or ruled out, or pancreatitis in a family member.
  note_active_cancer_treatment:
    display: "Notes: cancer treatment now"
    type: boolean
    instructions: Do the notes say that the patient is receiving treatment for cancer now?
    criteria:
      "yes": >-
        Chemotherapy, radiation, immunotherapy, targeted or hormone therapy for cancer is
        ongoing, or has started and not finished.
      "no": >-
        No mention, cancer in remission, treatment finished, surveillance only, a cancer that
        needed no further treatment, or cancer in a family member.
  note_recent_cv_event:
    display: "Notes: heart attack or stroke in 6 months"
    type: boolean
    instructions: >-
      Do the notes say that the patient had a heart attack, stroke or acute coronary syndrome
      in the 6 months before the screening date?
    criteria:
      "yes": >-
        The patient had a heart attack (including NSTEMI or STEMI), a stroke or an acute
        coronary syndrome in the 6 months before the screening date.
      "no": >-
        No mention, an event more than 6 months before the screening date, symptoms that were
        found not to be a heart attack or stroke, or an event in a family member.

  # -- the prescreen result --------------------------------------------------------------------
  eligibility:
    display: "Prescreen result"
    instructions: What is the prescreen result for the GLYCEMIA-2 study?
    criteria:
      candidate: >-
        Every structured criterion is met and the notes document no exclusion. A research
        coordinator confirms eligibility before any contact.
      not_eligible: A structured criterion is not met, or the notes document an exclusion.
      needs_review: No criterion fails, but at least one cannot be determined from the record.
    derive:
      from:
        - age_18_75
        - t2d_diagnosis
        - hba1c_in_range
        - stable_metformin
        - egfr_30_or_more
        - no_insulin
        - no_recent_cv_event
        - note_pregnancy
        - note_pancreatitis
        - note_active_cancer_treatment
        - note_recent_cv_event
      table:
        - any: "no"
          in:
            - age_18_75
            - t2d_diagnosis
            - hba1c_in_range
            - stable_metformin
            - egfr_30_or_more
            - no_insulin
            - no_recent_cv_event
          then: not_eligible
        - any: "yes"
          in:
            - note_pregnancy
            - note_pancreatitis
            - note_active_cancer_treatment
            - note_recent_cv_event
          then: not_eligible
        - {any: unknown, then: needs_review}
        - {else: candidate}

providers:
  structured:
    answers:
      - age_18_75
      - t2d_diagnosis
      - hba1c_in_range
      - stable_metformin
      - egfr_30_or_more
      - no_insulin
      - no_recent_cv_event
    use: criteria
    variants:
      criteria:
        type: criteria
        config: logic/criteria.yaml
      # The same criteria in CQL, on a CQL engine ($MENDARI_CQL_URL): for sites whose
      # eligibility logic is written in CQL. CI checks every answer equals `criteria`'s.
      cql:
        type: cql
        library: logic/criteria.cql
        as_of: as_of
        expressions:
          age_18_75: "Age 18 To 75"
          t2d_diagnosis: "T2D Diagnosis"
          hba1c_in_range: "HbA1c In Range"
          stable_metformin: "Stable Metformin"
          egfr_30_or_more: "eGFR 30 Or More"
          no_insulin: "No Insulin"
          no_recent_cv_event: "No Recent CV Event"
  notes:
    answers: [note_pregnancy, note_pancreatitis, note_active_cancer_treatment, note_recent_cv_event]
    # Offline default. Deploy with a model reading the notes (jev or llm): see the provider
    # comparison and known_failure_modes.
    use: rules
    variants:
      rules:
        type: rules
        config: logic/note_rules.yaml
      jev:
        type: jev
        timeout_ms: 5000
        state_fields: [as_of, notes]
      llm:
        type: llm
        reasoning_effort: low
        state_fields: [as_of, notes]
      rules_and_jev:
        # Both read the notes; whichever gives an exclusion the higher probability decides.
        type: any_of
        escalate:
          note_pregnancy: "yes"
          note_pancreatitis: "yes"
          note_active_cancer_treatment: "yes"
          note_recent_cv_event: "yes"
        members:
          rules:
            type: rules
            config: logic/note_rules.yaml
          jev:
            type: jev
            timeout_ms: 5000
            state_fields: [as_of, notes]
      rules_and_llm:
        type: any_of
        escalate:
          note_pregnancy: "yes"
          note_pancreatitis: "yes"
          note_active_cancer_treatment: "yes"
          note_recent_cv_event: "yes"
        members:
          rules:
            type: rules
            config: logic/note_rules.yaml
          llm:
            type: llm
            reasoning_effort: low
            state_fields: [as_of, notes]

policy: policy.yaml

evaluation:
  datasets:
    calibration: data/calibration.jsonl
    test: data/test.jsonl
    # Hand-written notes with exclusions and look-alikes; the note rules were written on this set.
    exclusions: data/exclusions.jsonl
    # Written before the note rules; never used to write or tune them.
    exclusions_holdout: data/exclusions_holdout.jsonl
  benchmark: evals/benchmark.json
  benchmark_dataset: test
  critical:
    - {question: note_pregnancy, label: "yes"}
    - {question: note_pancreatitis, label: "yes"}
    - {question: note_active_cancer_treatment, label: "yes"}
    - {question: note_recent_cv_event, label: "yes"}
    - {question: egfr_30_or_more, label: "no"}
    - {question: no_recent_cv_event, label: "no"}
  subgroups: [site, language, sex, age_band]
  degradation_tolerance: 0.03

tests: tests/cases.yaml

audit:
  store_input: full

cds_hooks:
  hook: patient-view
  title: GLYCEMIA-2 prescreen (synthetic study)
  description: >-
    When a chart is opened, suggests whether the patient may be a candidate for the synthetic
    GLYCEMIA-2 study, with the criteria behind the suggestion.
  prefetch:
    patient: Patient/{{context.patientId}}
    conditions: Condition?patient={{context.patientId}}
    observations: Observation?patient={{context.patientId}}&code=4548-4,33914-3,62238-1
    medications: MedicationStatement?patient={{context.patientId}}
    notes: DocumentReference?patient={{context.patientId}}&category=clinical-note
  card:
    summaries:
      candidate: "Possible GLYCEMIA-2 candidate: confirm eligibility"
      needs_review: "GLYCEMIA-2: some criteria need a chart review"
      not_eligible: "GLYCEMIA-2: not eligible"
      none: "GLYCEMIA-2: no prescreen result; manual chart review"
    indicators: {candidate: info, needs_review: info, not_eligible: info, none: info}
    # A chart that is clearly not eligible stays quiet.
    show: [candidate, needs_review]
    suggestion: Create a prescreening review task

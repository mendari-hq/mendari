# Decision policy for AI Guard.
#
# Risk level 2: a passing draft goes to a clinician for one-step approval; releasing it
# automatically needs a recorded governance override. Blocking is automatic and comes first.

primary: verdict

thresholds:
  auto: 0.90
  review: 0.40  # below this there is no suggestion; a clinician reads the draft as usual

labels:
  review:
    allow_auto: false

# Never release on keyword rules alone: they miss phrasings they do not list (lesson
# 2026-09-29). With another screen, drafts are held for a clinician.
automation_requires:
  screen: [rules_and_jev, rules_and_llm]

rules:
  - name: possible-block
    when:
      question: verdict
      labels: [block]
      # P(block), whichever label is most likely. Deliberately low: a false block costs a
      # nurse a message to answer; a missed emergency or overdose sent to a patient costs far
      # more.
      min_probability: 0.3
    outcome: BLOCK
    priority: urgent
    reason: >-
      The draft may miss an emergency, give a dose above the maximum, or give unsafe advice.
      Do not send it.

fallback: >-
  Do not send the draft. Route the patient's message to nurse triage now; if it may describe an
  emergency, the nurse contacts the patient directly.
default_priority: routine
